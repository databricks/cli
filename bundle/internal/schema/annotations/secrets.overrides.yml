# Hand-written documentation for fields that the upstream API spec
# (.codegen/cli.json) already defines: description overrides, gap fills for
# undocumented upstream fields, and deprecations the spec does not carry. Every
# entry here is a candidate to move upstream (fix the proto / OpenAPI docs) and
# then delete. "task generate-schema" routes entries between the .overrides
# files and the other hand-written files by whether the field exists upstream,
# so an entry added elsewhere lands here on the next run.
$fields:
  "catalog_name":
    "description": |-
      The name of the catalog where the schema and the secret reside.
  "comment":
    "description": |-
      User-provided free-form text description of the secret.
  "expire_time":
    "description": |-
      User-provided expiration time of the secret. Purely informational; does not trigger automatic actions.
  "name":
    "description": |-
      The name of the secret, relative to its parent schema.
  "schema_name":
    "description": |-
      The name of the schema where the secret resides.
  "value":
    "description": |-
      The secret value to store. Must be a variable reference (e.g. ${var.my_secret}) to prevent plain-text secrets in configuration files.
