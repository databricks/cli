# Hand-written documentation the CLI owns for the bundle configuration JSON
# schema. See README.md in this directory for the format. "task generate-schema"
# normalizes this file and drops entries for fields that no longer exist; it
# never adds content here.
description: |-
  The quality monitor definitions for the bundle, where each key is the name of the quality monitor.
markdown_description: |-
  The quality monitor definitions for the bundle, where each key is the name of the quality monitor. See [\_](/dev-tools/bundles/resources.md#quality_monitors).
$type:
  "markdown_description": |-
    The quality_monitor resource allows you to define a Unity Catalog [table monitor](/api/workspace/qualitymonitors/create). For information about monitors, see [_](/machine-learning/model-serving/monitor-diagnose-endpoints.md).
  "markdown_examples": |-
    The following example defines a quality monitor:

    ```yaml
    resources:
      quality_monitors:
        my_quality_monitor:
          table_name: dev.mlops_schema.predictions
          output_schema_name: ${bundle.target}.mlops_schema
          assets_dir: /Users/${workspace.current_user.userName}/databricks_lakehouse_monitoring
          inference_log:
            granularities: [1 day]
            model_id_col: model_id
            prediction_col: prediction
            label_col: price
            problem_type: PROBLEM_TYPE_REGRESSION
            timestamp_col: timestamp
          schedule:
            quartz_cron_expression: 0 0 8 * * ? # Run Every day at 8am
            timezone_id: UTC
    ```
$fields:
  "lifecycle":
    "description": |-
      Settings that control the deployment lifecycle of the resource, such as preventing it from being destroyed.
