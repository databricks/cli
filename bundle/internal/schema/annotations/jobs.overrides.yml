# Hand-written documentation for fields that the upstream API spec
# (.codegen/cli.json) already defines: description overrides, gap fills for
# undocumented upstream fields, and deprecations the spec does not carry. Every
# entry here is a candidate to move upstream (fix the proto / OpenAPI docs) and
# then delete. "task generate-schema" routes entries between the .overrides
# files and the other hand-written files by whether the field exists upstream,
# so an entry added elsewhere lands here on the next run.
$fields:
  "environments":
    "$fields":
      "spec":
        "$fields":
          "dependencies":
            "description": |-
              List of pip dependencies, as supported by the version of pip in this environment.
  "job_clusters":
    "$fields":
      "new_cluster":
        "$fields":
          "azure_attributes":
            "$fields":
              "log_analytics_info":
                "$fields":
                  "log_analytics_primary_key":
                    "description": |-
                      The primary key for the Azure Log Analytics agent configuration
                  "log_analytics_workspace_id":
                    "description": |-
                      The workspace ID for the Azure Log Analytics agent configuration
          "init_scripts":
            "$fields":
              "abfss":
                "description": |-
                  Contains the Azure Data Lake Storage destination path
  "run_as":
    "$fields":
      "service_principal_name":
        "description": |-
          The application ID of an active service principal. Setting this field requires the `servicePrincipal/user` role.
      "user_name":
        "description": |-
          The email of an active workspace user. Non-admin users can only set this field to their own email.
