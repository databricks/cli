# Hand-written documentation the CLI owns for the bundle configuration JSON
# schema. See README.md in this directory for the format. "task generate-schema"
# normalizes this file and drops entries for fields that no longer exist; it
# never adds content here.
description: |-
  The Postgres Data API definitions for the bundle, where each key is the name of the Data API. Each entry enables and configures the Data API (a REST interface) of a database on a Lakebase Autoscaling branch. Removing an entry turns off the Data API; the database and its data are not affected.
$fields:
  "lifecycle":
    "description": |-
      Settings that control the deployment lifecycle of the resource, such as preventing it from being destroyed.
  "parent":
    "description": |-
      The database whose Data API this manages. Format: projects/{project_id}/branches/{branch_id}/databases/{database_id}
