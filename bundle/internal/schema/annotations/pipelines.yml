# Hand-written documentation the CLI owns for the bundle configuration JSON
# schema. See README.md in this directory for the format. "task generate-schema"
# normalizes this file and drops entries for fields that no longer exist; it
# never adds content here.
description: |-
  The pipeline definitions for the bundle, where each key is the name of the pipeline.
markdown_description: |-
  The pipeline definitions for the bundle, where each key is the name of the pipeline. See [\_](/dev-tools/bundles/resources.md#pipelines).
$type:
  "markdown_description": |-
    This resource allows you to create [pipelines](/api/workspace/pipelines/create). For information about pipelines, see [_](/dlt/index.md). For a tutorial that uses the Declarative Automation Bundles template to create a pipeline, see [_](/dev-tools/bundles/pipelines-tutorial.md).
  "markdown_examples": |-
    The following example defines a pipeline with the resource key `hello-pipeline`:

    ```yaml
    resources:
      pipelines:
        hello-pipeline:
          name: hello-pipeline
          clusters:
            - label: default
              num_workers: 1
          development: true
          continuous: false
          channel: CURRENT
          edition: CORE
          photon: false
          libraries:
            - notebook:
                path: ./pipeline.py
    ```
$fields:
  "cascade_on_destroy":
    "description": |-
      Whether destroying the pipeline also deletes its datasets (MVs, STs, Views). Defaults to true (the server default). Set to false to retain the datasets when the pipeline is deleted. Only affects the delete operation.
  "lifecycle":
    "description": |-
      Settings that control the deployment lifecycle of the resource, such as preventing it from being destroyed.
  "permissions":
    "description": |-
      The permissions to apply to this resource.
    "markdown_description": |-
      A Sequence of permissions to apply to this resource, where each item grants a permission `level` to a single `user_name`, `group_name`, or `service_principal_name`. A principal cannot be set in both a resource's `permissions` and the top-level `permissions` mapping.

      See [\_](/dev-tools/bundles/settings.md#permissions) and [\_](/dev-tools/bundles/permissions.md).
    "markdown_examples": |-
      ```yaml
      permissions:
        - level: CAN_VIEW
          group_name: test-group
        - level: CAN_MANAGE
          user_name: someone@example.com
        - level: CAN_RUN
          service_principal_name: 123456-abcdef
      ```
    "$fields":
      "group_name":
        "description": |-
          The name of the group granted the permission level.
      "level":
        "description": |-
          The permission level to apply. The allowed levels depend on the resource type.
      "service_principal_name":
        "description": |-
          The name of the service principal granted the permission level.
      "user_name":
        "description": |-
          The name of the user granted the permission level.
