# Hand-written documentation for fields that the upstream API spec
# (.codegen/cli.json) already defines: description overrides, gap fills for
# undocumented upstream fields, and deprecations the spec does not carry. Every
# entry here is a candidate to move upstream (fix the proto / OpenAPI docs) and
# then delete. "task generate-schema" routes entries between the .overrides
# files and the other hand-written files by whether the field exists upstream,
# so an entry added elsewhere lands here on the next run.
$fields:
  "attributes":
    "description": |-
      The desired API-exposed Postgres role attributes to associate with the role.
    "$fields":
      "bypassrls":
        "description": |-
          Grants the Postgres `BYPASSRLS` attribute, which lets the role bypass every row-level security policy.
      "createdb":
        "description": |-
          Grants the Postgres `CREATEDB` attribute, which lets the role create databases.
      "createrole":
        "description": |-
          Grants the Postgres `CREATEROLE` attribute, which lets the role create, alter, and drop other roles.
  "auth_method":
    "description": |-
      How the role is authenticated when connecting to Postgres. If left unspecified, a meaningful authentication method is derived from the identity_type.
  "identity_type":
    "description": |-
      The type of the Databricks managed identity that this Role represents. Leave empty to create a regular Postgres role not associated with a Databricks identity.
  "membership_roles":
    "description": |-
      Standard roles that this role is a member of.
  "postgres_role":
    "description": |-
      The name of the Postgres role. Required when creating the role.
