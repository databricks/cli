# Hand-written documentation the CLI owns for the bundle configuration JSON
# schema. See README.md in this directory for the format. "task generate-schema"
# normalizes this file and drops entries for fields that no longer exist; it
# never adds content here.
description: |-
  The Postgres role definitions for the bundle, where each key is the name of the role. Each entry defines a role on a Lakebase Autoscaling branch, optionally backed by a Databricks identity.
$fields:
  "lifecycle":
    "description": |-
      Settings that control the deployment lifecycle of the resource, such as preventing it from being destroyed.
  "parent":
    "description": |-
      The branch where this role is created. Format projects/{project_id}/branches/{branch_id}.
  "replace_existing":
    "description": |-
      When true, take over an existing role with the same ID instead of failing with an ALREADY_EXISTS error. Use it to bring a role that already exists on the branch (for example, one inherited from the parent branch) under bundle management. Only takes effect when the role is created.
  "role_id":
    "description": |-
      The user-specified role ID; becomes the final component of the role's resource name. Must be 4-63 characters, lowercase letters, numbers, and hyphens (RFC 1123).
