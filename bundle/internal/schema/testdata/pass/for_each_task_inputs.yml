bundle:
  name: for_each_task_inputs

variables:
  inputs:
    default: '["from_variable"]'

resources:
  jobs:
    fan:
      name: for_each_task_inputs
      tasks:
        - task_key: array
          for_each_task:
            inputs: [first, second]
            task:
              task_key: array_inner
              notebook_task:
                notebook_path: /notebook
        - task_key: objects
          for_each_task:
            inputs:
              - name: first
                count: 3
                enabled: true
            task:
              task_key: objects_inner
              notebook_task:
                notebook_path: /notebook
        - task_key: empty
          for_each_task:
            inputs: []
            task:
              task_key: empty_inner
              notebook_task:
                notebook_path: /notebook
        - task_key: string
          for_each_task:
            inputs: '["first", "second"]'
            task:
              task_key: string_inner
              notebook_task:
                notebook_path: /notebook
        - task_key: variable
          for_each_task:
            inputs: ${var.inputs}
            task:
              task_key: variable_inner
              notebook_task:
                notebook_path: /notebook

targets:
  override:
    resources:
      jobs:
        fan:
          tasks:
            - task_key: array
              for_each_task:
                inputs: [overridden]
                task:
                  task_key: array_inner
                  notebook_task:
                    notebook_path: /notebook
