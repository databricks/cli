# version_id is set to the current DMS deployment version on every deploy, so
# it changes constantly. Ignoring it as a local and remote change keeps that
# churn from driving an update or showing as drift on its own; when the job is
# updated for any other reason, DoUpdate sends the full config via Reset, so
# the current version_id is still recorded. deployment_id is intentionally
# left out: it is stable across versions, so a change to it is worth showing.
fields:
  deployment.version_id:
    action: ignore_local
    reason: auto
    ignore_remote: auto
  # Same as clusters.{aws,azure,gcp}_attributes — see clusters/resource_cluster.go#L361-L363
  # s.SchemaPath("aws_attributes").SetSuppressDiff()
  # s.SchemaPath("azure_attributes").SetSuppressDiff()
  # s.SchemaPath("gcp_attributes").SetSuppressDiff()
  tasks[*].new_cluster.aws_attributes:
    ignore_remote: managed
  tasks[*].new_cluster.azure_attributes:
    ignore_remote: managed
  tasks[*].new_cluster.gcp_attributes:
    ignore_remote: managed
  tasks[*].for_each_task.task.new_cluster.aws_attributes:
    ignore_remote: managed
  tasks[*].for_each_task.task.new_cluster.azure_attributes:
    ignore_remote: managed
  tasks[*].for_each_task.task.new_cluster.gcp_attributes:
    ignore_remote: managed
  job_clusters[*].new_cluster.aws_attributes:
    ignore_remote: managed
  job_clusters[*].new_cluster.azure_attributes:
    ignore_remote: managed
  job_clusters[*].new_cluster.gcp_attributes:
    ignore_remote: managed
  # The Jobs API accepts apply_policy_default_values but does not return it
  # in GET responses, so the remote is always nil even when the user sets it.
  # Ignore remote-side nil so old==new (no user change) doesn't trigger drift.
  tasks[*].new_cluster.apply_policy_default_values:
    ignore_remote: not_returned_by_api
  tasks[*].for_each_task.task.new_cluster.apply_policy_default_values:
    ignore_remote: not_returned_by_api
  job_clusters[*].new_cluster.apply_policy_default_values:
    ignore_remote: not_returned_by_api
  # The Jobs API accepts trigger.table_update.condition but never returns it
  # in GET responses (verified for both ANY_UPDATED and ALL_UPDATED), so
  # without this every plan after a successful deploy reports an update.
  # https://github.com/databricks/cli/issues/6315
  trigger.table_update.condition: [input_only]
  triggers[*].table_update.condition: [input_only]
  tasks[*].new_cluster:
    remote_additions_when: policy_id
  tasks[*].for_each_task.task.new_cluster:
    remote_additions_when: policy_id
  job_clusters[*].new_cluster:
    remote_additions_when: policy_id
  # Same as clusters.enable_elastic_disk — see clusters/resource_cluster.go#L331
  # s.SchemaPath("enable_elastic_disk").SetComputed()
  tasks[*].new_cluster.enable_elastic_disk: [backend_default]
  tasks[*].for_each_task.task.new_cluster.enable_elastic_disk: [backend_default]
  job_clusters[*].new_cluster.enable_elastic_disk: [backend_default]
  tasks[*].new_cluster.enable_local_disk_encryption: [backend_default]
  tasks[*].for_each_task.task.new_cluster.enable_local_disk_encryption: [backend_default]
  job_clusters[*].new_cluster.enable_local_disk_encryption: [backend_default]
  tasks[*].new_cluster.node_type_id: [backend_default]
  tasks[*].for_each_task.task.new_cluster.node_type_id: [backend_default]
  job_clusters[*].new_cluster.node_type_id: [backend_default]
  tasks[*].new_cluster.driver_node_type_id: [backend_default]
  tasks[*].for_each_task.task.new_cluster.driver_node_type_id: [backend_default]
  job_clusters[*].new_cluster.driver_node_type_id: [backend_default]
  tasks[*].new_cluster.driver_instance_pool_id: [backend_default]
  tasks[*].for_each_task.task.new_cluster.driver_instance_pool_id: [backend_default]
  job_clusters[*].new_cluster.driver_instance_pool_id: [backend_default]
  format:
    backend_values: ["MULTI_TASK", "SINGLE_TASK"]
  "tasks[*].run_if":
    backend_values: ["ALL_SUCCESS"]
  # https://github.com/databricks/terraform-provider-databricks/blob/4eba541abe1a9f50993ea7b9dd83874207e224a1/jobs/resource_job.go#L639
  # s.SchemaPath("task", "run_if").SetSuppressDiffWithDefault(jobs.RunIfAllSuccess)
  "tasks[*].for_each_task.task.run_if":
    backend_values: ["ALL_SUCCESS"]
  # https://github.com/databricks/terraform-provider-databricks/blob/4eba541abe1a9f50993ea7b9dd83874207e224a1/jobs/resource_job.go#L640
  # s.SchemaPath("task", "for_each_task", "task", "run_if").SetSuppressDiffWithDefault(jobs.RunIfAllSuccess)
  run_as: [backend_default]
  tasks[*].notebook_task.source: [backend_default]
  tasks[*].for_each_task.task.notebook_task.source: [backend_default]
  tasks[*].spark_python_task.source: [backend_default]
  tasks[*].for_each_task.task.spark_python_task.source: [backend_default]
  tasks[*].sql_task.file.source: [backend_default]
  tasks[*].for_each_task.task.sql_task.file.source: [backend_default]
  tasks[*].dbt_task.source: [backend_default]
  tasks[*].for_each_task.task.dbt_task.source: [backend_default]
  tasks[*].new_cluster.data_security_mode: [backend_default]
  tasks[*].for_each_task.task.new_cluster.data_security_mode: [backend_default]
  job_clusters[*].new_cluster.data_security_mode: [backend_default]
