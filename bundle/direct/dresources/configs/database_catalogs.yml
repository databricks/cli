# The Database API has no UpdateDatabaseCatalog endpoint (the generated SDK
# method is a stub that returns 501 NOT_IMPLEMENTED), so this resource
# implements no DoUpdate and every settable field must recreate. The
# complementary ignore_remote_changes block in database_catalogs.generated.yml
# handles the read side (create_database_if_not_exists is input-only, uid is
# output-only) so no-op deploys stay idempotent.
action: immutable
fields:
  name:
    action: id
