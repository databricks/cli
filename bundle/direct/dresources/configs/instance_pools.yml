# Field behaviors follow the TF provider tags cross-referenced with the edit API (compute.EditInstancePool):
# https://github.com/databricks/terraform-provider-databricks/blob/main/pools/resource_instance_pool.go
fields:
  # Backend fills cloud defaults the user omits; treated as managed like clusters above.
  aws_attributes:
    ignore_remote: managed
  azure_attributes:
    ignore_remote: managed
  gcp_attributes:
    ignore_remote: managed
  # force_new and not accepted by /instance-pools/edit.
  disk_spec:
    action: immutable
  node_type_flexibility:
    action: immutable
  preloaded_spark_versions:
    action: immutable
  preloaded_docker_images:
    action: immutable
  # Defaults to true server-side.
  enable_elastic_disk:
    backend_default: true
  # Backend applies a default of 60 minutes when the field is omitted.
  idle_instance_autotermination_minutes:
    backend_values: [60]
  max_capacity:
    backend_default: true
