fields:
  storage:
    action: immutable
  ingestion_definition.connection_name:
    action: immutable
  ingestion_definition.ingestion_gateway_id:
    action: immutable
  # https://github.com/databricks/terraform-provider-databricks/blob/4eba541abe1a9f50993ea7b9dd83874207e224a1/pipelines/resource_pipeline.go#L204
  gateway_definition.connection_id:
    action: immutable
  gateway_definition.connection_name:
    action: immutable
  gateway_definition.gateway_storage_catalog:
    action: immutable
  gateway_definition.gateway_storage_schema:
    action: immutable
  # https://github.com/databricks/terraform-provider-databricks/blob/4eba541abe1a9f50993ea7b9dd83874207e224a1/pipelines/resource_pipeline.go#L209
  ingestion_definition.ingest_from_uc_foreign_catalog:
    action: immutable
  # See jobs above: version_id is set on every deploy, so it is ignored as a
  # local/remote change. deployment_id is left out so a change to it still shows.
  deployment.version_id:
    ignore_remote: auto
    action: ignore_local
    reason: auto
  # "id" is handled in a special way before any fields changed
  # However, it is also part of RemotePipeline via CreatePipeline.
  # Thus it shows up as a remote change since we don't set on the object.
  # "id" is output-only, providing it in config would be a mistake
  id:
    ignore_remote: "!drop"
    action: ignore_local
    reason: "!drop"
  # QQQ should this be here? When run_as is explicitly set, the GET response echoes it back
  # as a structured run_as.user_name (verified on e2-dogfood with a real user), so it may not
  # be truly input-only. The explicit-set case could not be confirmed on aws-cli, azure-cli,
  # or gcp-cli: those envs authenticate as a service principal that lacks servicePrincipal.user
  # on itself, so it can't self-bind run_as. In the default (unset) case on all three clouds,
  # GET returns only the flat run_as_user_name and no structured run_as.
  run_as:
    ignore_remote: input_only
  # Carried by CreatePipeline/EditPipeline but never returned by GET, so remote
  # always reads back false and a config value of true never converges.
  allow_duplicate_names:
    ignore_remote: input_only
  # Pipelines adds ANSI mode to the configuration map when it is omitted.
  configuration['spark.sql.ansi.enabled']:
    backend_values: ["true"]
  clusters[*].node_type_id:
    backend_default: true
  # https://github.com/databricks/terraform-provider-databricks/blob/4eba541abe1a9f50993ea7b9dd83874207e224a1/pipelines/resource_pipeline.go#L218
  # s.SchemaPath("cluster", "node_type_id").SetComputed()
  # https://github.com/databricks/terraform-provider-databricks/blob/4eba541abe1a9f50993ea7b9dd83874207e224a1/pipelines/resource_pipeline.go#L219
  # s.SchemaPath("cluster", "driver_node_type_id").SetComputed()
  clusters[*].driver_node_type_id:
    backend_default: true
  # https://github.com/databricks/terraform-provider-databricks/blob/4eba541abe1a9f50993ea7b9dd83874207e224a1/pipelines/resource_pipeline.go#L220
  # s.SchemaPath("cluster", "enable_local_disk_encryption").SetComputed()
  clusters[*].enable_local_disk_encryption:
    backend_default: true
  # https://github.com/databricks/terraform-provider-databricks/blob/4eba541abe1a9f50993ea7b9dd83874207e224a1/pipelines/resource_pipeline.go#L229-L230
  # s.SchemaPath("event_log", "catalog").SetComputed()
  # s.SchemaPath("event_log", "schema").SetComputed()
  event_log.catalog:
    backend_default: true
  event_log.schema:
    backend_default: true
