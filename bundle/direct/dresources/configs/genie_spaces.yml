# The field-overlap heuristic ties GenieSpace and GenieUpdateSpaceRequest and
# breaks the tie toward GenieUpdateSpaceRequest because GenieSpace carries one
# extra field (space_id). Pin GenieSpace: its etag is OUTPUT_ONLY (server-managed),
# so we ignore remote changes to it, whereas on GenieUpdateSpaceRequest etag is a
# caller-supplied optimistic-concurrency token and that behavior is lost.
api_type: dashboards.GenieSpace

# Drift is detected by comparing the etag the last deploy recorded against the
# remote one (see OverrideChangeDesc). Covered by bundle/resources/genie_spaces/simple.
etag_field: etag

ignore_remote_changes:
  # serialized_space locally (structured YAML) and remotely (JSON string) will differ
  # textually, so we cannot meaningfully compare them for drift.
  - field: serialized_space
    reason: etag_based

# "serialized_space" holds inlined Genie space JSON that is never read back
# from state, so we persist only its content hash.
hashed_fields:
  - serialized_space
