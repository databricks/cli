fields:
  # Output-only timestamp/user fields populated by the backend on read.
  # The user never sets them, so remote-only differences are ignored here
  # rather than zeroed in RemapState.
  created_at: [mutable_output]
  created_by: [mutable_output]
  updated_at: [mutable_output]
  updated_by: [mutable_output]
  aliases: [input_only]
  name:
    action: id
    reason: terraform_compat
  catalog_name: [id]
  schema_name: [id]
  storage_location: [immutable]
  owner: [backend_default]
  full_name: [backend_default]
  metastore_id: [backend_default]
