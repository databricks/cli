fields:
  # Output-only timestamp/user fields populated by the backend on read.
  # The user never sets them, so remote-only differences are ignored here
  # rather than zeroed in RemapState.
  created_at:
    ignore_remote: output_only
  created_by:
    ignore_remote: output_only
  updated_at:
    ignore_remote: output_only
  updated_by:
    ignore_remote: output_only
  # Aliases are managed on model versions through a separate API, and DoRead
  # passes IncludeAliases=false, so GET never echoes them back. Without this a
  # config that sets aliases reports a perpetual update (remote stays empty).
  aliases:
    ignore_remote: input_only
  # The name can technically be updated without recreate. We recreate for now though
  # to match TF implementation.
  name:
    action: id
    reason: terraform_compat
  catalog_name:
    action: id
  schema_name:
    action: id
  storage_location:
    action: immutable
  # owner, full_name, metastore_id are Computed in TF (backend-set output fields).
  owner:
    backend_default: true
  full_name:
    backend_default: true
  metastore_id:
    backend_default: true
