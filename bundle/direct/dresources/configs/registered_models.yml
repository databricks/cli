ignore_remote_changes:
  # Output-only timestamp/user fields populated by the backend on read.
  # The user never sets them, so remote-only differences are ignored here
  # rather than zeroed in RemapState.
  - field: created_at
    reason: output_only
  - field: created_by
    reason: output_only
  - field: updated_at
    reason: output_only
  - field: updated_by
    reason: output_only
  # An alias is set by name and version; the backend fills in the rest on read.
  - field: aliases[*].id
    reason: output_only
  - field: aliases[*].catalog_name
    reason: output_only
  - field: aliases[*].schema_name
    reason: output_only
  - field: aliases[*].model_name
    reason: output_only
provided_id_fields:
  # The name can technically be updated without recreate. We recreate for now though
  # to match TF implementation.
  - field: name
    reason: terraform_compat
  - field: catalog_name
    reason: id_field
  - field: schema_name
    reason: id_field
recreate_on_changes:
  - field: storage_location
    reason: immutable
backend_defaults:
  # owner, full_name, metastore_id are Computed in TF (backend-set output fields).
  - field: owner
  - field: full_name
  - field: metastore_id
