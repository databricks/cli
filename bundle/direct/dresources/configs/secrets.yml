parent_id_fields:
  - field: catalog_name
    reason: parent
  - field: schema_name
    reason: parent
provided_id_fields:
  # The ID is the full name. UC cannot rename a secret; a renamed catalog or schema moves it (see
  # parent_id_fields).
  - field: name
    reason: id_field
sensitive_fields:
  - field: value
  - field: effective_value
