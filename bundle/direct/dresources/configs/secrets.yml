provided_id_fields:
  # The ID is the full name. UC cannot rename a secret, but it moves the secret with a renamed
  # catalog or schema, which re-keys it (see followsParentRename).
  - field: catalog_name
    reason: id_field
  - field: schema_name
    reason: id_field
  - field: name
    reason: id_field
sensitive_fields:
  - field: value
  - field: effective_value
