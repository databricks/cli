provided_id_fields:
  - field: catalog_name
    reason: id_field
updatable_id_fields:
  # UC lowercases identifier names; remote returns "myschema" for config "MySchema".
  - field: name
    reason: id_changes
recreate_on_changes:
  - field: storage_root
    reason: immutable
normalize_slash:
  - field: storage_root
    reason: uc_strips_trailing_slash
backend_defaults:
  # UC auto-populates unity.catalog.managed.<format>.defaults.* keys after create.
  # Without this, every subsequent plan produces an Update whose payload is empty,
  # and UC rejects it with "UpdateSchema Nothing to update".
  - field: properties['unity.catalog.managed.*.defaults.*']
ignore_local_changes:
  # Recorded from the backend (see InternalID); config never sets it.
  - field: schema_id
    reason: internal_id
ignore_remote_changes:
  # The spec does not mark schema_id output-only, so no generated rule covers a state
  # recorded before schema_id was.
  - field: schema_id
    reason: internal_id
