provided_id_fields:
  # parent + mcp_service_id compose the server-derived resource name
  # (mcp-services/{catalog}.{schema}.{mcp_service}), which is the ID the
  # resource is fetched by. Both are immutable; a local change recreates.
  # DoRead reconstructs them from the returned name, so a remote-only
  # difference can only be normalization and is skipped.
  - field: parent
    reason: id_field
  - field: mcp_service_id
    reason: id_field
