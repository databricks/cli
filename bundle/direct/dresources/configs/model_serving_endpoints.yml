# TF implementation: https://github.com/databricks/terraform-provider-databricks/blob/6c106e8e7052bb2726148d66309fd460ed444236/mlflow/resource_mlflow_experiment.go#L22
fields:
  name: [id]
  description: [immutable]
  config.auto_capture_config.catalog_name: [immutable]
  config.auto_capture_config.schema_name: [immutable]
  config.auto_capture_config.table_name_prefix: [immutable]
  route_optimized: [immutable]
  budget_policy_id:
    ignore_remote: no_update_api
    action: ignore_local
    reason: no_update_api
  # table_names creates a profile and is not returned; inference_table_config round-trips.
  # The spec annotated this input_only in the v0.171 spec but no longer does, so the rule
  # has to be manual again.
  telemetry_config.table_names: [input_only]
  rate_limits:
    action: ignore_local
    reason: not_implemented
  # Remote-only telemetry is reported as a change at this parent path.
  telemetry_config: [backend_default]
  config.served_entities[*].name: [backend_default]
  config.served_entities[*].workload_type: [backend_default]
  config.auto_capture_config.enabled: [backend_default]
  config.traffic_config: [backend_default]
