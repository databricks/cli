provided_id_fields:
  # parent and endpoint_id are immutable (part of hierarchical name, not in API spec)
  - field: parent
    reason: id_field
  - field: endpoint_id
    reason: id_field
ignore_local_changes:
  # replace_existing only takes effect on create; toggling it later is a no-op.
  - field: replace_existing
    reason: "input_only; cannot be updated after create"
stable_output_fields:
  # name ("projects/{p}/branches/{b}/endpoints/{endpoint_id}") is backend-assigned
  # at creation and immutable; see the stable_output_fields doc in config.go and ES-2202624.
  - field: name
