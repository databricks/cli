provided_id_fields:
  # parent and branch_id are immutable (part of hierarchical name, not in API spec)
  - field: parent
    reason: id_field
  - field: branch_id
    reason: id_field
ignore_local_changes:
  # replace_existing only takes effect on create; toggling it later is a no-op.
  - field: replace_existing
    reason: "input_only; cannot be updated after create"
stable_output_fields:
  # name ("projects/{project_id}/branches/{branch_id}") is backend-assigned at
  # creation and immutable. Lets ${resources.postgres_branches.X.name} resolve
  # during an in-place update instead of being delayed, so roles/databases that
  # reference it as their parent are not recreated spuriously. See ES-2202624.
  - field: name
    reason: immutable backend-assigned identity
