fields:
  # parent and branch_id are immutable (part of hierarchical name, not in API spec)
  parent:
    action: id
  branch_id:
    action: id
  # replace_existing only takes effect on create; toggling it later is a no-op.
  replace_existing:
    action: ignore_local
    reason: input_only
  # name ("projects/{project_id}/branches/{branch_id}") is backend-assigned at
  # creation and immutable; see the stable_output_fields doc in config.go and ES-2202624.
  name:
    stable_output: true
