provided_id_fields:
  # parent + model_service_id compose the server-derived resource name
  # (model-services/{catalog}.{schema}.{model_service}), which is the ID the
  # resource is fetched by. Both are immutable; a local change recreates.
  # DoRead reconstructs them from the returned name, so a remote-only
  # difference can only be normalization and is skipped.
  - field: parent
    reason: id_field
  - field: model_service_id
    reason: id_field
