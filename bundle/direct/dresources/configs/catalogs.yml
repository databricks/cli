recreate_on_changes:
  - field: storage_root
    reason: immutable
  - field: connection_name
    reason: immutable
  - field: provider_name
    reason: immutable
  - field: share_name
    reason: immutable
normalize_slash:
  # UC strips a trailing slash from storage_root on create. The TF provider
  # suppresses the same slash-only drift on this field (ucDirectoryPathSlashOnlySuppressDiff):
  # https://github.com/databricks/terraform-provider-databricks/blob/main/catalog/resource_catalog.go
  - field: storage_root
    reason: uc_strips_trailing_slash
updatable_id_fields:
  - field: name
    reason: id_changes
backend_defaults:
  # Skip properties present only on the remote when the config declares none,
  # including unity.catalog.managed.*.defaults.* keys UC sets after create.
  # The SDK cannot send an empty map to clear them. Declared properties
  # still take part in drift detection.
  - field: properties
