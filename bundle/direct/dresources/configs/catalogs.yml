recreate_on_changes:
  - field: storage_root
    reason: immutable
  - field: connection_name
    reason: immutable
  - field: provider_name
    reason: immutable
  - field: share_name
    reason: immutable
normalize_slash:
  # UC strips a trailing slash from storage_root on create. The TF provider
  # suppresses the same slash-only drift on this field (ucDirectoryPathSlashOnlySuppressDiff):
  # https://github.com/databricks/terraform-provider-databricks/blob/main/catalog/resource_catalog.go
  - field: storage_root
    reason: uc_strips_trailing_slash
updatable_id_fields:
  - field: name
    reason: id_changes
backend_defaults:
  # UC auto-populates unity.catalog.managed.<format>.defaults.* keys after create.
  - field: properties['unity.catalog.managed.*.defaults.*']
  # UC reports OPEN for a catalog created without isolation_mode and keeps the current
  # mode when an update omits it. A config without the field therefore leaves the remote
  # value alone (OPEN by default, or ISOLATED when set outside the bundle) rather than
  # forcing it back to OPEN.
  - field: isolation_mode
