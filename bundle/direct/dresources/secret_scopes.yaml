backend_defaults:
  # The Secrets API defaults scope_backend_type to DATABRICKS when not specified.
  - field: scope_backend_type
    values: ["DATABRICKS"]
provided_id_fields:
  - field: scope
    reason: id_field
recreate_on_changes:
  - field: scope_backend_type
    reason: immutable
  - field: backend_azure_keyvault
    reason: immutable
  - field: initial_manage_principal
    reason: immutable
