# version_id is set to the current DMS deployment version on every deploy, so
# it changes constantly. Ignoring it as a local and remote change keeps that
# churn from driving an update or showing as drift on its own; when the job is
# updated for any other reason, DoUpdate sends the full config via Reset, so
# the current version_id is still recorded. deployment_id is intentionally
# left out: it is stable across versions, so a change to it is worth showing.
ignore_local_changes:
  - field: deployment.version_id
    reason: managed by the deployment metadata service

ignore_remote_changes:
  - field: deployment.version_id
    reason: managed by the deployment metadata service

  # Same as clusters.{aws,azure,gcp}_attributes — see clusters/resource_cluster.go#L361-L363
  # s.SchemaPath("aws_attributes").SetSuppressDiff()
  # s.SchemaPath("azure_attributes").SetSuppressDiff()
  # s.SchemaPath("gcp_attributes").SetSuppressDiff()
  - field: tasks[*].new_cluster.aws_attributes
    reason: managed
  - field: tasks[*].new_cluster.azure_attributes
    reason: managed
  - field: tasks[*].new_cluster.gcp_attributes
    reason: managed
  - field: tasks[*].for_each_task.task.new_cluster.aws_attributes
    reason: managed
  - field: tasks[*].for_each_task.task.new_cluster.azure_attributes
    reason: managed
  - field: tasks[*].for_each_task.task.new_cluster.gcp_attributes
    reason: managed
  - field: job_clusters[*].new_cluster.aws_attributes
    reason: managed
  - field: job_clusters[*].new_cluster.azure_attributes
    reason: managed
  - field: job_clusters[*].new_cluster.gcp_attributes
    reason: managed

  # The Jobs API accepts apply_policy_default_values but does not return it
  # in GET responses, so the remote is always nil even when the user sets it.
  # Ignore remote-side nil so old==new (no user change) doesn't trigger drift.
  - field: tasks[*].new_cluster.apply_policy_default_values
    reason: not_returned_by_api
  - field: tasks[*].for_each_task.task.new_cluster.apply_policy_default_values
    reason: not_returned_by_api
  - field: job_clusters[*].new_cluster.apply_policy_default_values
    reason: not_returned_by_api

backend_defaults:
  # Same as clusters.enable_elastic_disk — see clusters/resource_cluster.go#L331
  # s.SchemaPath("enable_elastic_disk").SetComputed()
  - field: tasks[*].new_cluster.enable_elastic_disk
  - field: tasks[*].for_each_task.task.new_cluster.enable_elastic_disk
  - field: job_clusters[*].new_cluster.enable_elastic_disk

  # Same as clusters.enable_local_disk_encryption — see clusters/resource_cluster.go#L332
  # s.SchemaPath("enable_local_disk_encryption").SetComputed()
  - field: tasks[*].new_cluster.enable_local_disk_encryption
  - field: tasks[*].for_each_task.task.new_cluster.enable_local_disk_encryption
  - field: job_clusters[*].new_cluster.enable_local_disk_encryption

  # Same as clusters.node_type_id — see clusters/resource_cluster.go#L333
  # s.SchemaPath("node_type_id").SetComputed()
  - field: tasks[*].new_cluster.node_type_id
  - field: tasks[*].for_each_task.task.new_cluster.node_type_id
  - field: job_clusters[*].new_cluster.node_type_id

  # Same as clusters.driver_node_type_id — see clusters/resource_cluster.go#L334
