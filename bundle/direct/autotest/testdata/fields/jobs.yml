# Value library for jobs. See ../../README.md.

# git_source only validates as a coherent set: a provider, a url, and exactly one of
# branch/tag/commit. Seeding one makes its fields reachable, so changing the commit or the
# provider is tested rather than skipped.
#
# job_clusters, triggers and environments are declared by no config in the corpus, so their
# fields would go untested; seeding one entry each makes them reachable.
base:
  name: test-job-$UNIQUE_NAME
  git_source:
    git_provider: gitHub
    git_url: https://github.com/databricks/cli.test
    git_commit: abc123
  tasks:
    - task_key: seeded
      notebook_task:
        # Relative, because the seeded git_source makes the task read from the repository:
        # "Only relative paths are currently supported for remote repositories."
        notebook_path: notebook
      job_cluster_key: seeded
  job_clusters:
    - job_cluster_key: seeded
      new_cluster:
        spark_version: 13.3.x-scala2.12
        node_type_id: $NODE_TYPE_ID
        num_workers: 1
        custom_tags:
          team: eng
        spark_conf:
          spark.speculation: "true"
        init_scripts:
          - workspace:
              destination: /Users/$CURRENT_USER_NAME/init.sh
  environments:
    - environment_key: seeded
      spec:
        client: "1"
        dependencies:
          - requests
  parameters:
    - name: table
      default: users
  tags:
    team: eng
  health:
    rules:
      - metric: RUN_DURATION_SECONDS
        op: GREATER_THAN
        value: 3600
  email_notifications:
    on_failure:
      - notify@databricks.invalid
  webhook_notifications:
    on_failure:
      - id: 00000000-0000-0000-0000-000000000000
  trigger:
    pause_status: UNPAUSED
    periodic:
      interval: 1
      unit: HOURS

skip:
  # git_branch and git_tag are the other two sides of the same oneof as git_commit, which
  # base sets. Adding one alongside it is rejected for being ambiguous, not for anything
  # this suite measures. Covered by acceptance/bundle/resources/jobs.
  git_source.git_branch: mutually exclusive with the seeded git_commit
  git_source.git_tag: mutually exclusive with the seeded git_commit

  # A task's type is a union and base seeds notebook_task, so reaching any other member means
  # putting two types on one task -- which the API rejects, usually by complaining about the
  # cluster the seeded task carries ("For each does not need a cluster"). Locally the fake server
  # accepted it, so ~2200 transitions were exercising configurations no user can write.
  #
  # Covering a member needs a corpus config whose task is of that type. Some exist --
  # job_apply_policy_default_values_for_each_task.yml.tmpl is one -- but this suite drives the
  # simplest config per resource type, so they are not the one picked. Their fields are listed as
  # uncovered rather than tested against a task that cannot hold them.
  tasks[*].ai_runtime_task: another member of the same union as the seeded notebook_task
  tasks[*].alert_task: another member of the same union as the seeded notebook_task
  tasks[*].clean_rooms_notebook_task: another member of the same union as the seeded notebook_task
  tasks[*].condition_task: another member of the same union as the seeded notebook_task
  tasks[*].dashboard_task: another member of the same union as the seeded notebook_task
  tasks[*].dbt_cloud_task: another member of the same union as the seeded notebook_task
  tasks[*].dbt_platform_task: another member of the same union as the seeded notebook_task
  tasks[*].dbt_task: another member of the same union as the seeded notebook_task
  tasks[*].for_each_task: another member of the same union as the seeded notebook_task
  tasks[*].gen_ai_compute_task: another member of the same union as the seeded notebook_task
  tasks[*].pipeline_task: another member of the same union as the seeded notebook_task
  tasks[*].power_bi_task: another member of the same union as the seeded notebook_task
  tasks[*].python_wheel_task: another member of the same union as the seeded notebook_task
  tasks[*].run_job_task: another member of the same union as the seeded notebook_task
  tasks[*].spark_jar_task: another member of the same union as the seeded notebook_task
  tasks[*].spark_python_task: another member of the same union as the seeded notebook_task
  tasks[*].spark_submit_task: another member of the same union as the seeded notebook_task
  tasks[*].sql_task: another member of the same union as the seeded notebook_task

  # A task's compute is a union too, and base seeds job_cluster_key.
  tasks[*].existing_cluster_id: another way to name the task's compute than the seeded job_cluster_key
  tasks[*].new_cluster: another way to name the task's compute than the seeded job_cluster_key
  tasks[*].environment_key: only for a task type that runs in a serverless environment

  # Each names a workspace object this suite does not provision.
  job_clusters[*].serverless_compute_id: needs a serverless compute to exist
  schedule.sql_condition: needs a saved query and a warehouse to exist
  trigger.sql_condition: needs a saved query and a warehouse to exist
  trigger.model.securable_name: needs a registered model to exist
  git_source.job_source: needs a job whose configuration lives in the repository
  # run_as must name a principal allowed to run the job, which depends on the identity the
  # suite runs as -- a service principal on cloud.
  run_as: depends on the identity the suite runs as
  # A job cluster key has to name an entry in job_clusters, and this suite drives one field at a
  # time -- so renaming the key on the task and on the definition cannot happen together.
  tasks[*].job_cluster_key: has to name a job_clusters entry, which cannot change with it
  job_clusters[*].job_cluster_key: has to match the key the task names, which cannot change with it
  # A node type is cloud-specific and the suite has one variable for it, so there is no second
  # value to move to: "Node type x is not supported. Supported node types: r3.xlarge, ...".
  job_clusters[*].new_cluster.node_type_id: cloud-specific; the suite has one node type
  job_clusters[*].new_cluster.driver_node_type_id: cloud-specific; the suite has one node type
  # An account-level policy, as with apps.
  usage_policy_id: needs an account-level usage policy to exist
  # The backend assigns a job cluster its name: "Cluster name should not be provided".
  job_clusters[*].new_cluster.cluster_name: assigned by the backend for a job cluster
  # Each names a workspace object this suite does not provision.
  job_clusters[*].new_cluster.policy_id: needs a cluster policy to exist
  job_clusters[*].new_cluster.instance_pool_id: needs an instance pool to exist
  job_clusters[*].new_cluster.driver_instance_pool_id: needs an instance pool to exist
  job_clusters[*].new_cluster.init_scripts[*].s3.kms_key: needs a KMS key registered for the workspace
  job_clusters[*].new_cluster.cluster_log_conf.s3.kms_key: needs a KMS key registered for the workspace
  tasks[*].notebook_task.warehouse_id: needs a second SQL warehouse to exist
  # A trigger, a schedule and a continuous block are three arms of one choice, so a schedule
  # field cannot move on a job the corpus config gives no schedule.
  schedule: one of schedule, trigger or continuous, and the config declares none
  # Only one of the three cloud attribute blocks applies, decided by the workspace's cloud.
  job_clusters[*].new_cluster.azure_attributes: cloud-specific; only one attribute block applies
  job_clusters[*].new_cluster.gcp_attributes: cloud-specific; only one attribute block applies
  job_clusters[*].new_cluster.aws_attributes: cloud-specific; only one attribute block applies

fields:
  format: [SINGLE_TASK, MULTI_TASK]
  performance_target: [PERFORMANCE_OPTIMIZED, STANDARD]
  max_concurrent_runs: [1, 5]
  timeout_seconds: [600, 1200]
  git_source.git_provider: [gitHub, gitLab]
  # A repository URL and a TZ database zone id, neither free text.
  git_source.git_url: [https://github.com/databricks/cli.test, https://github.com/databricks/dabs.test]
  git_source.git_commit: [abc123, def456]
