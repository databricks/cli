# Value library for MCP services. See ../../README.md.
#
# parent references the pre-existing main.default schema and mcp_service_id is the other half of the
# server-derived id; both are immutable, so a change recreates. Unlike a model service, an MCP service
# needs no config block on create, so the base seeds only the required identity and a comment. Shape
# follows acceptance/bundle/resources/mcp_services.
base:
  parent: schemas/main.default
  mcp_service_id: test-mcp-service-$UNIQUE_NAME
  comment: test mcp service
