# Value library for apps. See ../../README.md.
#
# resources is deliberately not seeded. An entry is a union (secret, job, sql_warehouse, ...)
# and the API rejects one carrying no member at all -- "Invalid resource provided" -- while
# every member names a workspace object this suite does not provision: a secret scope, a job, a
# warehouse. So the block's fields stay uncovered, which the report says.

# base declares neither block. config carries the app's command and env; the
# resources list is a union where an entry names one referenced object.
base:
  name: app-$UNIQUE_NAME
  source_code_path: ./app
  config:
    command:
      - python
      - app.py
    env:
      - name: MY_VAR
        value: value

fields:
  # Real OAuth scopes, verified against the API: it refuses anything else outright ("The specified
  # scope x is not a valid scope"), and the mock server takes any string. Declared for the list as
  # well as the element, so growing the list uses scopes the backend accepts.
  user_api_scopes:
    - [sql]
    - [dashboards.genie, sql]
  user_api_scopes[*]: [sql, dashboards.genie]

  compute_size: [MEDIUM, LARGE]

skip:
  # A rename recreates the app, and a real workspace holds a deleted app's name for up to twenty
  # minutes while it sits in DELETING -- so the chain of transitions hits "An app with the same name
  # already exists" as soon as it returns to a name an earlier transition used. The mock server deletes
  # outright when the suite asks it to, which is why the chain works locally.
  name: a deleted app keeps its name reserved, so a rename cannot reuse an earlier one

  # Starting an app deploys its source, and "Invalid source code path: .../files/app. Path does not
  # exist": this suite uploads no bundle files -- a sync per permutation would dominate the run -- so
  # the directory the app points at is never there. The mock server does not check, which is the only
  # reason starting one ever appeared to work.
  lifecycle.started: starting the app deploys source this suite does not upload

  # "Setting forward_user_access_token on CreateApp is not enabled in this workspace." A
  # workspace-level feature, so the local rows for it record what the mock server allows and not
  # what a workspace does.
  forward_user_access_token: needs the feature enabled on the workspace

  # "git_repository.caller_credential_id can only be set on CreateApp, not on UpdateApp." Every
  # transition of it is an update, so none is a request the API accepts; reaching it would need a
  # fixture that varies the field across creates.
  git_repository.caller_credential_id: settable only on create, and every transition is an update

  # "Git repository requires both URL and provider to be defined" -- the block is validated as a set,
  # and this leaf cannot move without the other two beside it. Same shape as the url and provider
  # skips below.
  git_repository.auto_deploy: validated as a set with the url and provider, which base does not declare

  # Both name an account-level policy: "Invalid resource: accounts/<id>/budgetPolicies/x". A
  # test workspace has none to reference, and creating one is an account-level operation.
  budget_policy_id: needs an account-level budget policy to exist
  usage_policy_id: needs an account-level usage policy to exist

  # The API validates the block as a set: "Git repository requires both URL and provider to be
  # defined." Moving either leaf on its own leaves the other unset, so neither is testable until
  # the fixture declares a coherent block for them to vary inside -- the same shape as a job's
  # git_source, which base seeds for exactly that reason.
  git_source.git_repository.url: validated as a set with the provider, which the fixture does not declare
  git_source.git_repository.provider: validated as a set with the url, which the fixture does not declare
  git_repository.url: validated as a set with the provider, which the fixture does not declare
  git_repository.provider: validated as a set with the url, which the fixture does not declare

  # "Manual instance count configuration is not enabled in this workspace." A workspace-level
  # feature, so the local report for these two records what the fake server allows, not what a
  # workspace does.
  compute_max_instances: needs manual instance count enabled on the workspace
  compute_min_instances: needs manual instance count enabled on the workspace
