# Value library for postgres roles. See ../../README.md.

# A recreate reuses the project name, and a deleted project holds it until the soft delete is
# purged, so the parent chain cannot be rebuilt on a real workspace. See postgres_projects.yml.
local_only: a recreate cannot reuse the project name until the soft delete is purged

deps:
  postgres_projects:
    project_id: test-pg-project-$UNIQUE_NAME
    display_name: Test Postgres Project
  postgres_branches:
    parent: ${resources.postgres_projects.postgres_projects.name}
    branch_id: test-branch-$UNIQUE_NAME
    no_expiry: true

base:
  parent: ${resources.postgres_branches.postgres_branches.name}
  role_id: test-role-$UNIQUE_NAME
  postgres_role: app_role
