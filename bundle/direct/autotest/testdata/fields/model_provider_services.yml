# Value library for model provider services. See ../../README.md.
#
# parent references the pre-existing main.default schema and model_provider_service_id is the other
# half of the server-derived id; both are immutable, so a change recreates. Like an MCP service it
# needs no config block on create, so the base seeds only the required identity and a comment. Shape
# follows acceptance/bundle/python/model_provider_services-support.
base:
  parent: schemas/main.default
  model_provider_service_id: test-model-provider-service-$UNIQUE_NAME
  comment: test model provider service
