# Value library for Genie spaces. See ../../README.md.

base:
  warehouse_id: $TEST_DEFAULT_WAREHOUSE_ID
  title: test-genie-space-$UNIQUE_NAME
  # Structured (inline) serialized_space is marshalled to a JSON string by
  # ConfigureGenieSpaceSerializedSpace; this config doubles as a regression
  # guard that the normalization produces a drift-free deploy. Kept minimal
  # ({version: 1}) so the real backend accepts it on cloud: it rejects
  # unknown fields such as display_name with INVALID_PARAMETER_VALUE.
  serialized_space:
    version: 1

skip:
  # Same two as dashboards: both name workspace objects this suite does not provision a second
  # of. See dashboards.yml.
  parent_path: needs a second workspace folder to exist
  warehouse_id: needs a second SQL warehouse to exist
