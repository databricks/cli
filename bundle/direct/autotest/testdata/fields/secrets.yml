# Value library for secrets. See ../../README.md.

# The secret goes in a schema this fixture creates, not in main.default: the limit is 100 secrets per
# schema, and a shared workspace's default schema fills up with other runs' leftovers -- "Cannot
# create 1 Secret(s) in Schema ... (estimated count: 100, limit: 100)". A fresh schema is empty.
deps:
  schemas:
    catalog_name: main
    name: test-secret-schema-$UNIQUE_NAME

variables:
  secret_value: seeded-value

base:
  catalog_name: main
  schema_name: ${resources.schemas.schemas.name}
  name: test-secret-$UNIQUE_NAME
  value: ${var.secret_value}

skip:
  # The config format refuses a literal here, to keep secrets out of config files: "Secret value
  # must be a variable reference". No value this suite could move the field to is a legal bundle,
  # so the only reachable shape is the reference base declares.
  value: the config format requires a variable reference, which no literal value is

  # Both name objects that have to exist: "Catalog 'x' does not exist", "Schema 'main.x' does not
  # exist". The fake server takes any string, so these rows only ever measured the fake. A second
  # catalog and schema would make them testable; the fixture creates one schema, and moving the
  # secret between two is a different test than moving a field.
  catalog_name: names a catalog that has to exist, and the suite provisions one
  schema_name: names the schema the fixture creates, and there is no second one to move to
