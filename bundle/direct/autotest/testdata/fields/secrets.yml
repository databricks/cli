# Value library for secrets. See ../../README.md.

variables:
  secret_value: seeded-value

base:
  catalog_name: main
  schema_name: default
  name: test-secret-$UNIQUE_NAME
  value: ${var.secret_value}

skip:
  # The config format refuses a literal here, to keep secrets out of config files: "Secret value
  # must be a variable reference". No value this suite could move the field to is a legal bundle,
  # so the only reachable shape is the reference base declares.
  value: the config format requires a variable reference, which no literal value is
