# Value library for postgres endpoints. See ../../README.md.

# On a real workspace a branch is provisioned with its own read_write endpoint, so the base
# config -- which creates a second read_write endpoint -- is refused with "read_write endpoint
# already exists". Running on cloud needs a fixture that manages the auto-created endpoint
# instead of adding one.
local_only: a branch already has a read_write endpoint, so the fixture cannot create another

deps:
  postgres_projects:
    project_id: test-pg-project-$UNIQUE_NAME
    display_name: Test Postgres Project
  postgres_branches:
    parent: ${resources.postgres_projects.postgres_projects.name}
    branch_id: test-branch-$UNIQUE_NAME
    no_expiry: true

base:
  parent: ${resources.postgres_branches.postgres_branches.name}
  endpoint_id: test-endpoint-$UNIQUE_NAME
  endpoint_type: ENDPOINT_TYPE_READ_WRITE
  suspend_timeout_duration: 300s
