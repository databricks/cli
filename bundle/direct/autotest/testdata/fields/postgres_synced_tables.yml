# Value library for postgres synced tables. See ../../README.md.

# Postgres resources are only available on AWS, and the invariant suite
# excludes them from every cloud run for that reason.
local_only: Postgres resources are only available on AWS
base:
  extra_columns:
    - column_name: ingested_at
      column_type: TIMESTAMP
  type_overrides:
    - column_name: id
      pg_type: bigint
