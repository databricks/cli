# Value library for postgres synced tables. See ../../README.md.

# Postgres is an AWS-only service, so an aws workspace is the one place the cloud run can
# confirm this type. The invariant suite drops these configs from every cloud run rather than
# just the ones without the service; acceptance/bundle/resources/postgres_*/test.toml is the
# closer precedent, disabling gcp and azure by name.
clouds: [aws]
base:
  synced_table_id: lakebase_$UNIQUE_NAME.public.trips_synced
  source_table_full_name: main.raw.trips
  primary_key_columns: [id]
  scheduling_policy: SNAPSHOT
  postgres_database: appdb
  branch: projects/test-pg-project-$UNIQUE_NAME/branches/production
  create_database_objects_if_missing: true
  new_pipeline_spec:
    storage_catalog: main
    storage_schema: pipelines
  extra_columns:
    - column_name: ingested_at
      column_type: TIMESTAMP
  type_overrides:
    # pg_type is an enum, not a Postgres type name: only PG_SPECIFIC_TYPE_HALFVEC, _VARCHAR and
    # _VECTOR. "bigint" parsed to the unspecified zero value, which the real API rejects as a
    # missing required field while the fake server stored it verbatim.
    - column_name: id
      pg_type: PG_SPECIFIC_TYPE_VARCHAR
