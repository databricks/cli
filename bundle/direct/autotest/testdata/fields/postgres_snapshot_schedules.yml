# Value library for postgres snapshot schedules. See ../../README.md.
#
# A snapshot schedule is 1:1 with its branch (the resource name is
# .../branches/{branch}/snapshot-schedule), so branch is an immutable parent reference with a
# single valid value -- skipped rather than fuzzed. Every cadence requires an hour in [0,23]; the
# fake server enforces that (libs/testserver/postgres.go) so the catalog matches aws.
clouds: [aws]

deps:
  postgres_projects:
    project_id: test-pg-project-$UNIQUE_NAME
    display_name: Test Postgres Project

skip:
  branch: the schedule's immutable parent; a schedule belongs to exactly one branch

base:
  branch: ${resources.postgres_projects.postgres_projects.id}/branches/production
  schedule:
    - daily_schedule:
        hour: 3
      retention: "604800s"
