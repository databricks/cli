# Value library for postgres snapshot schedules. See ../../README.md.

# Enabling on cloud surfaced testserver-fidelity gaps to close first (2026-09):
#   - branch: a resource reference fuzzed with garbage -> aws 404, fake 501 "No stub"
#   - schedule.daily_schedule.hour / monthly_schedule: aws requires 'hour' in [0,23]; the fake does not
# Until those match, the schedule catalog stays local.
local_only: branch reference + required schedule 'hour' differ from aws (see above)

deps:
  postgres_projects:
    project_id: test-pg-project-$UNIQUE_NAME
    display_name: Test Postgres Project

base:
  branch: ${resources.postgres_projects.postgres_projects.id}/branches/production
  schedule:
    - daily_schedule:
        hour: 3
      retention: "604800s"
