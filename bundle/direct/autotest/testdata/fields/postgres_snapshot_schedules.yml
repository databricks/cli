# Value library for postgres snapshot schedules. See ../../README.md.

# The schedule attaches to the project's implicitly-created "production" root branch -- the backend
# refuses a schedule on any other branch ("not allowed to snapshot non-root branch"). The project
# holds its name after deletion until the soft delete is purged, so the chain cannot be rebuilt on a
# real workspace. See postgres_projects.yml. Shape follows
# acceptance/bundle/resources/postgres_snapshot_schedules/basic.
local_only: a recreate cannot reuse the project name until the soft delete is purged

deps:
  postgres_projects:
    project_id: test-pg-project-$UNIQUE_NAME
    display_name: Test Postgres Project

base:
  branch: ${resources.postgres_projects.postgres_projects.id}/branches/production
  schedule:
    - daily_schedule:
        hour: 3
      retention: "604800s"
