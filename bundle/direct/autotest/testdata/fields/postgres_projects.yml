# Value library for postgres projects. See ../../README.md.

# Postgres resources are only available on AWS, and the invariant suite
# excludes them from every cloud run for that reason.
local_only: Postgres resources are only available on AWS
base:
  custom_tags:
    - key: team
      value: eng
  default_endpoint_settings:
    pg_settings:
      work_mem: 64MB

fields:
  # project_id is part of the resource's hierarchical name, so a change recreates it.
  project_id: [pgproj1, pgproj2]
  pg_version: [16, 17]
