# Value library for synced database tables. See ../../README.md.

# Lakebase v1 is not available in every cloud, and the source table below is not provisioned.
local_only: Lakebase v1 is not available in every cloud

deps:
  database_instances:
    name: test-db-instance-$UNIQUE_NAME
    capacity: CU_1
  database_catalogs:
    database_instance_name: ${resources.database_instances.database_instances.name}
    database_name: test_db
    name: test-catalog-$UNIQUE_NAME
    create_database_if_not_exists: true

base:
  name: ${resources.database_catalogs.database_catalogs.name}.${resources.database_catalogs.database_catalogs.database_name}.test_table
  database_instance_name: ${resources.database_instances.database_instances.name}
  logical_database_name: ${resources.database_catalogs.database_catalogs.database_name}
  spec:
    source_table_full_name: main.test_synced_$UNIQUE_NAME.trips_source
    scheduling_policy: SNAPSHOT
    primary_key_columns:
      - tpep_pickup_datetime
