# Value library for cluster policies. See ../../README.md.

# libraries is a union: an entry carries exactly one of jar, egg, whl, pypi, maven or cran.
# One entry, so the container and that member are testable. The other members stay uncovered
# for this config, which the report says: they can only be reached by putting a second member
# on this entry, which is not something a user can write -- the backend keeps whichever it
# prefers and the whole block then reads as drifting.
base:
  libraries:
    - jar: dbfs:/FileStore/test.jar

fields:
  # A policy definition is a JSON document the backend parses, and it is required: the API
  # rejects an update that does not carry one.
  definition:
    - '{"spark_version":{"type":"fixed","value":"13.3.x-scala2.12"}}'
    - '{"spark_version":{"type":"fixed","value":"14.3.x-scala2.12"}}'
