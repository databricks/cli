# Value library for pipelines. See ../../README.md.

# No pipeline config in the corpus declares a clusters block, so its whole spec -- 346
# fields, including the init_scripts union and the tag maps -- would go untested. Values
# that differ per cloud come from the same variables the corpus configs use.
base:
  clusters:
    - label: default
      node_type_id: $NODE_TYPE_ID
      num_workers: 1
      custom_tags:
        team: eng
      spark_conf:
        spark.speculation: "true"
      spark_env_vars:
        MY_VAR: value
      ssh_public_keys:
        - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQtest
      init_scripts:
        - workspace:
            destination: /Users/$CURRENT_USER_NAME/init.sh
  configuration:
    my.key: value
  environment:
    dependencies:
      - requests
  filters:
    include:
      - included
    exclude:
      - excluded
  libraries:
    - notebook:
        path: /Shared/notebook
  notifications:
    - alerts:
        - on-update-failure
      email_recipients:
        - $CURRENT_USER_NAME
  restart_window:
    start_hour: 1
    time_zone_id: UTC
  tags:
    team: eng
  parameters:
    table: users
