# Value library for registered models. See ../../README.md.
#
# aliases is output-only in practice -- an alias is created through its own API, not by
# writing the model -- but the OpenAPI spec does not annotate it, so it is not skipped
# automatically. Seeding one lets the suite record what actually happens.
base:
  aliases:
    - alias_name: champion
      version_num: 1
