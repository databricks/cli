# Value library for apps. See ../../README.md.

# The corpus config declares neither block. config carries the app's command and env; the
# resources list is a union where an entry names one referenced object.
base:
  config:
    command:
      - python
      - app.py
    env:
      - name: MY_VAR
        value: value
  # An app resource is a union (secret, job, sql_warehouse, ...), and every member names a
  # workspace object this suite does not provision -- a secret scope, a job, a warehouse. Only
  # the entry's own fields are seeded, so name, description and the union members stay
  # uncovered, which the report says.
  resources:
    - name: seeded
      description: seeded resource

fields:
  compute_size: [MEDIUM, LARGE]
