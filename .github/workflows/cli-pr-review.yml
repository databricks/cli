name: CLI PR review

# Review ready, same-repository PRs on open/reopen/push. Comment exactly /review
# to request another review, including on a draft. Author and requester need write
# access; comment requests also require MEMBER, OWNER, or COLLABORATOR association.
# The job summary links the backend run. Feedback is advisory and posted inline.
# Run only trusted workflow code; never check out or execute the PR here.
on:
  # TEMPORARY: authorized test on this PR only; removed after the run.
  pull_request:
    types: [synchronize]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created]

# Group review requests before validation; unrelated comments get their own group.
concurrency:
  group: cli-pr-review-${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.comment.body == '/review' && github.event.issue.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 4738 && github.event.pull_request.head.repo.full_name == 'databricks/cli' && github.head_ref == 'add-claude-code-workflow' && github.actor == 'shreyas-goenka'
    runs-on:
      group: databricks-deco-testing-runner-group
      labels: ubuntu-latest-deco
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.request.outputs.eligible }}
      pr_number: ${{ steps.request.outputs.pr_number }}

    steps:
      # Pin the validator to the trusted workflow revision, not the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Prepare real comment test
        id: test-comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/databricks/cli/issues/comments/6948316969 > "$RUNNER_TEMP/test-comment.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          comment = json.loads((root / 'test-comment.json').read_text())
          assert comment['user']['login'] == 'shreyas-goenka'
          assert comment['body'] == '/review'
          print('Workflow-token comment association:', comment['author_association'])
          payload = {'action': 'created', 'repository': event['repository'],
                     'issue': {'number': 4738, 'pull_request': {}}, 'comment': comment}
          (root / 'test-event.json').write_text(json.dumps(payload))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:
              f.write('association=' + comment['author_association'] + '\n')
          PYTHON

      - name: Validate review request
        id: request
        if: contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), steps.test-comment.outputs.association)
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_EVENT_NAME=issue_comment GITHUB_EVENT_PATH="$RUNNER_TEMP/test-event.json" python3 .github/scripts/cli_pr_review.py

      - name: Confirm request passed
        env:
          ELIGIBLE: ${{ steps.request.outputs.eligible }}
        run: test "$ELIGIBLE" = true

  review:
    needs: validate
    if: needs.validate.outputs.eligible == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.number == 4738 && github.event.pull_request.head.repo.full_name == 'databricks/cli' && github.head_ref == 'add-claude-code-workflow' && github.actor == 'shreyas-goenka')
    # Cross-org dispatch needs the same approved network as integration tests.
    runs-on:
      group: databricks-release-runner-group-emu-access
      labels: linux-ubuntu-latest-emu-access
    timeout-minutes: 20
    permissions: {}
    environment:
      name: test-trigger-is
      deployment: false
    steps:
      - name: Generate backend dispatch token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DECO_WORKFLOW_TRIGGER_APP_ID }}
          private-key: ${{ secrets.DECO_WORKFLOW_TRIGGER_PRIVATE_KEY }}
          owner: databricks-eng
          repositories: eng-dev-ecosystem
          permission-actions: write

      - name: Dispatch and wait for this review
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
        run: |-
          set -euo pipefail
          # This API version returns the exact run, even when other PRs trigger reviews.
          # https://docs.github.com/en/rest/actions/workflows#create-a-workflow-dispatch-event
          gh api --method POST \
            repos/databricks-eng/eng-dev-ecosystem/actions/workflows/cli-pr-review.yml/dispatches \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -f ref=main -f "inputs[pull_request_number]=$PR_NUMBER" > "$RUNNER_TEMP/review-run.json"
          run_id=$(jq -er '.workflow_run_id | select(type == "number")' "$RUNNER_TEMP/review-run.json")
          echo "[Review run](https://github.com/databricks-eng/eng-dev-ecosystem/actions/runs/$run_id)" >> "$GITHUB_STEP_SUMMARY"
          echo 'To request another review, comment `/review` on the PR.' >> "$GITHUB_STEP_SUMMARY"
          # A newly dispatched run can briefly return 404 before GitHub indexes it.
          for attempt in {1..12}; do
            if gh run view "$run_id" --repo databricks-eng/eng-dev-ecosystem --json databaseId >/dev/null 2>&1; then
              gh run watch "$run_id" --repo databricks-eng/eng-dev-ecosystem --interval 15 --exit-status
              exit 0
            fi
            sleep 5
          done
          echo "::error::Dispatched review $run_id did not become visible within one minute."
          exit 1
