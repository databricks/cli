name: Bump vulnerable dependencies

on:
  schedule:
    # Run daily at 05:30 UTC, just after the Go toolchain bumper.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

  # Required by setup-jfrog (GOPROXY exchange).
  id-token: write

jobs:
  bump-vuln-deps:
    runs-on:
      group: databricks-protected-runner-group-large
      labels: linux-ubuntu-latest-large

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JFrog
        uses: ./.github/actions/setup-jfrog

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/task/go.sum
            bundle/internal/tf/codegen/go.sum

      - name: Build govulncheck
        run: go build -modfile=tools/go.mod -o "$RUNNER_TEMP/govulncheck" golang.org/x/vuln/cmd/govulncheck

      - name: Build vulnbump
        run: go -C tools/vulnbump build -o "$RUNNER_TEMP/vulnbump" .

      - name: Bump vulnerable dependencies
        id: bump
        run: |
          set -euo pipefail

          # govulncheck is pinned as a tool dependency in tools/go.mod. Build it
          # once, then scan each repository module independently so build- and
          # CI-only dependencies receive the same coverage as the root module.
          # Its vulnerability database is fetched from vuln.go.dev at runtime,
          # so the pinned binary still uses the latest advisories.
          #
          # -scan module reports every advisory affecting a required module,
          # regardless of whether the vulnerable symbol is reachable. In JSON
          # mode govulncheck exits 0 on success whether or not it finds anything,
          # and non-zero only on a real error; a failure must abort the job
          # rather than be silently mistaken for "no vulnerabilities".
          (
            cd .
            "$RUNNER_TEMP/govulncheck" -scan module -format json > "$RUNNER_TEMP/root.json"
          )
          (
            cd tools
            "$RUNNER_TEMP/govulncheck" -scan module -format json > "$RUNNER_TEMP/tools.json"
          )
          (
            cd tools/task
            "$RUNNER_TEMP/govulncheck" -scan module -format json > "$RUNNER_TEMP/task.json"
          )
          (
            cd bundle/internal/tf/codegen
            "$RUNNER_TEMP/govulncheck" -scan module -format json > "$RUNNER_TEMP/codegen.json"
          )

          summary_file="$(mktemp)"
          for module in . tools tools/task bundle/internal/tf/codegen; do
            case "$module" in
              .) scan="$RUNNER_TEMP/root.json" ;;
              tools) scan="$RUNNER_TEMP/tools.json" ;;
              tools/task) scan="$RUNNER_TEMP/task.json" ;;
              bundle/internal/tf/codegen) scan="$RUNNER_TEMP/codegen.json" ;;
            esac
            "$RUNNER_TEMP/vulnbump" "$module" < "$scan" >> "$summary_file"
          done

          if git diff --quiet; then
            echo "No vulnerable dependencies to bump."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            {
              echo "summary<<SUMMARY_EOF"
              cat "$summary_file"
              echo "SUMMARY_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Show diff
        if: steps.bump.outputs.needed == 'true'
        run: git diff

      - name: Create pull request
        id: cpr
        if: steps.bump.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A fixed branch means a daily run updates the existing open PR in
          # place rather than opening a new one; no branch-suffix is needed.
          branch: auto/bump-vuln-deps
          commit-message: "Bump dependencies with known vulnerabilities"
          title: "Bump dependencies with known vulnerabilities"
          body: |
            Bump dependencies flagged by `govulncheck -scan module` to their fixed versions.

            Each CVE links to its Go advisory page.

            ${{ steps.bump.outputs.summary }}

            Vulnerabilities in the Go standard library are left to the `Bump Go toolchain` workflow.

            If a bump promotes a new direct dependency, double-check its license annotation in `go.mod` and `NOTICE`.
          reviewers: simonfaltum,andrewnester,anton-107,denik,janniklasrose,pietern,shreyas-goenka
          labels: dependencies

      # Add the changelog fragment as a follow-up commit on the PR branch: the
      # fragment references the PR number, which only exists once the PR above
      # has been created. The fixed branch is re-checked out on each daily run,
      # so guard against re-committing when the fragment already exists.
      - name: Add changelog fragment
        if: steps.cpr.outputs.pull-request-number
        env:
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |-
          git fetch origin "$BRANCH"
          git checkout -f -B "$BRANCH" FETCH_HEAD
          fragment=".nextchanges/dependency-updates/${PR}.md"
          echo "* Bump dependencies with known vulnerabilities. ([#${PR}](https://github.com/databricks/cli/pull/${PR}))" > "$fragment"
          git add "$fragment"
          # Skip commit if nothing changed (fragment already present on this branch).
          if git diff --cached --quiet; then
            echo "fragment already present"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Add changelog fragment"
          git push origin "HEAD:$BRANCH"
