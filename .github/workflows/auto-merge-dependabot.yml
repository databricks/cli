name: Auto-merge Dependabot PRs

# Enable auto-merge on Dependabot PRs so a single maintainer approval is enough
# to merge them. This does not approve the PR: the branch-protection review is
# still required, and the merge queue still runs the required checks first.
#
# The two internal dependency bumpers (bump-go-toolchain.yml, bump-vuln-deps.yml)
# enable auto-merge on their own PRs instead of relying on this workflow: they
# open PRs with GITHUB_TOKEN, and PRs created by GITHUB_TOKEN do not trigger
# pull_request workflow runs (GitHub's recursion guard).

on: pull_request

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    # For Dependabot-triggered runs GITHUB_TOKEN is read-only by default; this
    # grants back the write access that `gh pr merge --auto` needs.
    permissions:
      contents: write
      pull-requests: write

    # Gate on the PR author (who opened it) rather than github.actor (who
    # triggered this run), so the guard tracks PR identity across all event
    # types. The "[bot]" suffix is reserved for GitHub Apps, so this login
    # cannot be spoofed by a user account.
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # main requires a merge queue, which selects the merge method, so no
        # merge-strategy flag is needed here.
        run: gh pr merge --auto "$PR_URL"
