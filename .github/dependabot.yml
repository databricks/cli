version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    ignore:
      # Ignore Databricks Go SDK because its upgrade requires code generation
      - dependency-name: github.com/databricks/databricks-sdk-go
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
  # acceptance/ holds generated template output and test fixtures, not real
  # project dependencies. Some pin a placeholder version (e.g.
  # databricks-bundles==x.y.z, produced by a test.toml Repls rule) that is not
  # valid PEP 440 and aborts the whole dependency-graph submission for the
  # ecosystem. cmd/labs/project/testdata/ is vendored test data. The pip and uv
  # graph jobs both scan pyproject.toml, so both need the exclusion.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    exclude-paths:
      - "acceptance/**"
      - "cmd/labs/project/testdata/**"
      - "python/codegen/**"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    exclude-paths:
      - "acceptance/**"
      - "cmd/labs/project/testdata/**"
      - "python/codegen/**"
  # https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#directories
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/workflows"
      - "/.github/actions/setup-build-environment"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # tagging.yml is generated and maintained externally. Ignore
    # actions/create-github-app-token since it is only used in tagging.yml.
    exclude-paths:
      - .github/workflows/tagging.yml
