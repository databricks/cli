version: 1.1
source: my_table
comment: Test metric view with semantic metadata
dimensions:
  - name: region
    expr: region_id
    display_name: Geographic Region
    synonyms:
      - geo_region
      - territory
measures:
  - name: total_value
    expr: sum(value)
    display_name: Total Value
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      abbreviation: compact
