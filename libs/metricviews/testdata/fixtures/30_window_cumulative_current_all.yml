version: 1.1
source: my_table

dimensions:
  - name: date
    expr: date
  - name: week
    expr: week
  - name: month
    expr: month
  - name: year
    expr: year
  - name: category
    expr: category
  - name: value
    expr: value
  - name: rs
    expr: running_sum
measures:
  - name: sum
    expr: sum(value)
  - name: cumulative_sum_last
    expr: sum(value)
    window:
      - order: date
        range: cumulative
        semiadditive: last
  - name: current_sum_last
    expr: sum(value)
    window:
      - order: date
        range: current
        semiadditive: last
  - name: all_sum_last
    expr: sum(value)
    window:
      - order: date
        range: all
        semiadditive: last
