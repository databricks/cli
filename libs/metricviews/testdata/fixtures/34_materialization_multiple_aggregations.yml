version: 0.1
source: main.default.test_table
dimensions:
  - name: region
    expr: region
  - name: country
    expr: country
  - name: city
    expr: city
measures:
  - name: total_cnt
    expr: count(*)
materialization:
  mode: relaxed
  schedule: CRON '0 * * * *'
  materialized_views:
    - name: baseline
      type: unaggregated
    - name: agg1
      type: aggregated
      dimensions:
        - region
    - name: agg2
      type: aggregated
      dimensions:
        - country
