model = "gpt-5"

[mcp_servers]
  [mcp_servers.genie_one_mcp-dogfood]
    args = ["aitools", "mcp", "serve", "--profile", "dogfood", "--service", "system.ai.genie_one_mcp", "--agent", "codex"]
    command = "/opt/databricks/bin/databricks"
  [mcp_servers.other]
    args = ["-y", "other-mcp"]
    command = "npx"

[projects]
  [projects."/work"]
    trust_level = "trusted"
