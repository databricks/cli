[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bundletest"
version = "0.0.1"
description = "pytest-style isolation testing for Databricks Asset Bundles (DABs)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "duckdb>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.entry-points.pytest11]
bundletest = "bundletest.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/bundletest"]
