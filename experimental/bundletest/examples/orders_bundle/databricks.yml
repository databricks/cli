# Minimal illustrative bundle. The local backend runs the job's real sql_task artifact
# (src/transform_orders.sql) against DuckDB; the cloud backend (follow-up PR) deploys and
# runs it on a real workspace.
bundle:
  name: orders

resources:
  jobs:
    transform_orders:
      name: transform_orders
      tasks:
        - task_key: transform
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: src/transform_orders.sql

variables:
  warehouse_id:
    description: SQL warehouse the transform runs on
