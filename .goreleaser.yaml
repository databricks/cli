version: 2

before:
  hooks:
    - go mod download

builds:
  - env:
      - CGO_ENABLED=0
      # Link the Go Cryptographic Module and default FIPS 140-3 mode on. Pinned to
      # a frozen version rather than an alias: only v1.0.0 carries a CMVP
      # certificate, "latest" tracks the in-tree source with no fixed artifact to
      # cite, and "certified" is resolved by the toolchain so it moves on upgrade.
      # Callers who need the previous behaviour can start the binary with
      # GODEBUG=fips140=off.
      - GOFIPS140=v1.0.0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
      # Skip inlining in code that is generated, waits on the network, or only
      # drives the TUI: it shrinks the binary by ~2.2 MB without measurable
      # cost. Hot paths (bundle/, libs/dyn, stdlib, ...) keep the default.
      # Measure before adding a package: some grow without inlining (e.g.
      # go.opentelemetry.io/otel/semconv init code grows by 300 KB).
      - -gcflags=github.com/databricks/cli/cmd/...=-l
      - -gcflags=github.com/databricks/cli/experimental/...=-l
      - -gcflags=github.com/databricks/cli/libs/apps/...=-l
      - -gcflags=github.com/databricks/cli/libs/aitools/...=-l
      - -gcflags=github.com/databricks/cli/libs/auth/...=-l
      - -gcflags=github.com/databricks/databricks-sdk-go/...=-l
      - -gcflags=github.com/databricks/sdk-go/...=-l
      - -gcflags=google.golang.org/...=-l
      - -gcflags=cloud.google.com/...=-l
      - -gcflags=github.com/googleapis/...=-l
      - -gcflags=github.com/google/s2a-go/...=-l
      - -gcflags=github.com/charmbracelet/...=-l
      - -gcflags=github.com/spf13/...=-l
      - -gcflags=github.com/godbus/...=-l
      - -gcflags=github.com/zalando/...=-l
      - -gcflags=github.com/jackc/...=-l
      - -gcflags=github.com/BurntSushi/...=-l
      - -gcflags=github.com/tailscale/...=-l
      - -gcflags=golang.org/x/...=-l
      # Standard library packages that do per-connection or per-request work
      # (~0.5 MB). Benchmarked over loopback HTTPS: download throughput and
      # handshake cost are unchanged; a small request on a reused connection
      # costs ~20us more CPU, negligible next to network latency. Never add
      # crypto/internal/fips140/...: release builds use the certified module.
      - -gcflags=net=-l
      - -gcflags=net/http/...=-l
      - -gcflags=net/textproto=-l
      - -gcflags=net/url=-l
      - -gcflags=mime/...=-l
      - -gcflags=crypto/tls/...=-l
      - -gcflags=crypto/x509/...=-l
      - -gcflags=vendor/golang.org/x/...=-l
      - -gcflags=encoding/gob=-l
      - -gcflags=encoding/xml=-l
      - -gcflags=html/...=-l
      - -gcflags=math/big=-l
    ldflags:
      - '-s -w'
      - -X github.com/databricks/cli/internal/build.buildProjectName={{ .ProjectName }}
      - -X github.com/databricks/cli/internal/build.buildVersion={{ .Version }}

      # Git information
      - -X github.com/databricks/cli/internal/build.buildBranch={{ .Branch }}
      - -X github.com/databricks/cli/internal/build.buildTag={{ .Tag }}
      - -X github.com/databricks/cli/internal/build.buildShortCommit={{ .ShortCommit }}
      - -X github.com/databricks/cli/internal/build.buildFullCommit={{ .FullCommit }}
      - -X github.com/databricks/cli/internal/build.buildCommitTimestamp={{ .CommitTimestamp }}
      - -X github.com/databricks/cli/internal/build.buildSummary={{ .Summary }}

      # Version information
      - -X github.com/databricks/cli/internal/build.buildMajor={{ .Major }}
      - -X github.com/databricks/cli/internal/build.buildMinor={{ .Minor }}
      - -X github.com/databricks/cli/internal/build.buildPatch={{ .Patch }}
      - -X github.com/databricks/cli/internal/build.buildPrerelease={{ .Prerelease }}
      - -X github.com/databricks/cli/internal/build.buildIsSnapshot={{ .IsSnapshot }}
      - -X github.com/databricks/cli/internal/build.buildTimestamp={{ .Timestamp }}

    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: databricks

    hooks:
      post:
        - .github/scripts/sign-windows.sh "{{ .Path }}"

archives:
  - formats: ["zip", "tar.gz"]

    # Include version in archive only for release builds and not for snapshot builds.
    # Snapshot archives must have a stable file name such that the artifacts in the nightly
    # release are automatically overwritten. If the snapshot version is included in the
    # file name then additional logic to clean up older builds would be needed.
    name_template: 'databricks_cli_{{ if not .IsSnapshot }}{{ .Version }}_{{ end }}{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: 'databricks_cli_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

snapshot:
  version_template: '{{ incpatch .Version }}-dev+{{ .ShortCommit }}'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
