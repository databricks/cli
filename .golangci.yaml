version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - mirror
    - perfsprint
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unused
    - exhaustruct_v5
    - exhaustive
    - copyloopvar
    - forbidigo
    - depguard
    - usestdlibvars
    - nilerr
    - fatcontext
    - nosprintfhostport
    - recvcheck
    - usetesting
    - dupword
    - misspell
    - nilnesserr
    - durationcheck
    - exptostd
    - gocheckcompilerdirectives
    - asciicheck
    - reassign
    - modernize
    - makezero
    - errorlint
  settings:
    errorlint:
      # errorf is on: switching %v to %w changes which errors callers can
      # match with errors.Is/As, so keep %v with a nolint reason where the
      # cause must not be visible to callers.
      errorf: true
    modernize:
      # omitzero changes JSON wire format for nested structs (unlike omitempty),
      # so each site needs per-site review rather than a bulk rewrite.
      disable:
        - omitzero

    depguard:
      rules:
        no-experimental-imports:
          # depguard matches against absolute file paths, so patterns must
          # start with **/ to match regardless of the repository location.
          files:
            - "**"
            - "!**/cmd/cmd.go"
            - "!**/cmd/experimental/**"
            - "!**/experimental/**"
          deny:
            - pkg: "github.com/databricks/cli/experimental"
              desc: "must not import experimental/ packages; use an interface or move the dependency"
        # aitools layers: cmd/aitools (cobra commands) -> libs/aitools -> shared
        # libs. Lower layers must not reach up. The aitools rules anchor their
        # files patterns at ${config-path} (the repository root) so that a
        # libs or cmd directory above the checkout does not match.
        aitools-libs-no-commands:
          files:
            - "${config-path}/libs/aitools/**"
          deny:
            - pkg: "github.com/databricks/cli/cmd$"
              desc: "libs/aitools must not import command packages; pass what it needs in from cmd/aitools"
            - pkg: "github.com/databricks/cli/cmd/"
              desc: "libs/aitools must not import command packages; pass what it needs in from cmd/aitools"
        aitools-commands-only-root:
          # lax: allow everything except cmd and cmd/*; the longer allow entries
          # win over the cmd/ deny.
          list-mode: lax
          files:
            - "${config-path}/cmd/aitools/**"
          allow:
            - "github.com/databricks/cli/cmd/root$"
            - "github.com/databricks/cli/cmd/root/"
            - "github.com/databricks/cli/cmd/aitools$"
            - "github.com/databricks/cli/cmd/aitools/"
          deny:
            - pkg: "github.com/databricks/cli/cmd$"
              desc: "cmd/aitools may import only cmd/root and itself; share code through libs/aitools instead of another command group"
            - pkg: "github.com/databricks/cli/cmd/"
              desc: "cmd/aitools may import only cmd/root and itself; share code through libs/aitools instead of another command group"
        libs-no-aitools:
          files:
            - "${config-path}/libs/**"
            - "!${config-path}/libs/aitools/**"
          deny:
            - pkg: "github.com/databricks/cli/libs/aitools$"
              desc: "shared libs must not depend on the aitools feature packages"
            - pkg: "github.com/databricks/cli/libs/aitools/"
              desc: "shared libs must not depend on the aitools feature packages"
        # cmd/root/root.go calls the aitools user-agent and hint hooks from the
        # root pre-run and the auto-install hook from the root post-run; keep
        # those calls in that one file. Tests may import aitools to stub them.
        root-aitools-hooks-in-root-go:
          files:
            - "${config-path}/cmd/root/**"
            - "!${config-path}/cmd/root/root.go"
            - "!$test"
          deny:
            - pkg: "github.com/databricks/cli/libs/aitools$"
              desc: "aitools hooks belong in cmd/root/root.go only"
            - pkg: "github.com/databricks/cli/libs/aitools/"
              desc: "aitools hooks belong in cmd/root/root.go only"
        no-legacy-rand:
          deny:
            - pkg: "math/rand$"
              desc: "use math/rand/v2 instead of math/rand"
        no-stdlib-log:
          files:
            - "**"
            - "!**/bundle/internal/schema/**"
            - "!**/bundle/internal/validation/**"
            - "!**/internal/cligen/**"
          deny:
            - pkg: "log$"
              desc: "use libs/log instead of the standard library log package"
    forbidigo:
      forbid:
        - pattern: 'term\.IsTerminal'
          msg: Use cmdio.IsPromptSupported(ctx) to check for a TTY.
        - pattern: 'isatty\.IsTerminal'
          msg: Use cmdio.IsPromptSupported(ctx) to check for a TTY.
        - pattern: 'isatty\.IsCygwinTerminal'
          msg: Use cmdio.IsPromptSupported(ctx) to check for a TTY.
        - pattern: 'os\.UserHomeDir'
          msg: Use env.UserHomeDir(ctx) from libs/env instead.
        - pattern: 'os\.Getenv'
          msg: Use env.Get(ctx) from the libs/env package instead of os.Getenv.
        - pattern: 'sort\.Slice'
          msg: Use slices.SortFunc from the standard library instead.
        - pattern: 'sort\.SliceStable'
          msg: Use slices.SortStableFunc from the standard library instead.
        - pattern: 'sort\.Strings'
          msg: Use slices.Sort from the standard library instead.
        - pattern: 'sort\.Ints'
          msg: Use slices.Sort from the standard library instead.
        - pattern: 'sort\.Float64s'
          msg: Use slices.Sort from the standard library instead.
        - pattern: 'os\.IsNotExist'
          msg: Use errors.Is(err, fs.ErrNotExist) instead.
        - pattern: 'os\.IsExist'
          msg: Use errors.Is(err, fs.ErrExist) instead.
        - pattern: 'os\.IsPermission'
          msg: Use errors.Is(err, fs.ErrPermission) instead.
        - pattern: 'sync\.Once\b($|[^FV])'
          msg: Use sync.OnceFunc, sync.OnceValue, or sync.OnceValues instead.
        - pattern: 'errors\.As\b'
          msg: 'Use errors.AsType[T](err) for type-safe error unwrapping (Go 1.26+).'
        - pattern: '^yaml\.NewEncoder$'
          pkg: '^go\.yaml\.in/yaml/v4$'
          msg: Use yamlutil.Encode from libs/yamlutil instead; yaml.NewEncoder wraps lines at 80 columns in go-yaml v4 (yaml/go-yaml#525).
      analyze-types: true
    recvcheck:
      # recvcheck v0.3 switched its built-in exclusions from Marshal* to
      # Unmarshal*. Value-receiver MarshalJSON paired with pointer-receiver
      # UnmarshalJSON is the idiomatic pattern, so keep excluding both.
      exclusions:
        - "*.MarshalText"
        - "*.MarshalJSON"
        - "*.MarshalYAML"
        - "*.MarshalXML"
        - "*.MarshalBinary"
        - "*.GobEncode"
    copyloopvar:
      check-alias: true
    errcheck:
      exclude-functions:
        - (*github.com/spf13/cobra.Command).RegisterFlagCompletionFunc
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
        - (*github.com/spf13/pflag.FlagSet).MarkDeprecated
        - (*github.com/spf13/pflag.FlagSet).MarkHidden
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
          exclude:
            - TEST
            - "**/integration/**"
            - "**/internal/testcli/**"
            - "**/internal/testutil/**"
            - "**/libs/testdiff/**"
            - "**/libs/python/pythontest/**"
        - name: error-return
        - name: errorf
        - name: unconditional-recursion
        - name: use-waitgroup-go
    gocritic:
      disable-all: true
      enabled-checks:
        - ruleguard
        - offBy1
      settings:
        ruleguard:
          failOn: all
          rules: libs/gorules/rule_*.go
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
      settings:
        printf:
          funcs:
            - (github.com/databricks/cli/internal/testutil.TestingT).Infof
            - (github.com/databricks/cli/internal/testutil.TestingT).Errorf
            - (github.com/databricks/cli/internal/testutil.TestingT).Fatalf
            - (github.com/databricks/cli/internal/testutil.TestingT).Skipf
    staticcheck:
      checks:
        - all
        # disabled checks:
        - -ST1003
    testifylint:
      enable-all: true
      disable:
        - require-error # good check, but we have too many assert.(No)?Errorf? so excluding for now
        - encoded-compare # Always replaces Equal() with JSONEq, but sometimes exact string match is wanted for JSON
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path-except: bundle/direct/dresources|bundle/config/mutator/load_dbalert_files.go
        linters:
          - exhaustruct_v5
      - path: bundle/direct/dresources/.*_test.go
        linters:
          - exhaustruct_v5
      - text: "Use env\\.Get"
        path: "_test\\.go$"
        linters:
          - forbidigo
issues:
  max-issues-per-linter: 1000
  max-same-issues: 1000
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: a[b:len(a)]
          replacement: a[b:]
        - pattern: interface{}
          replacement: any
    gofumpt:
      module-path: github.com/databricks/cli
      extra:
        group-params: true
  exclusions:
    generated: lax
