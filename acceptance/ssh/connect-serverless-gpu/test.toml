Local = true
Cloud = false

# Serverless GPU is only available in newer environments
RequiresUnityCatalog = true

# Assert the serverless GPU bootstrap job the CLI submits on a local run.
RecordRequests = true

# Local runs stage stand-in release archives here; not part of the golden output.
Ignore = [
  "releases",
]

# The local run drives a real sshd behind the test server's tunnel; running it as
# a non-root user in inetd mode with a throwaway config is reliable on Linux (which
# is where task test-exp-ssh provisions openssh-server), not on macOS/Windows. GOOS
# keys absent from this map default to enabled, so the other OSes must be disabled
# explicitly to keep the test Linux-only.
[GOOS]
  linux = true
  darwin = false
  windows = false

# Serverless GPU is not available in GCP yet
[CloudEnvs]
  gcp = false

[EnvMatrix]
  DATABRICKS_BUNDLE_ENGINE = ["direct"]
