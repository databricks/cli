Cloud = false

# Serverless GPU is only available in newer environments

# Assert the serverless GPU bootstrap job the CLI submits on a local run.
RecordRequests = true

# Local runs stage stand-in release archives here; not part of the golden output.
Ignore = [
  "releases",
]

# Linux-only: the local run drives a real sshd, reliable only there (and where
# task test-ssh provisions it). Absent GOOS keys default to enabled, so the
# other OSes must be disabled explicitly.
GOOS.linux = true
GOOS.darwin = false
GOOS.windows = false

# Serverless GPU is not available in GCP yet
CloudEnvs.gcp = false

EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
