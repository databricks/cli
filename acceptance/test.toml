# Default settings that apply to all tests unless overriden by test.toml files in inner directories.
# Tests always run locally; set Cloud = true to also run on a real workspace.
# Cloud = false (the inherited default) therefore means local only.
# CloudSlow only narrows a Cloud = true run (skipped under -short); it does not enable cloud on its own.
Cloud = false

# default timeouts
Timeout = '60s'
TimeoutWindows = '90s'

# Slowest test I saw:
# github.com/databricks/cli/acceptance TestAccept/bundle/integration_whl/interactive_single_user 18m8.69s
# http://go/deco/tests/14775362030/job/41482560953
TimeoutCloud = '25m'

TimeoutCIMultiplier = 2

Env.PYTHONDONTWRITEBYTECODE = "1"
Env.PYTHONUNBUFFERED = "1"
Env.PYTHONUTF8 = "1"

# The direct engine reports resources as soon as each one is applied, and resources are
# applied in parallel, so the order of these lines is not deterministic. Sort each run of
# them before comparing, so tests pin which resources were applied, not the order.
# A test that needs the raw order sets SortLinesOn.deploy_actions = false.
SortLines.deploy_actions = '^(Created|Updated|Deleted|Recreated|Resized) \S+$'

EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["terraform", "direct"]
EnvMatrixExclude.noplantf = ["DATABRICKS_BUNDLE_ENGINE=terraform", "READPLAN=1"]
EnvRepl.DATABRICKS_BUNDLE_ENGINE = false

# >>> datetime.datetime.fromtimestamp(18000000000)
# datetime.datetime(2027, 1, 15, 9, 0)
# >>> datetime.datetime.fromtimestamp(1900000000)
# datetime.datetime(2030, 3, 17, 18, 46, 40)

[[Repls]]
Old = '\d{20,}'
New = "[NUMID]"
Order = 10

[[Repls]]
Old = '1[78]\d{17}'
New = '[UNIX_TIME_NANOS]'
Order = 10
Distinct = true

[[Repls]]
Old = '\d{17,}'
New = "[NUMID]"
Order = 10

#[[Repls]]
# This makes certain integration tests flaky as experiment IDs overlap in range with this regex
#Old = '1[78]\d{14}'
#New = '[UNIX_TIME_MICROS]'
#Order = 10

[[Repls]]
Old = '\d{14,}'
New = "[NUMID]"
Order = 10

[[Repls]]
Old = '1[78]\d{11}'
New = '[UNIX_TIME_MILLIS]'
Order = 10
Distinct = true

[[Repls]]
Old = '\d{11,}'
New = "[NUMID]"
Order = 10

[[Repls]]
Old = '1[78]\d{8}'
New = '[UNIX_TIME_S]'
Order = 10

[[Repls]]
Old = '\d{8,}'
New = "[NUMID]"
Order = 10

[[Repls]]
# "2025-10-23T14:26:43.499488Z"
Old = '2\d\d\d-\d\d-\d\d(T| )\d\d:\d\d:\d\d\.\d+(Z|[+-]\d\d:\d\d)?'
New = "[TIMESTAMP]"
Order = 9

[[Repls]]
# "2025-10-23T14:26:43"
# "2025-10-23T14:26:43Z"
Old = '2\d\d\d-\d\d-\d\d(T| )\d\d:\d\d:\d\d(Z|[+-]\d\d:\d\d)?'
New = "[TIMESTAMP]"
Order = 9

[[Repls]]
Old = "deco-uc-prod-isolated-aws-us-east-1|metastore_azure_eastus2"
New = "[METASTORE_NAME]"
