# Pin the color and terminal env so the profile output does not depend on the host.
Env.TERM = "xterm-256color"
Env.COLORTERM = ""
Env.CLICOLOR = ""
Env.CLICOLOR_FORCE = ""
Env.NO_COLOR = ""
Env.CI = ""
Env.TERM_PROGRAM = ""
Env.WT_SESSION = ""

# Only the non-interactive paths run here. Live rendering and raw mode need a
# real TTY, which is checked by hand under a PTY.

# The scripts use bash, printf and sleep, and the goldens embed bubbletea escape
# sequences. Not verified on Windows, so these tests run on Linux and macOS only.
GOOS.windows = false
