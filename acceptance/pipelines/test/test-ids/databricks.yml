bundle:
  name: test-pipeline-test-ids

resources:
  pipelines:
    my_pipeline:
      name: test-pipeline-test-ids
      root_path: ./pipeline
      libraries:
        - file:
            path: ./pipeline/transformations/orders.py
      testing:
        sources:
          - glob:
              include: ./pipeline/tests/**
    split:
      name: test-pipeline-test-ids-split
      root_path: ./src/split
      libraries:
        - file:
            path: ./src/split/transformations/returns.py
      testing:
        sources:
          - glob:
              include: ./tests/**
