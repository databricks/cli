Badness = "On a UC Volume, a file DELETE that is applied but answered with a 504 (e.g. a gateway timeout) is retried by the Files API filer, the retry gets 404, and the filer reports \"file does not exist\": fs rm fails although the file is gone, and fs rm -r stops and leaves the directories behind. A 404 on a retried delete means the earlier attempt deleted the path, so both commands should succeed (fs rm -r removing the whole tree)."
