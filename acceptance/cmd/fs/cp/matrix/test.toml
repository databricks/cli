Cloud = true

# Every pair of source and target kinds, as separate variants so they run in parallel.
# The script replaces the paths with [SRC] and [DST], so all variants share one output.
EnvMatrix.SRC = ["local", "dbfs", "volume"]
EnvMatrix.DST = ["local", "dbfs", "volume"]
EnvRepl.SRC = false
EnvRepl.DST = false

[[Repls]]
Old = 'dbfs:\[(SRC|DST)\]'
New = '[$1]'
