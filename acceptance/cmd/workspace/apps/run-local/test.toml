Cloud = false
RecordRequests = false

# The command is unrelated to bundle deployment, so run it once rather than per engine.

# Ports are allocated per run. Mask them by context: a bare-number replacement would also hit
# a matching run of digits inside the X-Request-Id UUID and break its [UUID] masking.
[[Repls]]
Old = 'http://(127\.0\.0\.1|localhost):\d+'
New = 'http://$1:[PROXY_PORT]'

[[Repls]]
Old = '"Host": "127\.0\.0\.1:\d+"'
New = '"Host": "127.0.0.1:[APP_PORT]"'

[[Repls]]
Old='curl/[0-9]+\.[0-9]+\.[0-9]+'
New='curl/(version)'
