# The startup lookup of the service is rejected, so serve exits 2 before it serves. Its PROXY_STARTED event records the
# failure as AUTH_FAILED, and the upload that follows carries it.
[[Server]]
Pattern = "GET /api/2.1/unity-catalog/mcp-services/{name}"
Response.StatusCode = 401
Response.Body = '{"error_code": "UNAUTHENTICATED", "message": "Invalid access token."}'
