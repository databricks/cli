# The startup lookup of the service is rejected, so serve exits 2 before it serves. A start that fails its checks logs no
# event, so no upload follows: the rejected token is not sent again.
[[Server]]
Pattern = "GET /api/2.1/unity-catalog/mcp-services/{name}"
Response.StatusCode = 401
Response.Body = '{"error_code": "UNAUTHENTICATED", "message": "Invalid access token."}'
