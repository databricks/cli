# The fake workspace serves the services that each script creates through the POST handler, so the
# listing is the one the API would return for the parent schema. Agent home overrides are cleared so
# a developer's own settings never reach the agent config files that the tests write.
Ignore = [
    "home",
]

[Env]
CLAUDE_CONFIG_DIR = ""
CODEX_HOME = ""
COPILOT_HOME = ""
GEMINI_CLI_HOME = ""
XDG_CONFIG_HOME = ""
APPDATA = ""
