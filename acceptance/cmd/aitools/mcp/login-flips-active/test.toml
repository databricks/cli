# github needs sign-in and genie_one_mcp does not. The sign-in is completed by the script, which
# creates the credential on the fake while login waits for it.
[[Server]]
Pattern = "GET /api/2.1/unity-catalog/mcp-services/system.ai.github"
Response.Body = '''
{
  "name": "mcp-services/system.ai.github",
  "comment": "Repositories, issues, pull requests",
  "config": {
    "source_connection": {
      "name": "connections/github",
      "options": {
        "oauth_provider": "github"
      }
    }
  }
}
'''

[[Server]]
Pattern = "GET /api/2.1/unity-catalog/mcp-services/system.ai.genie_one_mcp"
Response.Body = '''
{
  "name": "mcp-services/system.ai.genie_one_mcp",
  "comment": "Ask questions about your data"
}
'''
