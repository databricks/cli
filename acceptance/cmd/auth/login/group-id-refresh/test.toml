Ignore = ["home"]
RecordRequests = true

[[Server]]
Pattern = "POST /oidc/v1/token"
Response.Body = '''
{
  "access_token": "refreshed-access-token",
  "refresh_token": "refreshed-refresh-token",
  "expires_in": 3600,
  "scope": "all-apis",
  "token_type": "Bearer"
}
'''
[Server.Response.Headers]
"Content-Type" = ["application/json"]
