RecordRequests = true
IncludeRequestHeaders = ["User-Agent"]

# Normalize OS-dependent and CI-only User-Agent segments so the recorded requests are stable everywhere.
[[Repls]]
Old = '(linux|darwin|windows)'
New = '[OS]'

[[Repls]]
Old = " cicd/[A-Za-z0-9.-]+"
New = ""

[[Server]]
Pattern = "GET /api/2.0/preview/scim/v2/Me"
Response.Body = '{"id":"1","userName":"user@example.com"}'
