experiment_name: torchrun-a10-smoke-test
command: |
  cd $CODE_SOURCE_PATH
  torchrun --nproc_per_node=1 train.py
compute:
  accelerator_type: GPU_1xA10
  num_accelerators: 1
  pool_id: capacity-1
  priority_class: NORMAL
mlflow_artifact_location: dbfs:/Volumes/main/default/artifacts
mlflow_run_name: "  run-42  "
mlflow_experiment_directory: "  /Workspace/Users/tester/experiments  "
environment:
  version: 5
  dependencies:
    - numpy
code_source:
  type: snapshot
  snapshot:
    root_path: ./src
