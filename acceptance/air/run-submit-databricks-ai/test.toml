# Verify that a Databricks AI environment version is accepted for submission.
RecordRequests = true

[[Server]]
Pattern = "HEAD /"
Response.Body = ''

[[Server]]
Pattern = "POST /api/2.0/ai-training/config:validate"
Response.Body = '{}'

[[Server]]
Pattern = "POST /api/2.2/jobs/runs/submit"
Response.Body = '''
{"run_id": 555}
'''

[[Repls]]
Old = 'databricks-ai-v5-smoke_[0-9a-f]{16}'
New = 'databricks-ai-v5-smoke_[RUN_ID]'
