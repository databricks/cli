Badness = "With -o json, a databricks.yml that fails to load (\"bundle diagnostics are reported once (json)\") prints only the text diagnostic \"Error: multiple targets are marked as default\" and no JSON envelope on stdout, so -o json consumers get no machine-readable error; it should print an INVALID_ARGS error envelope like the other config errors (air get has the same gap)."

[[Server]]
Pattern = "POST /api/2.0/ai-training/config:validate"
Response.Body = '{}'

# The bundle loader lists default targets in map order.
[[Repls]]
Old = 'marked as default \((dev, dev2|dev2, dev)\)'
New = 'marked as default ([TARGETS])'
