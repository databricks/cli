# A real (non-dry-run) submit from a directory with no git repository: the
# snapshot falls back to plain_tar over the whole working tree, and the CLI
# says so (file count + uncompressed size) before packaging, including on the
# second, cache-hit submit. -o json skips the notice.
RecordRequests = true

# main.py/run.log/weights.bin are generated by the script (the point of the
# test is that a non-git code_source packages them); not committed inputs.
Ignore = ["main.py", "run.log", "weights.bin"]

# The SDK probes host reachability with a HEAD request; stub it for determinism.
[[Server]]
Pattern = "HEAD /"
Response.Body = ''

[[Server]]
Pattern = "POST /api/2.0/ai-training/config:validate"
Response.Body = '{}'

[[Server]]
Pattern = "POST /api/2.2/jobs/runs/submit"
Response.Body = '''
{"run_id": 555}
'''

# The snapshot tarball is named <dir>_<key[:16]>.tar.gz; the temp-dir basename
# and the working-tree fingerprint vary per run, so collapse the name. The
# notice's count and size are NOT masked: the committed inputs make them
# deterministic, so the golden asserts them exactly.
[[Repls]]
Old = '[a-zA-Z0-9._-]+_[0-9a-f]{16}\.tar\.gz'
New = '[SNAPSHOT_TARBALL]'

# The per-run launch directory ends in <experiment>_<16 hex>; the random suffix varies.
[[Repls]]
Old = 'submit-non-git-smoke_[0-9a-f]{16}'
New = 'submit-non-git-smoke_[RUN_ID]'
