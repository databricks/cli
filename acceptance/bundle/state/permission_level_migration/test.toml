# The seeded state is a version-1 one, whose migration to version 2 is the whole point here.
# Marking it as recorded (the way the other state-seeding tests do) would mean writing it at
# featureStateVersion, where migrateState returns before running any migration. So recording
# refuses it, and it has to: an unmarked state with resources cannot be handed to the service.
EnvMatrix.DMS = [""]

Ignore = [".databricks"]

EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
