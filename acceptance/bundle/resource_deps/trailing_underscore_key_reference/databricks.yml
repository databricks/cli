bundle:
  name: test-bundle

# A job resource key ending in an underscore (e.g. producer_) is a valid, deployable
# key, and ${resources.jobs.producer_.id} now resolves like any other reference. The
# reference regex (libs/dyn/dynvar/ref.go) allows trailing underscores (but not a
# trailing hyphen). Before the fix the reference was silently dropped with a warning
# and run_job_task ended up without a job_id.
resources:
  jobs:
    producer_:
      name: producer
    consumer:
      name: consumer
      tasks:
        - task_key: run_producer
          run_job_task:
            job_id: ${resources.jobs.producer_.id}
