bundle:
  name: test-bundle

# Reproduce: a job whose resource key ends with an underscore (a valid, deployable
# key) cannot be referenced with ${resources.jobs.<key>.id}. The reference regex
# (libs/dyn/dynvar/ref.go) requires every path segment to end with a letter or digit,
# so "producer_" is not recognized as a reference. The string is therefore left as-is
# in an int field: validation only warns ("cannot parse ... as an integer") and drops
# it, so run_job_task ends up with no job_id (see the empty run_job_task in output.txt).
resources:
  jobs:
    producer_:
      name: producer
    consumer:
      name: consumer
      tasks:
        - task_key: run_producer
          run_job_task:
            job_id: ${resources.jobs.producer_.id}
