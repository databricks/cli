bundle:
  name: test-bundle

resources:
  jobs:
    bar:
      name: job bar
    foo:
      name: job foo
      tasks:
        - task_key: job_task
          notebook_task:
            notebook_path: /notebook
            base_parameters:
              # Badness: $${resources.jobs.bar.id} is not treated as a literal
              # "${resources.jobs.bar.id}" — the escape is ignored for resource paths.
              # The deploy engine treats it as a real cross-resource dependency.
              ref: $${resources.jobs.bar.id}
