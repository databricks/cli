bundle:
  name: test-bundle

experimental:
  python_wheel_wrapper: true

resources:
  jobs:
    whl:
      name: wheel-job
      tasks:
        - task_key: test_task
          python_wheel_task:
            package_name: my_package
            entry_point: my_module.my_function
            # The wrapper moves the parameters into the notebook it generates during the build, so
            # this reference to the job's own id is not a cycle.
            parameters: ["${resources.jobs.whl.id}"]
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 1
          libraries:
            - whl: /Workspace/Shared/my_package-0.1-py3-none-any.whl
