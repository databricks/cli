bundle:
  name: strict-profile-match

include:
  - scripts.yml

targets:
  classic:
    default: true
    workspace:
      host: $CLASSIC_HOST
  custom_host:
    workspace:
      host: $CUSTOM_HOST/?o=$WORKSPACE_ID
  custom_host_without_workspace_id:
    workspace:
      host: $CUSTOM_HOST
  no_host_with_workspace_id:
    workspace:
      workspace_id: "$WORKSPACE_ID"
