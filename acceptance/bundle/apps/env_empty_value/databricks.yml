bundle:
  name: test-bundle

variables:
  warehouse_id:
    default: ""

resources:
  apps:
    myapp:
      name: myapp
      source_code_path: ./app
      config:
        env:
          - name: STATIC_VALUE
            value: static
          - name: SECRET_VALUE
            value_from: my_secret
          - name: WAREHOUSE_ID
            value: ${var.warehouse_id}
