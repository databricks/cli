Cloud = false
RecordRequests = false

# Saved-plan deploy (`--plan`) and the IsGone gone-detection are direct-engine only.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

Ignore = [".databricks", "databricks.yml", "plan_delete.json"]

# Test uses a saved plan file; not supported under DMS (which requires in-place
# plan generation with deployment history recording).
EnvMatrixExclude.dms_plan_file = ["DMS=true"]
