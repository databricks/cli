Badness = "A null value for a property of type number crashes bundle init with a nil-pointer panic in the JSON schema type check, both when it comes from --config-file and when it is in the template schema's enum. A null for an integer property that only a root anyOf schema declares crashes the same way, because only top-level properties are converted to integers first. Each should fail with a clean validation error instead of a panic, as a null for a top-level integer, string or boolean property already does."
Ignore = ["rendered"]
