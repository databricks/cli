bundle:
  name: serverless_job_cluster

resources:
  jobs:
    serverless_id:
      name: serverless-id
      job_clusters:
        - job_cluster_key: shared
          serverless_compute_id: test-compute
      environments:
        - environment_key: env
          spec:
            environment_version: "4"
            dependencies:
              - ./dist/*.whl
      tasks:
        - task_key: wheel
          job_cluster_key: shared
          environment_key: env
          python_wheel_task:
            package_name: my_package
            entry_point: main
    classic:
      name: classic
      job_clusters:
        - job_cluster_key: shared
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 1
      tasks:
        - task_key: wheel
          job_cluster_key: shared
          python_wheel_task:
            package_name: my_package
            entry_point: main
          libraries:
            - whl: ./dist/*.whl
