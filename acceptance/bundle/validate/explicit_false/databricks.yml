bundle:
  name: test-bundle
  deployment:
    lock:
      force: true

workspace:
  azure_use_msi: true

variables:
  plain:
    default: x
    sensitive: false

artifacts:
  whl:
    type: whl
    build: "true"
    dynamic_version: false
  overridden:
    type: whl
    build: "true"
    dynamic_version: true

experimental:
  python_wheel_wrapper: false
  use_legacy_run_as: false
  skip_artifact_cleanup: false
  skip_name_prefix_for_schema: false

targets:
  dev:
    default: true
    # Each of these turns off what the root config turns on.
    bundle:
      deployment:
        lock:
          force: false
    workspace:
      azure_use_msi: false
    artifacts:
      overridden:
        dynamic_version: false
