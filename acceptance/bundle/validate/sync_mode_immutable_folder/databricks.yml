bundle:
  name: test-bundle

experimental:
  immutable_folder: true

resources:
  jobs:
    my_job:
      name: my job
      tasks:
        - task_key: my_task
          existing_cluster_id: "0101-120000-aaaaaaaa"
          spark_python_task:
            python_file: ./src/main.py

targets:
  default:
    default: true
  source_linked_disabled:
    presets:
      source_linked_deployment: false
  source_linked_enabled:
    presets:
      source_linked_deployment: true
  with_sync_mode:
    workspace:
      sync_mode: overwrite
