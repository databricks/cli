bundle:
  name: test-bundle
  cluster_id: root-cluster
  git:
    branch: root-branch

workspace:
  root_path: /Workspace/root
  file_path: /Workspace/root/files

artifacts:
  whl:
    type: whl
    build: build-root
    files:
      - source: root.whl

experimental:
  skip_name_prefix_for_schema: true

presets:
  name_prefix: root-
  tags:
    root: "1"

sync:
  include:
    - databricks.yml

permissions:
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}

variables:
  scalar:
    description: from root
    default: root
  complex:
    type: complex
    default:
      root: root
      shared: root
      list: [root]

scripts:
  root_script:
    content: echo root

run_as:
  user_name: root@example.com

targets:
  dev:
    bundle:
      cluster_id: override-cluster
      git:
        origin_url: https://override.example.com

    workspace:
      root_path: /Workspace/override

    artifacts:
      whl:
        build: build-override
        files:
          - source: override.whl

    experimental:
      python_wheel_wrapper: true

    presets:
      name_prefix: override-
      tags:
        override: "1"

    sync:
      include:
        - "*.yml"

    permissions:
      - level: CAN_VIEW
        group_name: viewers

    variables:
      scalar:
        default: override
      complex:
        default:
          override: override
          shared: override
          list: [override]

    scripts:
      override_script:
        content: echo override

    run_as:
      service_principal_name: override-sp
