bundle:
  name: test-bundle

resources:
  jobs:
    j:
      name: job
      tasks:
        - task_key: task
          notebook_task:
            notebook_path: /notebook
      lifecycle:
        prevent_destroy: true

  clusters:
    c:
      spark_version: "15.4.x-scala2.12"
      node_type_id: "i3.xlarge"
      num_workers: 2
      lifecycle:
        prevent_destroy: true

targets:
  dev:
    resources:
      jobs:
        j:
          lifecycle:
            prevent_destroy: false
      clusters:
        c:
          lifecycle:
            prevent_destroy: false
