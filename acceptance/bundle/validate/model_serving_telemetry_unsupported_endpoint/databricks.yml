bundle:
  name: "model_serving_telemetry"

resources:
  model_serving_endpoints:
    # Typed NO_CONFIG by the API: nothing is served.
    endpoint1:
      name: "test-endpoint-1"
      telemetry_config:
        table_names:
          logs_table: main.default.test_logs

    # Typed EXTERNAL_MODELS by the API: it serves something, but not a custom model.
    endpoint2:
      name: "test-endpoint-2"
      config:
        served_entities:
          - name: prod
            external_model:
              name: gpt-4o-mini
              provider: openai
              task: llm/v1/chat
              openai_config:
                openai_api_key_plaintext: sk-test-plaintext-key
      telemetry_config:
        table_names:
          logs_table: main.default.test_logs
