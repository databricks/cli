bundle:
  name: test-bundle

resources:
  sql_warehouses:
    # Missing name: required by the backend, optional in the SDK
    # (json:"name,omitempty").
    my_warehouse:
      cluster_size: "2X-Small"
    # Whitespace-only name: the backend rejects name.trim.nonEmpty, so this is
    # treated as missing too.
    blank_warehouse:
      name: "   "
      cluster_size: "2X-Small"
