# The current user belongs to the workspace-local groups admins and users. The
# parent-groups response names them, so their CAN_MANAGE grant counts as manageable.
[[Server]]
Pattern = "GET /api/2.0/identity/me/transitive-parent-groups"
Response.Body = '{"me_transitive_parent_groups": [{"group_id": "1", "group_name": "admins"}, {"group_id": "2", "group_name": "users"}]}'
