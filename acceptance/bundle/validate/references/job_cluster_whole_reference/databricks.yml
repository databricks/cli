bundle:
  name: test-bundle

resources:
  jobs:
    base:
      job_clusters:
        - job_cluster_key: main
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 1
            workload_type:
              clients:
                jobs: false
    viaref:
      job_clusters:
        - job_cluster_key: main
          new_cluster: ${resources.jobs.base.job_clusters[0].new_cluster}
