bundle:
  name: test-bundle

# This test verifies that anchors grouped in a list or a map do not trigger
# "unknown field" warnings. The suppression recurses into containers whose
# elements are all anchors.

task_defaults: &task_defaults
  max_retries: 3

parameter_items:
  - &p_root
    name: root_path
    default: ${workspace.root_path}
  - &p_core_whl
    name: core_whl
    default: ${var.core_whl}

parameter_map:
  root: &p_root_map
    name: root_path

resources:
  jobs:
    my_job:
      name: "test job with anchors"
      tasks:
        - task_key: "main"
          <<: *task_defaults
          notebook_task:
            notebook_path: "/some/notebook"
