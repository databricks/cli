bundle:
  name: test-bundle

resources:
  catalogs:
    my_catalog:
      name: my_catalog
      grants:
        # Missing principal: required by the backend but modeled as optional
        # (json:"principal,omitempty") in the SDK. See DECO-27550.
        - privileges:
            - ALL_PRIVILEGES
  schemas:
    my_schema:
      catalog_name: my_catalog
      name: my_schema
      grants:
        # Valid grant: principal is set.
        - principal: alice@example.com
          privileges:
            - USE_SCHEMA
