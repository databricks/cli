bundle:
  name: test-bundle

resources:
  catalogs:
    my_catalog:
      name: my_catalog
      grants:
        # Missing principal: required by the backend, optional in the SDK
        # (json:"principal,omitempty").
        - privileges:
            - ALL_PRIVILEGES
  schemas:
    my_schema:
      catalog_name: my_catalog
      name: my_schema
      grants:
        # Valid grant: principal is set.
        - principal: alice@example.com
          privileges:
            - USE_SCHEMA
