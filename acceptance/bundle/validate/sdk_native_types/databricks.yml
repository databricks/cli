bundle:
  name: sdk-native-types

resources:
  postgres_projects:
    my_project:
      project_id: test-pg-proj
      display_name: Test
      pg_version: 16

  postgres_branches:
    bad_expire_time:
      parent: ${resources.postgres_projects.my_project.id}
      branch_id: bad-expire-time
      expire_time: "2030-01-01"
    bad_ttl:
      parent: ${resources.postgres_projects.my_project.id}
      branch_id: bad-ttl
      ttl: 1h
    valid:
      parent: ${resources.postgres_projects.my_project.id}
      branch_id: valid
      expire_time: 2030-01-01T00:00:00Z
