bundle:
  name: test-bundle
  cluster_id: root-cluster

include:
  - override.yml

workspace:
  root_path: /Workspace/root

presets:
  name_prefix: root-
  tags:
    root: "1"

sync:
  include:
    - databricks.yml

permissions:
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}

variables:
  scalar:
    default: root
  complex:
    type: complex
    default:
      key: root

run_as:
  user_name: root@example.com

artifacts:
  whl:
    type: whl
    build: build-root
