bundle:
  name: test-bundle

resources:
  model_serving_endpoints:
    endpoint1:
      name: test-endpoint
      ai_gateway:
        # Empty invalid_keywords entries crash the Terraform provider on deploy.
        guardrails:
          input:
            invalid_keywords:
              - secret
              - ""
          output:
            invalid_keywords:
              - ""
      config:
        served_entities:
          - entity_name: my-entity
            entity_version: "2"
