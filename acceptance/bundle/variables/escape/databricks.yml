bundle:
  name: test-bundle

variables:
  catalog:
    default: main

resources:
  jobs:
    ingest:
      name: ingest-job
      tasks:
        - task_key: run_notebook
          notebook_task:
            notebook_path: /notebooks/ingest
            base_parameters:
              # Verbatim from the issue: pure escaped reference
              option_a: $${test_var}
              # Mixed: real bundle variable alongside escaped runtime placeholders
              catalog: ${var.catalog}
              source_file: $${source_file}
              # Escaped reference with brackets (common in date-range patterns)
              date_range: $${business_date[0..9]}
