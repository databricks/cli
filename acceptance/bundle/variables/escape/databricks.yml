bundle:
  name: test-bundle

variables:
  catalog:
    default: main

resources:
  jobs:
    ingest:
      name: ingest-job
      tasks:
        - task_key: run_notebook
          notebook_task:
            notebook_path: /notebooks/ingest
            base_parameters:
              # $${...} is the escape for a literal ${...} that the Databricks
              # runtime should interpret, not the bundle variable system.
              # Mixed: ${var.catalog} is a real bundle variable; $${source_file}
              # is a literal that should reach the API as "${source_file}".
              catalog: ${var.catalog}
              source_file: $${source_file}
              date_range: $${business_date[0..9]}
