Env.DATABRICKS_BUNDLE_HTTP_TIMEOUT_SECONDS = "5"
Env.DATABRICKS_BUNDLE_RETRY_INTERVAL_MS = "100"
SuppressLines.warn_retry = ""
RecordRequests = true

[[Server]]
# Every upload attempt outlives the 5s inactivity timeout. Uploads overwrite, so the CLI retries
# them twice before giving up.
Delay = "30s"
Pattern = "POST /api/2.0/workspace-files/import-file/Workspace/Users/tester@databricks.com/.bundle/test-bundle/default/files/file_to_upload.txt"
Response.StatusCode = 200
