RecordRequests = true
IncludeRequestHeaders = ["User-Agent"]

# Telemetry reports numbers about the state that recording legitimately changes: the byte size of
# the serialized state, which the deployment stamp grows, and the state serial, which comes from the
# deployment's recorded version rather than the file. Those numbers are the assertion here, so there
# is nothing to normalize.
EnvMatrix.DMS = [""]

Env.DATABRICKS_CACHE_ENABLED = 'false'

[[Repls]]
Old = '"execution_time_ms": \d{1,5},'
New = '"execution_time_ms": SMALL_INT,'

# Same replacement for compact JSON inside protoLogs strings (no space after colon).
[[Repls]]
Old = 'execution_time_ms\\":\d{1,5},'
New = 'execution_time_ms\\":SMALL_INT,'

[[Repls]]
Old = '(linux|darwin|windows)'
New = '[OS]'

[[Repls]]
Old = '"local_cache_measurements_ms": \[[^\]]*\]'
New = '"local_cache_measurements_ms": [...redacted...]'
