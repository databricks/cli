Cloud = true
Timeout = '1m'

Ignore = [
    '.venv',
]

EnvMatrix.UV_PYTHON = [
    "3.9",
    "3.10",
    "3.11",
    "3.12",
    "3.13",
]

EnvRepl.UV_PYTHON = true

[[Repls]]
# The patched wheel version carries a build timestamp.
Old = '0\.0\.1\+\d+'
New = '0.0.1+[WHEEL_BUILD]'

# Job ids; the resource keys embed $UNIQUE_NAME, so replace_ids.py names would vary per run.
[[Repls]]
Old = '/jobs/\d+'
New = '/jobs/[JOB_ID]'

[[Repls]]
Old = '"id": "\d+"'
New = '"id": "[JOB_ID]"'

[[Repls]]
Old = 'Standard_D3_v2'
New = '[NODE_TYPE_ID]'

[[Repls]]
Old = '\\\\'
New = '/'

[[Repls]]
# python is used on Windows
Old = "python setup.py bdist_wheel"
New = "python3 setup.py bdist_wheel"

[[Repls]]
# clean up ?[ow]=<num> suffix after URL since not all workspaces have that
Old = '\?[ow]=\[WORKSPACE_ID\]'
New = ''
Order = 1000

[[Repls]]
# Fix up for local and GCP
Old = '"user_name": "\[USERNAME\]"'
New = '"service_principal_name": "[USERNAME]"'
