# This is a Declarative Automation Bundle definition for my_lakeflow_integrations.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my_lakeflow_integrations
  uuid: [UUID]
  engine: direct

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel
  lakeflow_integrations_yaml:
    # inlined Python so the build is portable across Linux/Mac/Windows
    build: >
      uv run python -c "import shutil;
      shutil.rmtree('__generated__', ignore_errors=True);
      from databricks.lakeflow.integrations.generate import main;
      main([
        '--package-module', 'my_lakeflow_integrations',
        '--output-dir', '__generated__',
        '--environment-version', '5',
        '--environment-key', 'my_lakeflow_integrations_environment',
        '--dependency', '${workspace.artifact_path}/.internal/my_lakeflow_integrations-0.0.1-py3-none-any.whl',
      ])"
    files:
      - {"source": "__generated__/*.yml",}

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: [DATABRICKS_URL]
  prod:
    mode: production
    workspace:
      host: [DATABRICKS_URL]
      # We explicitly deploy to /Workspace/Users/[USERNAME] to make sure we only have a single copy.
      root_path: /Workspace/Users/[USERNAME]/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: [USERNAME]
        level: CAN_MANAGE
