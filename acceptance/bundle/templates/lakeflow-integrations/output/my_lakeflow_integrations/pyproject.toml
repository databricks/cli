[project]
name = "my_lakeflow_integrations"
version = "0.0.1"
authors = []
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    "databricks-lakeflow-integrations",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/my_lakeflow_integrations",
]

[dependency-groups]
dev = [
    # libraries part of serverless environment
    "requests",
    "databricks-sdk"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
