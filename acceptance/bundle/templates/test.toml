# Local-only: many env differences (catalog use, node type, etc).

# Template tests materialize and deploy full projects, taking tens of seconds each.
# Recording adds minutes without new coverage the rest of the suite provides.
EnvMatrix.DATABRICKS_BUNDLE_RECORD_DEPLOYMENT_HISTORY = [""]

[[Server]]
Pattern = "POST /telemetry-ext"
Response.Body = '''
{
    "errors": [],
    "numProtoSuccess": 1
}
'''
