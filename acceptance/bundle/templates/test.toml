# Local-only: At the moment, there are many differences across different envs w.r.t to catalog use, node type and so on.

# Template tests materialize and deploy full projects, taking tens of seconds each.
# Recording adds minutes without new coverage the rest of the suite provides.
EnvMatrix.DMS = [""]

# Several template tests diff.py-compare one template's fresh output against a sibling
# template's committed golden (e.g. serverless-customcatalog vs serverless). Numbering
# UUIDs per file would make those comparisons spurious, and the distinction adds no
# value for a rendered template, so keep [UUID] flat across the subtree.
UniqueUUID = false

[[Server]]
Pattern = "POST /telemetry-ext"
Response.Body = '''
{
    "errors": [],
    "numProtoSuccess": 1
}
'''
