Badness = 'A whole float beyond int64 fails: the Python output cannot be parsed.'
Ignore = [".databricks", "__pycache__", "tmp.json"]

# The position depends on the size of the Python output, which includes paths.
# The separator before the file name is a backslash on Windows.
[[Repls]]
Old = '[\\/]__generated_by_python__\.yml:\d+:\d+'
New = '/__generated_by_python__.yml:[POS]'
