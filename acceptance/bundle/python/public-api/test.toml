EnvMatrix.PYDAB_VERSION = ["current"]

# This test never invokes $CLI, so the deployment engine is irrelevant; pin a single
# engine so we don't run two identical variants.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
