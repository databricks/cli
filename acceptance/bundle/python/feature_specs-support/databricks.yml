bundle:
  name: my_project

sync: {paths: []} # don't need to copy files

python:
  resources:
    - "resources:load_resources"
  mutators:
    - "mutators:update_feature_spec"

resources:
  feature_specs:
    my_feature_spec_1:
      name: main.default.my_feature_spec_1
      features:
        - feature_lookup:
            table: main.default.user_features
            lookup_keys: [user_id]
            feature_names: [age]
