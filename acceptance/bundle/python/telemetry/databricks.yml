bundle:
  name: my_project

sync: {paths: []} # don't need to copy files

# Single line so the script can switch it to 'experimental/python'.
python: {resources: ["resources:load_resources"], mutators: ["mutators:update_job"]}

resources:
  jobs:
    yaml_job:
      name: "YAML Job"
  schemas:
    yaml_schema:
      catalog_name: main
      name: yaml_schema
