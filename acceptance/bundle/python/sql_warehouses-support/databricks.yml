bundle:
  name: my_project

sync: {paths: []} # don't need to copy files

python:
  resources:
    - "resources:load_resources"
  mutators:
    - "mutators:update_sql_warehouse"

resources:
  sql_warehouses:
    my_sql_warehouse_1:
      name: "my_sql_warehouse_1"
      cluster_size: "2X-Small"
      auto_stop_mins: 10
      max_num_clusters: 1
      min_num_clusters: 1
      warehouse_type: "CLASSIC"
