bundle:
  name: test-list-targets

variables:
  is_default:
    default: false
  target_mode:
    default: production
  target_host:
    default: https://var.example.com

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dev.example.com
  staging:
  prod:
    mode: production
    workspace:
      host: https://prod.example.com
  custom_host_query_id:
    workspace:
      host: https://custom.test/?o=1234
  custom_host_explicit_id:
    workspace:
      host: https://custom.test
      workspace_id: 5678
  custom_host_explicit_id_over_query:
    workspace:
      host: https://custom.test/?o=1234
      workspace_id: "5678"
  uses_terraform:
    bundle:
      engine: terraform
  uses_direct:
    bundle:
      engine: direct
  with_vars:
    default: ${var.is_default}
    mode: ${var.target_mode}
    workspace:
      host: ${var.target_host}
