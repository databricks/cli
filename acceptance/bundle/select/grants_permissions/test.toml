# Local-only: exercises --select (issue #5794) end to end against the testserver.
# It deploys a schema, so it needs a UC metastore; --select is direct-engine only.
Local = true
Cloud = false
RecordRequests = true
RequiresUnityCatalog = true
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
EnvMatrix.READPLAN = ["", "1"]
Ignore = [".databricks", ".gitignore", "databricks.yml", "plan-job.json", "plan-schema.json"]

[Env]
# The bundle name deliberately avoids the "permissions"/"schemas" tokens used in the
# print_requests.py filters, but set this too so Git Bash on Windows does not rewrite
# the leading "//" of "//permissions" into a path (see .agent/rules/testing.md).
MSYS_NO_PATHCONV = "1"
