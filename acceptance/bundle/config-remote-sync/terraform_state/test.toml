# Local-only: the replay fixtures are captured against the fake server, so they reproduce a
# terraform state only there, not on a real workspace.
Cloud = false

# The DMS variant does not apply to the migration story (see acceptance/bundle/migrate/test.toml).
EnvMatrix.DMS = [""]

Env.DATABRICKS_BUNDLE_ENABLE_EXPERIMENTAL_YAML_SYNC = "true"

Ignore = [".databricks"]
