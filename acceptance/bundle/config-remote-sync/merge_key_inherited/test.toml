Badness = "config-remote-sync --save rewrites every merge key in the file from '<<:' to '!!merge <<:', including the ones on lines it does not otherwise change (e.g. '<<: [*job_overrides, *other_job]' becomes '!!merge <<: [*job_overrides, *other_job]'). It should keep '<<:' as written."
Cloud = false
RecordRequests = false
Ignore = [".databricks", "databricks.yml", "databricks.yml.backup", "pipeline.yml", "pipeline.yml.backup"]

Env.DATABRICKS_BUNDLE_ENABLE_EXPERIMENTAL_YAML_SYNC = "true"
