Cloud = true
RequiresUnityCatalog = true

# RecordRequests captures the config-remote-sync telemetry event so the script
# can assert the variable-reference restoration counts (refs_retargeted /
# refs_from_siblings). out.requests.txt is removed in the script's cleanup so it
# is not compared.
RecordRequests = true
Ignore = [".databricks", "databricks.yml", "databricks.yml.backup"]

Env.DATABRICKS_BUNDLE_ENABLE_EXPERIMENTAL_YAML_SYNC = "true"

[EnvMatrix]
DATABRICKS_BUNDLE_ENGINE = ["direct", "terraform"]

# The state serial counts state writes, and the terraform path writes more times
# than the direct path for the same script, so the value differs per engine.
# The serial is not what this test asserts — normalize it.
[[Repls]]
Old = '"state_serial": [0-9]+'
New = '"state_serial": [SERIAL]'
