Local = true
Cloud = false

RecordRequests = false
Ignore = [".databricks", "databricks.yml", "databricks.yml.backup", "databricks.yml.second-backup", "overrides/*.yml", "overrides/*.backup"]

[Env]
DATABRICKS_BUNDLE_ENABLE_EXPERIMENTAL_YAML_SYNC = "true"

[EnvMatrix]
DATABRICKS_BUNDLE_ENGINE = ["direct", "terraform"]
