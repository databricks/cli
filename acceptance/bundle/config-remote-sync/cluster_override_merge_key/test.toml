Badness = "config-remote-sync --save rewrites every merge key in each file it writes from '<<:' to '!!merge <<:', including on lines it does not otherwise change (e.g. '- <<: *outside' becomes '- !!merge <<: *outside'). It should keep '<<:' as written."
Ignore = [".databricks", "databricks.yml", "databricks.yml.backup"]
