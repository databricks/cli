# On DBR, dev-mode bundles under /Workspace deploy source-linked, so the upload output differs.
RunsOnDbr = false

Cloud = true

RecordRequests = false
Ignore = [".databricks", "dummy.whl", "databricks.yml", "resources/job1.yml", "resources/job2.yml", "sample_exploration.ipynb"]

Env.DATABRICKS_BUNDLE_ENABLE_EXPERIMENTAL_YAML_SYNC = "true"
