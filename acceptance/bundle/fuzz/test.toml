# Local only: cloud round-trips are minutes per seed and trip SEED_TIMEOUT.
Cloud = false

# Nightly FUZZ_TIME_BUDGET plus the last seed's tail.
Timeout = '20m'

# Copied from ../invariant/test.toml (merge is directory-chain only); script asserts stub parity.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

Ignore = [
    ".databricks",
    ".venv",
    "databricks.yml",
    "plan.json",
    "*.py",
    "*.json",
    "*.err",
    "app",
    # Idempotency targets' pre-delete snapshot; may linger if a seed fails.
    ".databricks.backup",
]

EnvMatrix.FUZZ_TARGET = ["no_drift", "migrate", "delete_idempotent", "destroy_idempotent"]

# Fake SQL endpoint for local tests
[[Server]]
Pattern = "POST /api/2.0/sql/statements/"
Response.Body = '{"status": {"state": "SUCCEEDED"}, "manifest": {"schema": {"columns": []}}}'

[[Server]]
Pattern = "DELETE /api/2.1/unity-catalog/tables/{full_name}"
Response.Body = '{"status": "OK"}'

# Unmodeled routes → TESTSERVER_GAP. No HEAD: ServeMux maps HEAD to GET and would panic.
[[Server]]
Pattern = "GET /{path...}"
Response.StatusCode = 501
Response.Body = '{"message": "TESTSERVER_GAP"}'

[[Server]]
Pattern = "POST /{path...}"
Response.StatusCode = 501
Response.Body = '{"message": "TESTSERVER_GAP"}'

[[Server]]
Pattern = "PUT /{path...}"
Response.StatusCode = 501
Response.Body = '{"message": "TESTSERVER_GAP"}'

[[Server]]
Pattern = "PATCH /{path...}"
Response.StatusCode = 501
Response.Body = '{"message": "TESTSERVER_GAP"}'

[[Server]]
Pattern = "DELETE /{path...}"
Response.StatusCode = 501
Response.Body = '{"message": "TESTSERVER_GAP"}'
