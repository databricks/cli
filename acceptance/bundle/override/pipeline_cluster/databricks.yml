bundle:
  name: test-bundle

resources:
  pipelines:
    foo:
      configuration:
        spark.sql.ansi.enabled: "true"
      name: job
      clusters:
        - label: default
          spark_conf:
            foo: bar

targets:
  development:
    resources:
      pipelines:
        foo:
          configuration:
            spark.sql.ansi.enabled: "true"
          clusters:
            - label: default
              node_type_id: i3.xlarge
              num_workers: 1

  staging:
    resources:
      pipelines:
        foo:
          configuration:
            spark.sql.ansi.enabled: "true"
          clusters:
            - label: default
              node_type_id: i3.2xlarge
              num_workers: 4
