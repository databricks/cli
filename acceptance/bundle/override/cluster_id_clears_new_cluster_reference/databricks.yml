bundle:
  name: test-bundle
  cluster_id: existing-cluster

variables:
  cluster:
    type: complex
    default:
      spark_version: 15.4.x-scala2.12
      node_type_id: i3.xlarge
      num_workers: 1

resources:
  clusters:
    source:
      cluster_name: source
      spark_version: 15.4.x-scala2.12
      node_type_id: i3.xlarge
      num_workers: 2
  jobs:
    job:
      name: job
      tasks:
        - task_key: task
          notebook_task:
            notebook_path: /Workspace/notebook
          # Replaced by bundle.cluster_id: the reference below new_cluster must go too.
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: ${resources.clusters.source.num_workers}
        - task_key: task_var
          notebook_task:
            notebook_path: /Workspace/notebook
          # A reference at new_cluster must not bring it back either.
          new_cluster: ${var.cluster}
        - task_key: task_resource_ref
          notebook_task:
            notebook_path: /Workspace/notebook
          # A reference to the new_cluster of another job is resolved after the override.
          new_cluster: ${resources.jobs.other.job_clusters[0].new_cluster}
    other:
      name: other
      job_clusters:
        - job_cluster_key: shared
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 3
