# A 1000-task job serializes to ~110 KB, over the 64 KB per-operation state limit the
# deployment metadata service accepts, so recording it fails the deploy (same as no_drift).
EnvMatrixExclude.dms_state_too_large = ["DMS=true", "INPUT_CONFIG=job_pydabs_1000_tasks.yml.tmpl"]

# Emptying a grants node records a delete with no state, which the deployment metadata service
# rejects on a succeeded UPDATE action (known bug bundle/dms/empty-grants); skip under recording.
EnvMatrixExclude.dms_empty_grants_bug = ["DMS=true", "INPUT_CONFIG=schema_empty_grants.yml.tmpl"]
