# The fuzzer generates its own configs, so drop the inherited INPUT_CONFIG matrix.
EnvMatrix.INPUT_CONFIG = []

# Local only, unlike the rest of the invariant suite. Against a real workspace each seed's
# deploy/migrate/plan/destroy round trip takes minutes, so it trips the script's per-seed
# SEED_TIMEOUT and is reported as a hang. It would also add no signal: drift checking is off
# unless FUZZ_CHECK_DRIFT is set, which the cloud run does not set, leaving it to re-assert
# the same no-panic property over the same seeds that the local run already covers.
Cloud = false

# Raise the inherited 10m cap so the nightly FUZZ_TIME_BUDGET (script) has room plus the
# final seed's tail. The committed run (5 seeds, no drift) finishes in seconds regardless.
Timeout = '20m'

# The fuzzer can emit resource types the testserver doesn't model; a missing handler is a
# coverage gap, so return 501 (config rejected) instead of failing the whole run.
IgnoreUnhandledRequests = true

# Run each target's real invariant script. No redeploy target: no_drift's post-deploy plan
# already dry-runs a redeploy, and the only surface a real redeploy adds (plan/apply
# divergence) never surfaced a bug in nightly runs.
EnvMatrix.FUZZ_TARGET = ["no_drift", "migrate"]

# generate = build from the schema; mutate = perturb a curated config. See emit_fuzz_config.py.
EnvMatrix.FUZZ_MODE = ["generate", "mutate"]
