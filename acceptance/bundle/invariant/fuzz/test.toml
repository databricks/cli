# Schema fuzzing (see script). Unlike the curated invariant tests, the fuzzer
# generates its own configs, so drop the inherited INPUT_CONFIG matrix.
EnvMatrix.INPUT_CONFIG = []

# Raise the inherited 10m cap so the nightly FUZZ_TIME_BUDGET (script) has room, plus the
# final seed's tail. The committed run (5 seeds, no drift) finishes in seconds regardless.
Timeout = '20m'

# The fuzzer can emit resource types the testserver doesn't model; a missing handler is a
# coverage gap, so return 501 (config rejected) instead of failing the whole run.
IgnoreUnhandledRequests = true

# Run the real invariant test script for each target. migrate ignores
# DATABRICKS_BUNDLE_ENGINE and starts from a Terraform deployment.
#
# There is no redeploy target: no_drift's post-deploy plan already dry-runs what a redeploy
# would apply, so it catches the same field-level non-idempotency without the cost of a
# second deploy; the only surface redeploy adds (plan/apply divergence) never surfaced a bug
# across the nightly runs.
EnvMatrix.FUZZ_TARGET = ["no_drift", "migrate"]

# generate = build a config from the schema (gen_fuzz_config.py); mutate = perturb a
# curated invariant config (mutate_fuzz_config.py). Dispatched by fuzz_gen_config.py.
EnvMatrix.FUZZ_MODE = ["generate", "mutate"]
