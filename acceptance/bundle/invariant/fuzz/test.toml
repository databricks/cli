# The fuzzer generates its own configs, so drop the inherited INPUT_CONFIG matrix.
EnvMatrix.INPUT_CONFIG = []

# Local only: against a real workspace each seed's deploy/migrate/plan/destroy round trip
# takes minutes and trips SEED_TIMEOUT, and the cloud run leaves FUZZ_CHECK_DRIFT unset, so it
# would only re-assert the no-panic property the local run already covers.
Cloud = false

# Room for the nightly FUZZ_TIME_BUDGET (script) plus the last seed's tail.
Timeout = '20m'

# A resource type the testserver doesn't model is a coverage gap, not a failure: 501 lets the
# script record the seed as a gap instead of failing the whole run.
IgnoreUnhandledRequests = true

# The idempotency targets assert a delete or destroy re-run succeeds, which holds regardless of
# how faithfully the fake server round-trips fields. No redeploy target: no_drift's post-deploy
# plan already dry-runs one.
#
# ../continue_293 is deliberately left out: it deploys with the pinned v0.293.0 binary first, and
# that version does not know many current fields and resource types (see its test.toml, which
# excludes a third of the curated configs for that reason). The old CLI would reject most seeds
# before the current one ever ran, so the window would measure v0.293.0's schema, not this CLI.
EnvMatrix.FUZZ_TARGET = ["no_drift", "migrate", "delete_idempotent", "destroy_idempotent"]

# Snapshot of pre-delete state the idempotency targets keep; may linger if a seed fails.
Ignore = [".databricks.backup"]

# generate = build from the schema; mutate = perturb a curated config. See emit_fuzz_config.py.
EnvMatrix.FUZZ_MODE = ["generate", "mutate"]

# Generate mode pins name/display_name, so it cannot vary the identifier the delete path reads,
# and ../delete_idempotent already covers every resource type. Mutate can hit the identifier and
# reshape grants/permissions, so it is the mode worth running here.
EnvMatrixExclude.no_generate_on_delete_idempotent = ["FUZZ_MODE=generate", "FUZZ_TARGET=delete_idempotent"]
EnvMatrixExclude.no_generate_on_destroy_idempotent = ["FUZZ_MODE=generate", "FUZZ_TARGET=destroy_idempotent"]
