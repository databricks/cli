# Local only: cloud round-trips are minutes per seed and trip SEED_TIMEOUT.
Cloud = false

# Nightly FUZZ_TIME_BUDGET plus the last seed's tail.
Timeout = '20m'

# Curated INPUT_CONFIG matrix is for the sibling targets, not this driver.
EnvMatrix.INPUT_CONFIG = []
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

Ignore = [
    # Idempotency targets' pre-delete snapshot; may linger if a seed fails.
    ".databricks.backup",
]

# continue_293 omitted: pinned v0.293.0 rejects most current fields/types first.
EnvMatrix.FUZZ_TARGET = ["no_drift", "migrate", "delete_idempotent", "destroy_idempotent"]

# Unmodeled routes → TESTSERVER_GAP. Parent stubs (SQL, UC table delete) are inherited.
# HEAD shares the GET catch-all (ServeMux maps HEAD to GET).
[[Server]]
Pattern = "GET /{path...}"
Response.StatusCode = 501
Response.Body = '{"message": "TESTSERVER_GAP"}'

[[Server]]
Pattern = "POST /{path...}"
Response.StatusCode = 501
Response.Body = '{"message": "TESTSERVER_GAP"}'

[[Server]]
Pattern = "PUT /{path...}"
Response.StatusCode = 501
Response.Body = '{"message": "TESTSERVER_GAP"}'

[[Server]]
Pattern = "PATCH /{path...}"
Response.StatusCode = 501
Response.Body = '{"message": "TESTSERVER_GAP"}'

[[Server]]
Pattern = "DELETE /{path...}"
Response.StatusCode = 501
Response.Body = '{"message": "TESTSERVER_GAP"}'
