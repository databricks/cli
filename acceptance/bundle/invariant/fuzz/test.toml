# Schema fuzzing (see script). Unlike the curated invariant tests, the fuzzer
# generates its own configs, so drop the inherited INPUT_CONFIG matrix.
EnvMatrix.INPUT_CONFIG = []

# The fuzzer can emit resource types the testserver does not model. A missing
# handler is a coverage gap, not a CLI bug, so return 501 (the config is then
# rejected) instead of failing the whole run.
IgnoreUnhandledRequests = true

# Run the real invariant test script for each target. migrate ignores
# DATABRICKS_BUNDLE_ENGINE and starts from a Terraform deployment.
EnvMatrix.FUZZ_TARGET = ["no_drift", "migrate", "redeploy", "canonical", "update", "destroy_recreate"]
EnvMatrix.FUZZ_RESOURCE_COUNT = ["1", "2", "3"]

# generate = build a config from the schema (gen_fuzz_config.py); mutate = perturb a
# curated invariant config (mutate_fuzz_config.py). Dispatched by fuzz_gen_config.py.
EnvMatrix.FUZZ_MODE = ["generate", "mutate"]

# mutate starts from a single-resource base and ignores FUZZ_RESOURCE_COUNT, so only run
# it once rather than duplicating the same output across the count matrix.
EnvMatrixExclude.mutate_count2 = ["FUZZ_MODE=mutate", "FUZZ_RESOURCE_COUNT=2"]
EnvMatrixExclude.mutate_count3 = ["FUZZ_MODE=mutate", "FUZZ_RESOURCE_COUNT=3"]
