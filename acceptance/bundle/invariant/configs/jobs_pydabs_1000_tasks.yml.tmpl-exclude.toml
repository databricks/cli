[[Exclude]]
Tests = ["migrate", "auto-migrate"]
Reason = '''
The 1000-task scale case is covered by no_drift. Running it here adds ~1.5 min
per variant (deploy + migrate + plan at 1000 tasks) without incremental coverage.'''

[[Exclude]]
Tests = ["continue_293"]
Reason = '''
The 1000-task scale case is covered by no_drift. Running it here adds ~1.5 min
per variant (two full deploys at 1000 tasks) without incremental coverage.'''

[[Exclude]]
Tests = ["no_drift"]
When = ["DMS=true"]
Reason = '''
A 1000-task job serializes to ~110 KB, over the 64 KB per-operation state limit the
deployment metadata service accepts, so recording it fails the deploy. Raising the limit
or splitting the state is a service-side decision.'''
