[[Exclude]]
Tests = ["migrate", "auto-migrate"]
Reason = '''
UC secrets are direct-only (no terraform converter), so the terraform deploy that seeds
the migration fails for them.'''

[[Exclude]]
Tests = ["continue_293"]
Reason = "secret resource is not supported on v0.293.0"

[[Exclude]]
Tests = ["no_drift", "destroy_idempotent"]
When = ["READPLAN=1"]
Reason = '''
Secrets have sensitive fields (json:"-") that are stripped when a plan is serialized to JSON,
so deploying from a pre-computed plan file creates the secret with an empty value.'''
