Cloud = true
Timeout = '10m'

Ignore = [
    ".databricks",
    ".venv",
    "databricks.yml",
    "plan.json",
    "*.py",
    "*.json",
    "app",
]

Env.DATABRICKS_BUNDLE_ENGINE = "direct"

# Every config runs in every invariant test; configs/<config>-exclude.toml lists the tests that
# skip a config, and why.
EnvMatrixFiles.INPUT_CONFIG = "configs/*.yml.tmpl"

[[Server]]
Pattern = "DELETE /api/2.1/unity-catalog/tables/{full_name}"
Response.Body = '{"status": "OK"}'
