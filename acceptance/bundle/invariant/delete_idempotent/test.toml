EnvMatrix.READPLAN = ["", "1"]

# A 1000-task job serializes to ~110 KB, over the 64 KB per-operation state limit the
# deployment metadata service accepts, so recording it fails the deploy. Raising the limit
# or splitting the state is a service-side decision.
EnvMatrixExclude.dms_state_too_large = ["DMS=true", "INPUT_CONFIG=job_pydabs_1000_tasks.yml.tmpl"]

# Snapshot of pre-delete state used to re-run the delete on state that still
# references the (now-gone) resources; may linger if the test fails mid-run.
Ignore = [".databricks.backup"]
