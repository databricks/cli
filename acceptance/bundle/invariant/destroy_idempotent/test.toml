# Recording needs a bundle it has seen from the start. This test rewinds state and
# wipes the remote path the deployment record lives under, so recording refuses it.
# TODO(DMS): drop this once existing state can be handed over to the service (see
# the TODO in dstate.Open).
EnvMatrix.DATABRICKS_BUNDLE_DMS = [""]

EnvMatrix.READPLAN = ["", "1"]

# Snapshot of pre-destroy state used to re-run destroy on state that still
# references the (now-gone) resources; may linger if the test fails mid-run.
Ignore = [".databricks.backup"]
