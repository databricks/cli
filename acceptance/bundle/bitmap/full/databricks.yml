bundle:
  name: test-bundle

variables:
  catalog:
    default: main

resources:
  jobs:
    my_job:
      name: My Job
      tags:
        team: data
      tasks:
        - task_key: main
          notebook_task:
            notebook_path: ./notebook.py
  pipelines:
    my_pipeline:
      name: My Pipeline
      catalog: ${var.catalog}
  schemas:
    my_schema:
      catalog_name: ${var.catalog}
      name: my_schema

targets:
  dev:
    default: true
    mode: development
