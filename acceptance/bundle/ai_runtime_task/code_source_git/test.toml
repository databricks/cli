RecordRequests = true

Ignore = [
    '.databricks',
    'databricks.yml',
]

# The git-archive tarball is content-addressed: <dir>_<sha256[:16]>.tar.gz. git's gzip
# output is not byte-identical across git versions, so collapse the hash to a token
# rather than pin a specific digest.
[[Repls]]
Old = 'src_[0-9a-f]{16}\.tar\.gz'
New = 'src_[SNAPSHOT].tar.gz'
