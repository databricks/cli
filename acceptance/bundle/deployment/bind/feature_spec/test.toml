# Keep history warnings in separate outputs.
EnvMatrix.OUTPUT_MODE = ["plain", "recorded"]
EnvMatrixExclude.plain_history = ["DMS=true", "OUTPUT_MODE=plain"]
EnvMatrixExclude.recorded_without_history = ["DMS=", "OUTPUT_MODE=recorded"]
EnvVaryOutput = "OUTPUT_MODE"

Ignore = [
    ".databricks",
]

# Azure and GCP hosts carry the workspace ID, so their summary URLs have no ?w=<id>.
[[Repls]]
Old = '\?[ow]=\[WORKSPACE_ID\]'
New = ''
Order = 1000
