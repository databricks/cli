# DMS does not support the immutable snapshot resource yet (see bundle/deploy/immutable/test.toml).
EnvMatrix.DMS = [""]

Ignore = [
    "databricks.yml",
    ".databricks",
]

[[Repls]]
# Snapshot paths embed two sha256 digests that change on every run: the bundle ID hashes
# workspace.state_path and the content hash covers the rendered databricks.yml, and both
# contain $UNIQUE_NAME.
Old = "[0-9a-f]{64}"
New = "[SNAPSHOT_HASH]"
