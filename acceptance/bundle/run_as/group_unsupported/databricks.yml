bundle:
  name: run_as_group_unsupported

run_as:
  group_name: ${workspace.current_user.userName}

targets:
  pipeline:
    resources:
      pipelines:
        pipeline:
          name: Pipeline
        second:
          name: Second pipeline
  alert:
    resources:
      alerts:
        alert:
          display_name: Alert
        second:
          display_name: Second alert
  model_serving:
    resources:
      model_serving_endpoints:
        endpoint:
          name: Endpoint
  quality_monitor:
    resources:
      quality_monitors:
        monitor:
          table_name: main.schema.table
          output_schema_name: main.schema
  app:
    resources:
      apps:
        app:
          name: app
  embedded_dashboard:
    resources:
      dashboards:
        dashboard:
          display_name: Dashboard
          embed_credentials: true
          warehouse_id: "1234567890"
  dashboard:
    resources:
      dashboards:
        dashboard:
          display_name: Dashboard
          embed_credentials: false
          warehouse_id: "1234567890"
