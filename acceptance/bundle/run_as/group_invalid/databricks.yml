bundle:
  name: run_as_group_invalid

run_as:
  group_name: ""

experimental:
  use_legacy_run_as: false

resources:
  jobs:
    job:
      name: Job

targets:
  empty:
    run_as:
      group_name: ""
  user_group:
    run_as:
      user_name: user
      group_name: group
  sp_group:
    run_as:
      service_principal_name: sp
      group_name: group
  all:
    run_as:
      user_name: user
      service_principal_name: sp
      group_name: group
  legacy:
    run_as:
      group_name: group
    resources:
      pipelines:
        pipeline:
          name: Pipeline
  legacy_empty:
    run_as:
      group_name: ""
  legacy_conflict:
    run_as:
      user_name: user
      group_name: group
