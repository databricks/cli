bundle:
  name: dms-metadata-before

experimental:
  record_deployment_history: true

workspace:
  # Pinned, so renaming the bundle below keeps the same deployment: the deployment is the
  # workspace node under state_path, and a different path would be a different deployment.
  state_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/dms-metadata-pinned/state

resources:
  schemas:
    foo:
      name: dms_metadata_schema
      catalog_name: main
