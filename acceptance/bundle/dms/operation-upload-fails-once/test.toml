# Local only: this case needs an injected failure - DMS itself must reject the operation upload, once - and fault.py registers
# its rule on the fake, which a cloud run does not have.
Cloud = false

# Coalescing can make either the pending or final state the first rejected update.
[[Repls]]
Old = '\?update_mask=\S+'
New = '?update_mask=[UPDATE_MASK]'
