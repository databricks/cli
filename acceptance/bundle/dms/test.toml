Cloud = true

# Deployment Metadata Service (DMS) recording is only supported by the direct
# engine; it is a no-op on terraform.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]


RecordRequests = true

Ignore = [
    '.databricks',
    'databricks.yml',
]

# experimental.record_deployment_history is normally rejected; these tests force-allow it
# to exercise the feature. bundle/dms/not-supported covers the rejection path.
Env.DATABRICKS_BUNDLE_FORCE_ALLOW_RECORD_DEPLOYMENT_HISTORY = "1"
