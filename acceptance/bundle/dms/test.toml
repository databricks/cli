Local = true
Cloud = false

# Deployment Metadata Service (DMS) recording is only meaningful in the direct
# engine, where the deployment ID is stored in and read from the direct-engine
# state.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

RecordRequests = true

Ignore = [
    '.databricks',
]

# experimental.record_deployment_history is rejected until the direct engine has a
# state upgrade path (see validate.ValidateRecordDeploymentHistory). These tests
# exercise the feature itself, so they opt in through the same escape hatch DMS
# development uses. bundle/dms/not-supported covers the rejection.
Env.DATABRICKS_BUNDLE_ENABLE_RECORD_DEPLOYMENT_HISTORY = "1"
