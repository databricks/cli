Local = true
Cloud = false

# Deployment Metadata Service (DMS) recording is only supported by the direct
# engine; it is a no-op on terraform.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

# These tests enable recording through experimental.record_deployment_history, so the
# DATABRICKS_BUNDLE_DMS variant the rest of the suite adds would just duplicate them.
EnvMatrix.DATABRICKS_BUNDLE_DMS = [""]

RecordRequests = true

Ignore = [
    '.databricks',
]

# experimental.record_deployment_history is rejected outright (see
# validate.ValidateRecordDeploymentHistory). These tests exercise the feature itself,
# so they force allow it the same way DMS development does. bundle/dms/not-supported
# covers the rejection.
Env.DATABRICKS_BUNDLE_FORCE_ALLOW_RECORD_DEPLOYMENT_HISTORY = "1"
