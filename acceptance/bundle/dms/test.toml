Cloud = true

# Deployment Metadata Service (DMS) recording is only supported by the direct
# engine; it is a no-op on terraform.

RecordRequests = true

Ignore = [
    '.databricks',
    'databricks.yml',
]

# These tests set experimental.deployment_history in databricks.yml; the DMS env var
# both records and permits that otherwise-gated field. bundle/dms/not-supported covers the
# rejection path. Pinned to "true" (not the suite's ["", "true"]) since the field already
# records - the empty variant would just duplicate it.
EnvMatrix.DMS = ["true"]

# Preserve the version link around the parent rule that removes it.
[[Repls]]
Old = '(?m)^Current Deployment Version: '
New = '__CURRENT_DEPLOYMENT_VERSION__: '
Order = -1

[[Repls]]
Old = '(?m)^__CURRENT_DEPLOYMENT_VERSION__: '
New = 'Current Deployment Version: '
Order = 1
