# The [[Server]] stub below forces a failure the real service will not produce on
# demand, and the cloud harness ignores stubs, so this case only exists locally.
Cloud = false

# Which requests are made depends on how far apply got before a background upload
# failed, so recording them would make the output nondeterministic.
RecordRequests = false

# Completed versions make DMS the source of truth; unrecorded resources get recreated.
# Deploy must stop rather than continue creating.
[[Server]]
Pattern = "PATCH /api/2.0/bundle/deployments/{deployment_id}/versions/{version_id}/operations/{resource_key}"
Response.StatusCode = 500
Response.Body = '''{"error_code": "INTERNAL_ERROR", "message": "Internal error"}'''
