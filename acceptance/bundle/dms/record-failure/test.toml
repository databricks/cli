# The job's cluster names a node type that does not exist, so the create fails for real: on cloud
# the Jobs API rejects it. The local fake is lax and would accept it, so this one test stubs the
# create to return the same error - scoped here, not the shared fake, so no other test is affected.
Cloud = true

# The Jobs API error lists every supported node type, and the set grows over time; mask it.
[[Repls]]
Old = 'Supported node types: [^(\n]*[^ (\n]'
New = 'Supported node types: [NODE_TYPES]'

[[Server]]
Pattern = "POST /api/2.2/jobs/create"
Response.StatusCode = 400
Response.Body = '''{"error_code": "INVALID_PARAMETER_VALUE", "message": "Node type nonexistent-node-type is not supported. Supported node types: r3.xlarge, m5.large"}'''
