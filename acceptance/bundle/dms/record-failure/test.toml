# The [[Server]] stub below forces a failure the real service will not produce on
# demand, and the cloud harness ignores stubs, so this case only exists locally.
Cloud = false

# The job cannot be created, so applying it fails and the operation is recorded as
# failed rather than omitted.
[[Server]]
Pattern = "POST /api/2.2/jobs/create"
Response.StatusCode = 400
Response.Body = '''{"error_code": "INVALID_PARAMETER_VALUE", "message": "cluster spec is invalid"}'''
