Local = true
Cloud = false
RecordRequests = true

# This test drives both engines itself (one bundle per engine via a per-deploy
# DATABRICKS_BUNDLE_ENGINE), so pin the matrix to a single value to run once.
# The value only selects the CI runner; the script sets the engine explicitly.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

Ignore = [
    ".databricks",
]

# The script passes leading-"/" path filters to print_requests.py (e.g.
# ^/api/2.0/workspace). On Windows, Git Bash rewrites those into Windows paths
# ("^C:/Program Files/Git/api/2.0/workspace"), so print_requests.py rejects the
# filter. Disable the MSYS path conversion for this test.
[Env]
MSYS_NO_PATHCONV = "1"
