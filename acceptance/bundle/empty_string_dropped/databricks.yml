      # observed elsewhere, not here.
      cluster_name: ""
      spark_version: ""
      node_type_id: ""
      policy_id: ""
      single_user_name: ""
      data_security_mode: ""
      kind: ""
      # runtime_engine: ""          # terraform: hard enum error ("" not in [PHOTON STANDARD])
      # instance_pool_id: ""        # terraform: ConflictsWith node_type_id / driver_node_type_id
      # driver_instance_pool_id: "" # terraform: ConflictsWith driver_node_type_id
      # driver_node_type_id: ""     # terraform: ConflictsWith driver_instance_pool_id / instance_pool_id

  jobs:
    my_job:
      # Top-level optional string fields on JobSettings set to "".
      name: ""
      description: ""
      budget_policy_id: ""
      # edit_mode: ""          # terraform: enum error
      # format: ""             # terraform: enum error
      # performance_target: "" # terraform: enum error

targets:
