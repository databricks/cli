# job_runs is a direct-engine-only resource; the Terraform provider has no
# equivalent, so restrict the matrix to direct.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

# Local only: the lost response is staged by injecting a fault into the testserver.
RecordRequests = true

# The deploy leaves local deployment state behind.
Ignore = [".databricks"]

# Distinct numbers each distinct token, so the [0] both requests carry is what shows
# the resend reused the first one's token rather than minting another. Ordered ahead
# of the default UUID replacement, which would mask both as the same [UUID].
[[Repls]]
Old = '"idempotency_token": "[0-9a-f-]{36}'
New = '"idempotency_token": "[IDEMPOTENCY_TOKEN]'
Distinct = true
Order = -1
