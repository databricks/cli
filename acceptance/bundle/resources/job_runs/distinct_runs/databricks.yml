bundle:
  name: job-runs-distinct-runs

resources:
  jobs:
    my_job:
      name: my-job
      tasks:
        - task_key: main
          condition_task:
            op: EQUAL_TO
            left: "1"
            right: "1"

  # Two runs with byte-identical config. Each is a distinct resource, so each
  # must get its own run rather than deduping onto a shared idempotency token.
  job_runs:
    my_run_a:
      job_id: ${resources.jobs.my_job.id}
    my_run_b:
      job_id: ${resources.jobs.my_job.id}
