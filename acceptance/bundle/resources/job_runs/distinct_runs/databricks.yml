bundle:
  name: job-runs-distinct-runs

resources:
  jobs:
    my_job:
      name: my-job
      tasks:
        - task_key: main
          condition_task:
            op: EQUAL_TO
            left: "1"
            right: "1"

  # Two runs with byte-identical config. Their resource keys go into the
  # idempotency token, so each gets its own run.
  job_runs:
    my_run_a:
      job_id: ${resources.jobs.my_job.id}
    my_run_b:
      job_id: ${resources.jobs.my_job.id}
