# Deploy both by re-planning and from a plan saved on disk, so the hashes
# computed during planning survive plan serialization.
EnvMatrix.READPLAN = ["", "1"]

Ignore = ["tmp.plan.json", "tmp.002.txt", ".gitignore"]

# See on_file_change/test.toml: mask content hashes before the parent's
# `\d{8,}` rule can mangle them, keeping distinct hashes distinguishable.
[[Repls]]
Old = '[0-9a-f]{64}'
New = '[FILE_HASH]'
Order = 1
Distinct = true
