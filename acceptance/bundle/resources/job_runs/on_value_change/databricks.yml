bundle:
  name: job-runs-on-value-change

variables:
  stamp:
    default: v1
  other:
    default: a1
  number:
    default: 42
  long:
    default: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

resources:
  jobs:
    my_job:
      name: my-job
      tasks:
        - task_key: main
          notebook_task:
            notebook_path: /Workspace/test

  job_runs:
    my_run:
      job_id: ${resources.jobs.my_job.id}
      lifecycle:
        triggers:
          - on_file_change: watched.txt
          - on_value_change: "  ${var.stamp}  "
          - on_value_change: ${var.other}
          - on_value_change: ${var.number}
          - on_value_change: ${workspace.root_path}
          - on_value_change: ${var.long}
