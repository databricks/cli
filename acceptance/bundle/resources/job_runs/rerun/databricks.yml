bundle:
  name: job-runs-rerun

resources:
  jobs:
    my_job:
      name: my-job
      tasks:
        - task_key: main
          condition_task:
            op: EQUAL_TO
            left: "1"
            right: "1"

  job_runs:
    my_run:
      job_id: ${resources.jobs.my_job.id}
      # rerun_token is folded into the computed idempotency_token but never sent
      # to the API. Bumping its value is the supported way to force a fresh run
      # of an otherwise-unchanged config.
      rerun_token: v1
