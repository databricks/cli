bundle:
  name: job-runs-on-file-change-errors

sync:
  exclude:
    - mixed/excluded.txt
    # Literal path: the script rewrites the trigger by substring, and allexcluded/* would hit this line.
    - allexcluded/a.txt

resources:
  jobs:
    my_job:
      name: my-job
      tasks:
        - task_key: main
          notebook_task:
            notebook_path: /Workspace/test

  job_runs:
    my_run:
      job_id: ${resources.jobs.my_job.id}
      lifecycle:
        triggers:
          - on_file_change: ../shared/*.txt
