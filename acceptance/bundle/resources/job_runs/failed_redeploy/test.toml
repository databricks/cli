# job_runs is a direct-engine-only resource; the Terraform provider has no
# equivalent, so restrict the matrix to direct.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
RecordRequests = true

# Local only: resources/job_runs/failed_run covers the failing deploy against a
# real workspace, and a second run there costs another few minutes for a recreate
# the test server already proves.
Cloud = false

# The deploy fails mid-way, leaving local deployment state behind.
Ignore = [".databricks"]
