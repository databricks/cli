bundle:
  name: job-runs-failed-redeploy

resources:
  jobs:
    my_job:
      name: my-job
      tasks:
        # The test server runs this locally; the exception fails the run.
        - task_key: main
          spark_python_task:
            python_file: ./fail.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "2"

  job_runs:
    my_run:
      job_id: ${resources.jobs.my_job.id}
