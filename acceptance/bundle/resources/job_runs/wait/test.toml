# job_runs is a direct-engine-only resource; the Terraform provider has no
# equivalent, so restrict the matrix to direct.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

# Runs the job for real, which invariant/configs/job_run.yml.tmpl no longer does
# on cloud. Serverless needs Unity Catalog.
Cloud = true
RequiresUnityCatalog = true

# The wait polls GetRun until the run is terminal, so the recorded requests
# depend on how long the run takes.
RecordRequests = false

Ignore = [
    "databricks.yml",
    "databricks.yml.tmpl",
    "hello.py",
]

# The host and the workspace selector in the run URL differ per workspace, and the
# URL form itself is covered by libs/workspaceurls; assert only that it is reported.
[[Repls]]
Old = 'Run URL: .*'
New = 'Run URL: [RUN_URL]'
