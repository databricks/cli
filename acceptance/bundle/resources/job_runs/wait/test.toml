# job_runs is a direct-engine-only resource; the Terraform provider has no
# equivalent, so restrict the matrix to direct.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

# Runs the job for real on cloud. Serverless needs Unity Catalog.
Cloud = true
RequiresUnityCatalog = true

# The wait polls GetRun until the run is terminal, so the recorded requests
# depend on how long the run takes.
RecordRequests = false

# databricks.yml is rendered by the script.
Ignore = ["databricks.yml"]

# The host and the workspace selector in the run URL differ per workspace; the URL
# form itself is covered by libs/workspaceurls.
[[Repls]]
Old = 'Run URL: .*'
New = 'Run URL: [RUN_URL]'
