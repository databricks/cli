bundle:
  name: job-runs-deploy-options

resources:
  jobs:
    my_job:
      name: my-job
      tasks:
        - task_key: main
          condition_task:
            op: EQUAL_TO
            left: "1"
            right: "1"

  job_runs:
    my_run:
      job_id: ${resources.jobs.my_job.id}
      # Both knobs control the deploy, not the run: with wait_for_completion:
      # false the deploy returns as soon as the run is triggered.
      wait_for_completion: false
      timeout: 30m
