# job_runs is a direct-engine-only resource; the Terraform provider has no
# equivalent, so restrict the matrix to direct.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
RecordRequests = true

# The fake workspace runs notebook and python tasks for real and fails the run
# when the file is missing. Bundles here use condition_task, which it does not
# execute, so the run succeeds -- except in failed_run, where the failure is the
# point.

# idempotency_token is a SHA-256 that differs every run (job_id comes from a
# time-based counter). Mask just that field so run-now goldens stay stable.
[[Repls]]
Old = '"idempotency_token": "[0-9a-f]{64}"'
New = '"idempotency_token": "[IDEMPOTENCY_TOKEN]"'
