# job_runs is a direct-engine-only resource; the Terraform provider has no
# equivalent, so restrict the matrix to direct.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

# The cloud counterpart of wait_output: it runs the job for real, which is what
# invariant/configs/job_run.yml.tmpl no longer does on cloud. Serverless needs
# Unity Catalog.
Cloud = true
RequiresUnityCatalog = true

# A real workspace is not proxied, so there are no recorded requests to assert
# on; this test reads the deployed job back instead.
RecordRequests = false

Ignore = [
    "databricks.yml",
    "databricks.yml.tmpl",
    "hello.py",
]

# The host and the workspace selector in the run URL differ per workspace, and the
# URL form itself is covered by libs/workspaceurls; assert only that it is reported.
[[Repls]]
Old = 'Run URL: .*'
New = 'Run URL: [RUN_URL]'
