bundle:
  name: job-runs-validate

resources:
  jobs:
    my_job:
      name: my-job
      tasks:
        - task_key: main
          condition_task:
            op: EQUAL_TO
            left: "1"
            right: "1"

    downstream_job:
      name: downstream-job
      tags:
        # Rejected: my_run is not waited for, so its state is unknown here.
        run_result: ${resources.job_runs.my_run.state.result_state}
      tasks:
        - task_key: main
          condition_task:
            op: EQUAL_TO
            left: "1"
            right: "1"

  job_runs:
    my_run:
      job_id: ${resources.jobs.my_job.id}
      wait_for_completion: false

    bad_token:
      job_id: ${resources.jobs.my_job.id}
      # Rejected: the token is computed from the run's configuration.
      idempotency_token: mine

    bad_timeout:
      job_id: ${resources.jobs.my_job.id}
      # Rejected: not a duration.
      timeout: soon
