bundle:
  name: job-runs-validate

resources:
  jobs:
    my_job:
      name: my-job
      tasks:
        - task_key: main
          condition_task:
            op: EQUAL_TO
            left: "1"
            right: "1"

  job_runs:
    bad_token:
      job_id: ${resources.jobs.my_job.id}
      # Rejected: the token is computed from the run's configuration, and
      # rerun_token is the supported way to force a new run.
      idempotency_token: mine
