Cloud = true

# Lakebase v2 (postgres) is only available in AWS as of January 2026
CloudEnvs.gcp = false
CloudEnvs.azure = false

# The snapshot schedule was added to the Postgres API in databricks-sdk-go
# v0.177.0, which the pinned Terraform provider does not yet include, so there is
# no databricks_..._snapshot_schedule resource to deploy through. Run the direct
# engine only until the provider catches up.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

Ignore = [
    "databricks.yml",
    ".databricks",
]
