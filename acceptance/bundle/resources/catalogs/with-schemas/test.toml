Local = true
Cloud = true
RecordRequests = false
RequiresUnityCatalog = true

Ignore = [
    ".databricks",
    "databricks.yml",
]

# Also run with --plan-mode=local: plan/deploy issue the same requests with or without --plan-mode=local
# so the recorded output is identical across variants.
EnvRepl.PLANMODE = false

[EnvMatrix]
  DATABRICKS_BUNDLE_ENGINE = ["direct"]
  PLANMODE = ["", "--plan-mode=local"]

[[Repls]]
Old = " --plan-mode=local"
New = ""
