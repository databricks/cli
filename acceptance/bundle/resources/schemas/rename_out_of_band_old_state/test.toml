Cloud = true
EnvMatrix.READPLAN = ["", "1"]

# The test rewrites the deployment state by hand, which the recording service refuses because it
# no longer matches the deployment it has recorded, so run without deployment history.
EnvMatrix.DMS = [""]

Ignore = [
    ".databricks",
    ".gitignore",
    "databricks.yml",
]

# When READPLAN=1, "bundle deploy" is called as "bundle deploy --plan .databricks/plan.json".
# Normalize so both variants produce identical output.
[[Repls]]
Old = ' --plan .databricks/plan.json'
New = ''
