Badness = "After a create request fails with a 504, deploy looks the schema up by name and takes a schema that the deploying user created less than a minute before the request. That does not tell the bundle's own schema from one the same user created another way: another bundle or target, a script, or the same service principal in another CI job. Here the 504 was returned before the backend handled the request, so the bundle created nothing; without the 504 the same deploy fails with 'already exists'. Destroy then deletes the schema. Deploy should take a schema only when it can tell that its own request created it, and otherwise fail as it does without the 504."

# Faults are injected through the testserver.
Cloud = false
RecordRequests = true
EnvMatrix.READPLAN = []
Env.DATABRICKS_BUNDLE_ENGINE = "direct"
Env.DATABRICKS_BUNDLE_RETRY_INTERVAL_MS = "100"
SuppressLines.warn_retry = ""

Ignore = [
    ".databricks",
    ".gitignore",
    "databricks.yml",
]
