Badness = "When the schema is gone from its recorded name, the plan looks for it under the name in the config, and an error other than not-found there fails the plan. Before that lookup existed the plan created the schema."

# Local only: the 403 on the new name is injected.

Ignore = [
    ".databricks",
    ".gitignore",
]

[[Server]]
Pattern = "GET /api/2.1/unity-catalog/schemas/main.myschema2"
Response.StatusCode = 403
Response.Body = '{"error_code": "PERMISSION_DENIED", "message": "User does not have USE SCHEMA on Schema main.myschema2"}'
