# Local only: the 403 at the recorded name is injected, as for another user's schema the
# deployer cannot read.

Ignore = [
    ".databricks",
    ".gitignore",
    "databricks.yml",
]

[[Server]]
Pattern = "GET /api/2.1/unity-catalog/schemas/main.myschema"
Response.StatusCode = 403
Response.Body = '{"error_code": "PERMISSION_DENIED", "message": "User does not have USE SCHEMA on the schema"}'
