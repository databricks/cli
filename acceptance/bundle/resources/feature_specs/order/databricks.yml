bundle:
  name: test-bundle

resources:
  feature_specs:
    spec1:
      name: main.myschema.myspec
      features:
        - feature_lookup:
            table: main.myschema.user_features
            lookup_keys: [tenant_id, user_id]
            feature_names: [age, country]
            rename_outputs:
              - {feature: age, output: user_age}
              - {feature: country, output: user_country}
            default_values:
              - {feature: user_age, default_value: "0"}
              - {feature: user_country, default_value: US}
        - feature_function:
            udf: main.myschema.score
            input_bindings:
              - {parameter: x, bound_feature: user_age}
              - {parameter: y, bound_feature: user_country}
            output: score
      exclude_columns: [user_age, user_country]
      extra_pip_requirements:
        requirements: [numpy, scipy]
