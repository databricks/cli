Cloud = true

# Deployment history has no "feature_specs." resource-key prefix, so the deploy fails before the
# feature spec is created. See dmsResourceTypes in libs/testserver/bundledeployments.go, which
# mirrors Universe.
EnvMatrixExclude.no_feature_spec_dms = ["DMS=true"]

# Fake SQL endpoint so create_feature_spec_fixtures.py works against the local test server too.
[[Server]]
Pattern = "POST /api/2.0/sql/statements/"
Response.Body = '{"status": {"state": "SUCCEEDED"}, "manifest": {"schema": {"columns": []}}}'
