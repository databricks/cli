# Without a libraries section the cluster's libraries are unmanaged (skipped with reason `unmanaged`), so an out-of-band library (job task lib or API install) is not drift. With a section, every library on the cluster is managed: out-of-band ones are uninstalled, declared ones installed, and drift is corrected. No change restarts the cluster.
# Local only: the out-of-band library is injected via the Libraries API, deterministic locally but racy on cloud (the job-installed variant runs on cloud in interactive_cluster_declared_libs).
RecordRequests = true

EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
# READPLAN=1 feeds the serialized plan to `bundle deploy --plan`.
EnvMatrix.READPLAN = ["", "1"]

Ignore = [".databricks", "databricks.yml", "tmp.plan.json"]
