# The cluster manages only its declared libraries: an out-of-band library (job task lib or UI install) is skipped and never uninstalled, while declared libs still install/uninstall and drift is corrected. See removedLibraries and the libraries backend_defaults entry in configs/clusters.yml.
# Local only: the out-of-band library is injected via the Libraries API, deterministic locally but racy on cloud (the job-installed variant runs on cloud in interactive_cluster_declared_libs).
RecordRequests = true

EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
# READPLAN=1 feeds the serialized plan to `bundle deploy --plan`, where a change's Old value is generic JSON not a typed compute.Library (see decodeLibraries).
EnvMatrix.READPLAN = ["", "1"]

Ignore = [".databricks", "databricks.yml", "tmp.plan.json"]
