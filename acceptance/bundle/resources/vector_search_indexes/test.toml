Cloud = true

# Vector Search indexes are slow to create, so only run them in the nightly (non-short) cloud job.
CloudSlow = true

# Vector Search indexes are only available in direct mode (no Terraform provider)

Ignore = [
    "databricks.yml",
    ".databricks",
]

# Endpoint and index provisioning takes ~20 min on cloud and DMS does not change how these
# resources are deployed, so a DMS=true variant would double the cost without adding coverage.
EnvMatrix.DMS = [""]
