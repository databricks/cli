bundle:
  name: test-bundle

sync:
  paths: []

resources:
  postgres_projects:
    my_project:
      project_id: test-pg-proj
      display_name: "Test Postgres Project"
      pg_version: 16

  postgres_branches:
    main:
      parent: ${resources.postgres_projects.my_project.id}
      branch_id: main
      no_expiry: true

  postgres_roles:
    owner:
      parent: ${resources.postgres_branches.main.id}
      role_id: app-owner
      postgres_role: app_owner
