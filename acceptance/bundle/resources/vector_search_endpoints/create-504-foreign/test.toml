Badness = "After a create request fails with a 504, deploy looks the endpoint up by name and takes an endpoint that the deploying user created within a few seconds before the request, or after it. That does not tell the bundle's own endpoint from one the same user created another way: another bundle or target, a script, or the same service principal in another CI job. Here the 504 was returned before the backend handled the request, so the bundle created nothing; without the 504 the same deploy fails with 'already exists'. Destroy then deletes the endpoint. Deploy should take an endpoint only when it can tell that its own request created it, and otherwise fail as it does without the 504."

# Faults are injected through the testserver.
Cloud = false

Env.DATABRICKS_BUNDLE_RETRY_INTERVAL_MS = "100"
SuppressLines.warn_retry = ""
