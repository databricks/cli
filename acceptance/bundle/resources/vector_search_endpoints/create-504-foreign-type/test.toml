Badness = "After a create request fails with a 504, deploy looks the endpoint up by name and takes one created within a few seconds before the request, or after it without comparing it with the request. Here the endpoint was created outside the bundle with another endpoint_type. An endpoint the bundle's request created has the requested type, so this one cannot be the bundle's. The next plan is a recreate, so the next deploy deletes it. Deploy should fail as it does without the 504."

# Faults are injected through the testserver.
Cloud = false

Env.DATABRICKS_BUNDLE_RETRY_INTERVAL_MS = "100"
SuppressLines.warn_retry = ""
