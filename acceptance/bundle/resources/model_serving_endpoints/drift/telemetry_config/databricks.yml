bundle:
  name: test-bundle

resources:
  model_serving_endpoints:
    endpoint1:
      name: test-endpoint
      config:
        served_entities:
          - name: prod
            entity_name: main.default.test_model
            entity_version: "1"
            workload_size: Small
            scale_to_zero_enabled: true
      telemetry_config: # TO_REMOVE
        table_names: # TO_REMOVE
          logs_table: main.default.test_logs # TO_REMOVE
          traces_table: main.default.test_traces # TO_REMOVE
        inference_table_config: # TO_REMOVE
          sampling_fraction: 0.5 # TO_REMOVE
