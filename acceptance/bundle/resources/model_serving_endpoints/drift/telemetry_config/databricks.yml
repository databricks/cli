bundle:
  name: test-bundle

resources:
  model_serving_endpoints:
    endpoint1:
      name: test-endpoint
      config:
        served_entities:
          - name: prod
            entity_name: main.default.test_model
            entity_version: "1"
            workload_size: Small
            scale_to_zero_enabled: true
      telemetry_config:
        table_names:
          logs_table: main.default.test_logs
          traces_table: main.default.test_traces
          metrics_table: main.default.test_metrics
          annotations_table: main.default.test_annotations
        inference_table_config:
          sampling_fraction: 0.5
