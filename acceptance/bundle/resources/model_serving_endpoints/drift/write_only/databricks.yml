bundle:
  name: test-bundle

resources:
  model_serving_endpoints:
    endpoint1:
      name: test-endpoint
      config:
        served_entities:
          - name: prod
            # burst_scaling_enabled is accepted on write but never returned on GET.
            burst_scaling_enabled: true
            external_model:
              name: gpt-4o-mini
              provider: openai
              task: llm/v1/chat
              openai_config:
                # Write-only secret: the backend stores it and never echoes it back.
                openai_api_key_plaintext: sk-test-plaintext-key
        traffic_config:
          routes:
            - served_model_name: prod
              traffic_percentage: 100
