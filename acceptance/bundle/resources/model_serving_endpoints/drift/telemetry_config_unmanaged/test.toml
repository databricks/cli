RecordRequests = true

# Guards the backend_defaults rule at the telemetry_config parent path. Without it the
# remote-only config is planned as an update and DoUpdate sends a PATCH with no
# telemetry_config, deleting a configuration the bundle never managed. The classification
# under test belongs to the direct engine, so terraform is excluded.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
