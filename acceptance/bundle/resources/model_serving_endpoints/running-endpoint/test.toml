Timeout = '30m'
Cloud = true
CloudSlow = false # TEMP: run under -short in PR CI

# GCP test envs lack serving capacity for this endpoint:
#   Error: cannot create resources.model_serving_endpoints.my_endpoint: waiting after creating id=test-endpoint-[UNIQUE_NAME]: failed to reach NOT_UPDATING, got UPDATE_FAILED: current status: UPDATE_FAILED
CloudEnvs.gcp = false

[[Server]]
Pattern = "GET /api/2.1/unity-catalog/models/system.ai.llama_v3_2_1b_instruct/versions"
Response.Body = '''
{
  "model_versions": [
    {
      "version": 1
    }
  ]
}
'''

[[Repls]]
Old = '"entity_version": "\d+",'
New = '"entity_version": "[VERSION]",'
