Badness = "Cannot read dashboard, expecting deployment to succeed"
Cloud = true
RecordRequests = false
RunsOnDbr = true

Ignore = [
    "databricks.yml",
    "resources/dashboards.yml",
    "tmp.plan.json",
]

# Deploying a saved plan must send the same full serialized_dashboard, which the
# lakeview get in the script reads back.
EnvMatrix.READPLAN = ["", "1"]

# Deploying from a pre-computed plan when the target has DMS deployment history
# is not supported; this variant is skipped.
EnvMatrixExclude.dms_readplan_mismatch = ["READPLAN=1", "DMS=true"]

[[Repls]]
# Windows:
Old = 'The system cannot find the file specified.'
New = 'no such file or directory'
