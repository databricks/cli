# the real API returns a pretty printed JSON output which causes
# the test to fail, since we are testing CLI only feature, we can set to
# Cloud = true
Cloud = false

Ignore = [
    "databricks.yml",
]

EnvMatrix.READPLAN = ["", "1"]

# This test dumps a plan and replays it via deploy --plan/readplanarg; a nostamp.py'd dump can't
# carry the DMS fields the replay needs, so opt out of recording (covered by bundle/dms).
EnvMatrix.DMS = [""]
