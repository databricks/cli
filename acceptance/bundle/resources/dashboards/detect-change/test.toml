Local = true
Cloud = true

# The plan's remote view (remote_state + each change's `remote` value) mirrors the
# dashboards API response. Its output-only fields (create_time, update_time, etag,
# lifecycle_state, path, ...) are populated by the backend and grow/change out of our
# control on cloud, so the remote-only file is soft-failed. The planning decisions in
# out.plan.$engine.json stay strict. Only the direct engine exposes a remote view; the
# terraform remote file is structurally empty and stays strict (a regression that
# suddenly populated it should turn the test red).
SoftFailFiles = [
    "out.plan.remote.direct.json",
]

Ignore = [
    "databricks.yml",
]

[Env]
# MSYS2 automatically converts absolute paths like /Users/$username/$UNIQUE_NAME to
# C:/Program Files/Git/Users/$username/UNIQUE_NAME before passing it to the CLI
# Setting this environment variable prevents that conversion on windows.
MSYS_NO_PATHCONV = "1"

# This test makes an out-of-band update and then expects `bundle plan` to detect it.
# Under eventual consistency the plan's own read (CheckDashboardsModifiedRemotely)
# would observe the stale pre-update value and miss the change -- an engine-level read
# that no test-level retry can fix -- so opt out of the simulation here.
INJECT_STALE_ON_DIRECT = "0"

[[Repls]]
Old = "[0-9a-z]{16,}"
New = "[ALPHANUMID]"

[[Repls]]
# clean up ?[ow]=<num> suffix after URL since not all workspaces have that
Old = '\?[ow]=\[(NUMID|ALPHANUMID)\]'
New = ''
Order = 1000

[[Repls]]
Old = '2\d\d\d-\d\d-\d\d(T| )\d\d:\d\d:\d\d(\.\d+(Z|\+\d\d:\d\d)?)?Z'
New = "[TIMESTAMP]"
Order = 9
