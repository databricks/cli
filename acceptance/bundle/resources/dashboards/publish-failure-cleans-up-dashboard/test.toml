Cloud = false
RecordRequests = true

Ignore = ["tmp.plan.json"]

# Applying a saved plan must reach the same publish failure and the same cleanup
# DELETE as an in-memory plan; both variants share out.dashboardrequests.txt.
EnvMatrix.READPLAN = ["", "1"]

# Deploying from a pre-computed plan when the target has DMS deployment history
# is not supported; this variant is skipped.
EnvMatrixExclude.dms_readplan_mismatch = ["READPLAN=1", "DMS=true"]

[[Server]]
Pattern = "POST /api/2.0/lakeview/dashboards/{dashboard_id}/published"
Response.StatusCode = 400
Response.Body = '{"error_code": "RESOURCE_DOES_NOT_EXIST", "message": "Warehouse doesnotexist does not exist"}'

[[Repls]]
Old = "[0-9a-f]{32}"
New = "[DASHBOARD_ID]"
