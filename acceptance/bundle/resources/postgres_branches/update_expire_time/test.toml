# expire_time, ttl and no_expiry are three sides of one oneof. The API masks them
# together under spec.expiration and rejects each field name on its own, so the
# direct engine's update_mask=spec.expire_time is answered with
# 400 INVALID_PARAMETER_VALUE. Same bug as postgres_endpoints/update_suspend_timeout,
# and a separate fix from the diffing this test covers.
Badness = "Direct engine cannot apply an expire_time change: it masks the field under its own name, but the API only accepts the oneof group name spec.expiration"

# Local only: a real workspace caps how far ahead a branch may expire and answers
# these literal timestamps with 400 "expiration time exceeds the maximum
# expiration time", so the branch is never created. A timestamp near enough to now
# to be accepted would have to be computed per run, and the API normalizes what it
# echoes back, so the golden could not assert the value. update_ttl covers the same
# expiration oneof on cloud without that constraint.
Cloud = false

# The root test.toml collapses every timestamp to [TIMESTAMP], which would hide
# the change under test.
[[Repls]]
Old = '2030-01-01T00:00:00Z'
New = '[EXPIRE_TIME_BEFORE]'
Order = 1

[[Repls]]
Old = '2031-06-15T12:00:00Z'
New = '[EXPIRE_TIME_AFTER]'
Order = 1
