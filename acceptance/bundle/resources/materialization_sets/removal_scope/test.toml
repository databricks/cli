# Creates its own schema and deletes it on exit. Override MATSET_CATALOG where `main` is absent.
Cloud = true

Ignore = [
    ".databricks",
    "databricks.yml",
]

# The workspace host, which only a cloud run puts in the output.
[[Repls]]
Old = 'https://[a-z0-9.-]+\.cloud\.databricks\.com'
New = '[DATABRICKS_URL]'

# Fake SQL endpoint so create_table.py works against the local test server too.
[[Server]]
Pattern = "POST /api/2.0/sql/statements/"
Response.Body = '{"status": {"state": "SUCCEEDED"}, "manifest": {"schema": {"columns": []}}}'

# The cleanup drops the source table; the fake has no delete handler for one.
[[Server]]
Pattern = "DELETE /api/2.1/unity-catalog/tables/{full_name}"
Response.Body = '{}'
