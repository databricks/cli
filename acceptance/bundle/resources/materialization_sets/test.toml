# Local-only for now. The fake in libs/testserver/materialization_set.go mirrors
# UpdateMaterializationSet's reconcile semantics, so these goldens are a claim about the real API;
# turning on Cloud = true checks that claim against a workspace. See README.md for the delta.
Ignore = [
    "databricks.yml",
    ".databricks",
]

# Deployment history has no "materialization_sets." or "features." resource-key prefix, so the
# deploy fails before anything is created. See dmsResourceTypes in
# libs/testserver/bundledeployments.go, which mirrors Universe.
EnvMatrixExclude.no_matset_dms = ["DMS=true"]
