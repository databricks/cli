# Local only. Every arm needs an online member, and the integration workspaces have no online store.
# Run it against a workspace by hand, naming one with MATSET_ONLINE_STORE. Creates
# its own schema and deletes it on exit.
Cloud = false

Ignore = [
    ".databricks",
    "databricks.yml",
]

# A real materialization set or member id is 32 undashed hex characters; the harness's built-in
# replacement only matches the dashed form the fake produces.
[[Repls]]
Old = '\b[0-9a-f]{32}\b'
New = '[UUID]'

# The workspace host, which only a cloud run puts in the output.
[[Repls]]
Old = 'https://[a-z0-9.-]+\.cloud\.databricks\.com'
New = '[DATABRICKS_URL]'

# The cleanup drops the source table; the fake has no delete handler for one.
[[Server]]
Pattern = "DELETE /api/2.1/unity-catalog/tables/{full_name}"
Response.Body = '{}'
