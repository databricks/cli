bundle:
  name: test-matset-invalid-members

resources:
  materialization_sets:
    set1:
      # The shorthand expands into an offline and an online member, and the offline one is the
      # member written out below. Neither declaration shows that on its own.
      batch_offline_and_online_materialized_features:
        - feature_name: main.default.feat
          offline_store_config:
            catalog_name: main
            schema_name: default
            table_name_prefix: feat_off
          online_store_config:
            online_store_name: store
            catalog_name: main
            schema_name: default
            table_name_prefix: feat
          cron_schedule_trigger:
            mode: DERIVED
      materialized_features:
        - feature_name: main.default.feat
          offline_store_config:
            catalog_name: main
            schema_name: default
            table_name_prefix: feat_off
          cron_schedule_trigger:
            mode: DERIVED
