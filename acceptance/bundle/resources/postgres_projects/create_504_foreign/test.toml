Badness = "After a create request fails with a 504, deploy looks the project up by name and takes a project that the deploying user owns and that was created within a few seconds before the request, or after it. That does not tell the bundle's own project from one the same user created another way: another bundle or target, a script, or the same service principal in another CI job. Here the project was created outside the bundle, and the 504 was returned before the backend handled the request, so the bundle created nothing; without the 504 the same deploy fails with 'already exists'. Destroy then deletes the project and its data. Deploy should take a project only when it can tell that its own request created it, and otherwise fail as it does without the 504."

Cloud = false
EnvMatrix.READPLAN = []
Env.DATABRICKS_BUNDLE_ENGINE = "direct"
Env.DATABRICKS_BUNDLE_RETRY_INTERVAL_MS = "100"
SuppressLines.warn_retry = ""
