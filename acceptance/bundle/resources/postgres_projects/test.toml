Cloud = true

# Lakebase v2 (postgres) is only available in AWS as of January 2026
CloudEnvs.gcp = false
CloudEnvs.azure = false

# Run on both direct and Terraform modes

Ignore = [
    "databricks.yml",
    ".databricks",
]

[[Repls]]
# Clean up ?[ow]=<num> suffix after URL since not all workspaces have that
Old = '\?[ow]=\[(WORKSPACE_ID|ALPHANUMID)\]'
New = ''
Order = 1000

[[Repls]]
# Normalize project UIDs (proj-xxx-yyy-zzz format, supports both word-based and hex-based UIDs)
Old = 'proj-[a-z]+-[a-z]+-[a-z0-9]+'
New = '[PROJECT_UID]'
Order = 1

[[Repls]]
# Normalize postgres operation IDs in paths (unique per operation)
Old = '/operations/[A-Za-z0-9+/=]+'
New = '/operations/[OPERATION_ID]'
Order = 2000

[[Repls]]
# Backend default that differs per cloud (8 TiB on the testserver and gcp, 32 TiB on aws).
Old = '"branch_logical_size_limit_bytes": \d+'
New = '"branch_logical_size_limit_bytes": [BRANCH_SIZE_LIMIT]'
