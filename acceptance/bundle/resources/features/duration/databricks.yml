bundle:
  name: test-bundle

variables:
  settling:
    default: 30m

resources:
  features:
    rollingfeat:
      full_name: main.myschema.rollingfeat
      source:
        delta_table_source:
          full_name: main.myschema.mysource
        lateness:
          settling_delay: ${var.settling}
      function:
        aggregation_function:
          count_function:
            input: amount
          time_window:
            rolling:
              window_duration: 7d
              delay: 1h
      entities:
        - name: account_id
      timeseries_column:
        name: event_ts

    slidingfeat:
      full_name: main.myschema.slidingfeat
      source:
        delta_table_source:
          full_name: main.myschema.mysource
      function:
        aggregation_function:
          count_function:
            input: amount
          time_window:
            sliding:
              window_duration: 1w
              slide_duration: 1d
              offset: 22h
              delay: 15m
      entities:
        - name: account_id
      timeseries_column:
        name: event_ts

    sawtoothfeat:
      full_name: main.myschema.sawtoothfeat
      source:
        delta_table_source:
          full_name: main.myschema.mysource
      function:
        aggregation_function:
          count_function:
            input: amount
          time_window:
            sawtooth:
              window_duration: 3d15m
      entities:
        - name: account_id
      timeseries_column:
        name: event_ts

    tumblingfeat:
      full_name: main.myschema.tumblingfeat
      source:
        delta_table_source:
          full_name: main.myschema.mysource
      function:
        aggregation_function:
          count_function:
            input: amount
          time_window:
            tumbling:
              window_duration: 1d
              offset: 6h
      entities:
        - name: account_id
      timeseries_column:
        name: event_ts
