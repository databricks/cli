bundle:
  name: test-bundle

variables:
  secret_value:
    description: "Test secret value"
    sensitive: true
  other_secret_value:
    description: "Test secret value that is not marked as sensitive"

resources:
  secrets:
    secret1:
      catalog_name: main
      schema_name: default
      name: test_secret
      value: ${var.secret_value}
    secret2:
      catalog_name: main
      schema_name: default
      name: other_test_secret
      value: ${var.other_secret_value}
