Cloud = true
Badness = "The plan does not look for a secret whose schema was renamed outside the bundle: a secret has no internal id, so the plan cannot tell it from an unrelated secret at the new name and creates it again. The create fails with ALREADY_EXISTS, and since the secret is then no longer tracked, every later deploy fails the same way. The secret should be found under the schema's new name, for example by recording an id that adoption can check."

Ignore = [
    ".databricks",
    ".gitignore",
    "databricks.yml",
]
