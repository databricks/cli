Cloud = false
RecordRequests = true

Ignore = [".databricks", ".gitignore"]

EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

# This test prints the whole state file, and recording adds the record_deployment_history
# feature to its header, so the two DMS variants cannot share one golden. What the test is
# actually about — that the secret value stays out of the state — does not vary by variant.
EnvMatrix.DMS = [""]
