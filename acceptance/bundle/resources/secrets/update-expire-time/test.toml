RecordRequests = true

Ignore = [".databricks", ".gitignore"]

# Secrets are only implemented in the direct engine.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

# secrets/basic runs on cloud, so the expire_time semantics here are verified
# against a real workspace too.
Cloud = true

# The root test.toml collapses every timestamp to [TIMESTAMP], which would hide
# the change this test is about. Label the two values distinctly instead; Order
# below the root rule's 10 makes these win.
[[Repls]]
Old = '2030-01-01T00:00:00Z'
New = '[EXPIRE_TIME_BEFORE]'
Order = 1

[[Repls]]
Old = '2031-06-15T12:00:00Z'
New = '[EXPIRE_TIME_AFTER]'
Order = 1

# metastore_id is a workspace-global UUID: a fixed testserver literal locally, a real UUID on
# cloud. Normalize both so the plan golden is stable across environments. Order below the root
# numeric rules (default 0) so a cloud UUID is captured whole before digit-run rules nibble it.
[[Repls]]
Old = 'test-metastore-id'
New = '[METASTORE_ID]'
Order = -1

[[Repls]]
Old = '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
New = '[METASTORE_ID]'
Order = -1
