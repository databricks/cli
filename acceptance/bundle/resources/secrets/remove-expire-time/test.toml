RecordRequests = true

Ignore = [".databricks", ".gitignore"]

# Secrets are only implemented in the direct engine.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

# secrets/basic runs on cloud, so the expire_time semantics here are verified
# against a real workspace too.
Cloud = true

# Removing expire_time does not take effect: the engine masks the whole secret with
# update_mask=* and omits the field, and the API keeps the previous value (verified
# against a real workspace on 2026-08-25). Unlike the postgres project case the
# difference is at least visible, because the secret GET echoes expire_time, so every
# later plan asks for the removal again. out.plan.drift.direct.json records that.
Badness = "Removing expire_time never takes effect: the API keeps the previous value, so deploy reports success and every later plan asks for the removal again"

# The root test.toml collapses every timestamp to [TIMESTAMP], which would hide the
# value this test removes. Label it distinctly instead; Order below the root rule's
# 10 makes this win.
[[Repls]]
Old = '2030-01-01T00:00:00Z'
New = '[EXPIRE_TIME_BEFORE]'
Order = 1
