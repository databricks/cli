bundle:
  name: pipeline-testing

resources:
  pipelines:
    orders:
      name: orders
      libraries:
        - glob:
            include: ./transformations/**
      testing:
        sources:
          - glob:
              include: ./tests/**
        environment:
          dependencies:
            - -e .[test]
            - -r ./tests/requirements.txt
            - ./dist/*.whl
