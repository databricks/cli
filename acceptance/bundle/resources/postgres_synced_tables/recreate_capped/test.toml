# Local-only, direct-only: exercises the direct engine's post-delete poll on a synced
# table and the RESOURCE_MAX_WAIT cap on it. INJECT_STALE_ON_DIRECT turns on the
# testserver's eventual-consistency simulation, under which a deleted synced table
# lingers in DELETING until the next GET, so:
#   - a normal recreate polls through the DELETING window and succeeds, and
#   - capping the wait to 0 skips it, so the create races the still-deleting table and
#     fails with 409 ALREADY_EXISTS.
# Not run on cloud (would need a real source table) or on terraform (recreates without
# polling, so the lingering table would fail its create too — the flag is direct-only).
# Both are covered against a real workspace by ../recreate.
Cloud = false
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
Env.INJECT_STALE_ON_DIRECT = "1"
RecordRequests = true
