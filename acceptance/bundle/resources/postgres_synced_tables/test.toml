Cloud = true

Ignore = [
    "databricks.yml",
    ".databricks",
]

[[Repls]]
# Clean up ?[ow]=<num> suffix after URL since not all workspaces have that
Old = '\?[ow]=\[(WORKSPACE_ID|ALPHANUMID)\]'
New = ''
Order = 1000

[[Server]]
Pattern = "DELETE /api/2.1/unity-catalog/tables/{full_name}"
Response.Body = '{"status": "OK"}'
