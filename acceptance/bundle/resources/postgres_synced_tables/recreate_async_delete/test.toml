# Local-only, direct-only: exercises the recreate poll-retry when a synced table's delete
# is asynchronous. INJECT_STALE_ON_DIRECT makes the testserver leave the deleted table in
# DELETING until the next GET, so the follow-up create first hits 409 ALREADY_EXISTS; the
# recreate then polls the old table until it disappears and retries the create, which
# succeeds. Not run on cloud (needs a real source table) or on terraform (direct-only flag).
Cloud = false
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
Env.INJECT_STALE_ON_DIRECT = "1"
