# Local-only, direct-only: exercises the direct engine's post-delete poll on a synced
# table. INJECT_STALE_ON_DIRECT turns on the testserver's eventual-consistency
# simulation, under which a deleted synced table lingers in DELETING until the next
# GET. The recreate then polls through that window (present, then gone) before
# re-creating, instead of racing a 409.
# Not run on cloud (would need a real source table) or on terraform (recreates without
# polling, so the lingering table would fail its create — the flag is direct-only).
# The recreate itself is covered against a real workspace by ../recreate.
Cloud = false
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
Env.INJECT_STALE_ON_DIRECT = "1"
RecordRequests = true
