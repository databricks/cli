Local = true
# Run against a real workspace too, so the golden keeps the message the fake
# returns honest: the fake is only useful here if it matches what MLflow says.
Cloud = true
RecordRequests = false
Ignore = [".databricks"]

# The error surface is the same on both engines, but terraform wraps it in its
# own output; keep a single golden.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
