# suspend_timeout_duration and no_suspension are two sides of one oneof. The API
# masks them together under spec.suspension and rejects either field name, so
# removing the field is answered with 400 INVALID_PARAMETER_VALUE just like changing
# it (postgres_endpoints/update_suspend_timeout). Separate fix from the diffing this
# test covers.
#
# out.plan.drift.direct.* records what the failed removal leaves behind: the old
# value stays in state, so every later deploy plans the removal again and fails again.
Badness = "Direct engine cannot remove suspend_timeout_duration: it masks the field under its own name, but the API only accepts the oneof group name spec.suspension, so the removal fails on every deploy"
