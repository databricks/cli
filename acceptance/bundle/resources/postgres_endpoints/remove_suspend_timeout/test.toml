# Verified against a real workspace on 2026-11-19: the engine masks the whole spec and omits
# suspend_timeout_duration from the body. The API accepts it and keeps 300s, but echoes back
# the spec as sent, so out.plan.drift.json shows no drift. Before update_mask=spec this
# deploy failed with 400 "Field 'spec.suspension' is in update_mask but not provided in
# request". The supported way to stop an endpoint suspending is to set the other member of
# the oneof, no_suspension: true.
Badness = "Removing suspend_timeout_duration is silently ignored: the deploy succeeds and the plan shows no drift, but the endpoint keeps the old timeout. Setting no_suspension: true instead is the supported way to express it"
