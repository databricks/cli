# Local-only (overrides the inherited Cloud = true). This records the whole `bundle plan
# -o json` so the suppression is legible at every cluster-spec location; the plan's
# remote_state and *_attributes are cloud- and region-specific, so it cannot be recorded
# portably across the aws/azure/gcp sweep. The suppression behavior itself is cloud-verified
# by the projected jobs/cluster_policy tests.
Cloud = false

RecordRequests = false

Ignore = [
    "databricks.yml",
]
