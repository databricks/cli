Cloud = true
Badness = "After deploy, bundle summary prints the synced table's name unresolved, as '${resources.database_catalogs.my_catalog.name}.${resources.database_catalogs.my_catalog.database_name}.my_synced_table', and builds its URL from that string. It should print the resolved name (my_catalog_<name>.my_database.my_synced_table) and a working URL."

RecordRequests = false

# The test fails with this today:
# Error: cannot create resources.synced_database_tables.my_synced_table: Cannot create more than 20 synced database table(s) per source table. (400 BAD_REQUEST)
RunsOnDbr = false

[[Repls]]
# clean up ?[ow]=<num> suffix after URL since not all workspaces have that
Old = '\?[ow]=\[(WORKSPACE_ID|ALPHANUMID)\]'
New = ''
Order = 1000

[[Server]]
Pattern = "DELETE /api/2.1/unity-catalog/tables/{full_name}"
Response.Body = '{"status": "OK"}'
