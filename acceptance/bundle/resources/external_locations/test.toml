Local = true
# External locations require actual storage credentials with cloud IAM setup
# which are environment-specific, so we only test locally with the mock server
Cloud = false
RecordRequests = false
RequiresUnityCatalog = true

Ignore = [
    ".databricks",
    "databricks.yml",
]

# Also run with --planmode=offline: plan/deploy issue the same requests with or without --planmode=offline
# so the recorded output is identical across variants.
EnvRepl.PLANMODE = false

[EnvMatrix]
  DATABRICKS_BUNDLE_ENGINE = ["direct"]
  PLANMODE = ["", "--planmode=offline"]

[[Repls]]
Old = " --planmode=offline"
New = ""
