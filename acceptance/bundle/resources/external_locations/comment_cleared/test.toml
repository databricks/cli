# External locations need real storage credentials with cloud IAM setup, so this
# only runs against the mock server (same as the parent test).
Cloud = false
# The parent test disables request recording; this one asserts on the payload.
RecordRequests = true

# UpdateExternalLocation payload construction is direct-engine-specific.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

Ignore = [
    ".databricks",
    ".gitignore",
    "databricks.yml",
    "databricks.yml.orig",
]
