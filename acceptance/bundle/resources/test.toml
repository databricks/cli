RecordRequests = true

# These normalize what deployment history recording adds to a deploy's output, so a test
# asserts the same golden files whether or not recording is on - that is the point of the
# DMS run, rather than keeping a second copy of 600-odd output files. They live here
# rather than in the parent so bundle/dms, which asserts the recording itself, does not
# inherit them.
#
# The stamp on jobs and pipelines, which the plan reports as a change of its own. It shows
# up at whatever depth the enclosing object sits at, so the indent is matched loosely; the
# body lines are matched as `"key": value` pairs rather than `.*` so the match stops at the
# entry's own closing brace instead of running into its siblings. (Go's regexp is RE2, so
# the indent cannot be captured and back-referenced.)
[[Repls]]
Old = '(?m)^ *"deployment\.(deployment_id|version_id)": \{\n(?: *"[a-z_]+": .*\n)+ *\},\n'
New = ''

# Same entry when it is the last one in the object, so the comma is on the line before.
[[Repls]]
Old = '(?m),\n *"deployment\.(deployment_id|version_id)": \{\n(?: *"[a-z_]+": .*\n)+ *\}\n'
New = '''
'''

# And when it is the only entry, the whole "changes" object exists because of recording.
[[Repls]]
Old = '(?m)^ *"changes": \{\n *"deployment\.(deployment_id|version_id)": \{\n(?: *"[a-z_]+": .*\n)+ *\}\n *\},?\n'
New = ''
