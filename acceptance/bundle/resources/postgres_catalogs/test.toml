Cloud = true

Ignore = [
    "databricks.yml",
    ".databricks",
]

[[Repls]]
# Clean up ?[ow]=<num> suffix after URL since not all workspaces have that
Old = '\?[ow]=\[(WORKSPACE_ID|ALPHANUMID)\]'
New = ''
Order = 1000

[[Repls]]
# Normalize postgres operation IDs (unique per operation).
Old = '/operations/[A-Za-z0-9+/=-]+'
New = '/operations/[OPERATION_ID]'
Order = 2000
