Cloud = false # Temporary disable cloud tests until the API is fully available

# immutable_folder only works with the direct engine.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

# The test rewrites the deployment state by hand, which the recording service refuses because it
# no longer matches the deployment it has recorded, so run without deployment history.
EnvMatrix.DMS = [""]

Ignore = [
    "databricks.yml",
    ".databricks",
    "tmp.*",
]

[[Repls]]
# Replace snapshot hash with SNAPSHOT_HASH
Old = "[0-9a-f]{64}"
New = "[SNAPSHOT_HASH]"
