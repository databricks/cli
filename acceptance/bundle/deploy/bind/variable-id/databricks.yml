bundle:
  name: test-bind-variable-id

variables:
  job_id:
    description: ID of the existing job to bind
    default: "PLACEHOLDER_JOB_ID"

resources:
  jobs:
    foo:
      name: test-bind-job
      environments:
        - environment_key: default
          spec:
            client: "1"
      tasks:
        - task_key: my_task
          environment_key: default
          spark_python_task:
            python_file: /Workspace/test.py

targets:
  default:
    bind:
      jobs:
        foo:
          id: ${var.job_id}
