bundle:
  name: test-bind-dev-mode

resources:
  jobs:
    foo:
      name: test-bind-job
      schedule:
        quartz_cron_expression: "0 0 12 * * ?"
        timezone_id: UTC
      environments:
        - environment_key: default
          spec:
            client: "1"
      tasks:
        - task_key: my_task
          environment_key: default
          spark_python_task:
            python_file: /Workspace/test.py
      lifecycle:
        bind:
          id: "PLACEHOLDER_JOB_ID"

targets:
  default:
    mode: development
