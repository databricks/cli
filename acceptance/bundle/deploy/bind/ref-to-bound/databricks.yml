bundle:
  name: test-bind-ref-to-bound

resources:
  jobs:
    foo:
      name: test-bind-job
      environments:
        - environment_key: default
          spec:
            client: "1"
      tasks:
        - task_key: my_task
          environment_key: default
          spark_python_task:
            python_file: /Workspace/test.py
      lifecycle:
        bind:
          id: "PLACEHOLDER_JOB_ID"
    bar:
      name: test-bind-runner
      tasks:
        - task_key: run_foo
          run_job_task:
            job_id: ${resources.jobs.foo.id}
