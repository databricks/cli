bundle:
  name: test-bind-target-override

resources:
  jobs:
    foo:
      name: test-bind-job
      environments:
        - environment_key: default
          spec:
            client: "1"
      tasks:
        - task_key: my_task
          environment_key: default
          spark_python_task:
            python_file: /Workspace/test.py
      lifecycle:
        bind:
          id: "999999999"

targets:
  default:
    resources:
      jobs:
        foo:
          lifecycle:
            bind:
              id: "PLACEHOLDER_JOB_ID"
