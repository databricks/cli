bundle:
  name: test-bind-duplicate-id-config

resources:
  jobs:
    foo:
      name: test-bind-dup-config-foo
      environments:
        - environment_key: default
          spec:
            client: "1"
      tasks:
        - task_key: my_task
          environment_key: default
          spark_python_task:
            python_file: ./hello.py
      lifecycle:
        bind:
          id: "12345"
    bar:
      name: test-bind-dup-config-bar
      environments:
        - environment_key: default
          spec:
            client: "1"
      tasks:
        - task_key: my_task
          environment_key: default
          spark_python_task:
            python_file: ./hello.py
      lifecycle:
        bind:
          id: "12345"
