bundle:
  name: test-bind-duplicate-id-config

resources:
  jobs:
    foo:
      name: test-bind-dup-config-foo
      environments:
        - environment_key: default
          spec:
            client: "1"
      tasks:
        - task_key: my_task
          environment_key: default
          spark_python_task:
            python_file: ./hello.py
    bar:
      name: test-bind-dup-config-bar
      environments:
        - environment_key: default
          spec:
            client: "1"
      tasks:
        - task_key: my_task
          environment_key: default
          spark_python_task:
            python_file: ./hello.py

targets:
  default:
    bind:
      jobs:
        foo:
          id: "12345"
        bar:
          id: "12345"
