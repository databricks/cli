# WAL (Write-Ahead Log) tests verify crash recovery during bundle deployment.
# These tests simulate process crashes using KillCaller and verify state recovery.
# Only runs with direct engine since WAL is a direct-engine feature.
#
# Not run under deployment history recording, and not planned to be: WAL recovery is a
# non-recording concept - under recording the service is the source of truth and a leftover WAL is
# discarded, not replayed (see dstate.Open; the DMS side is covered by bundle/dms) - so there is
# nothing here a DMS run would exercise.

Env.DATABRICKS_CLI_TEST_PID = "1"

EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]
EnvMatrix.DMS = [""]

[[Repls]]
Old = 'script: line \d+:\s+\d+ Killed(: 9)?\s+"\$@"'
New = '[PROCESS_KILLED]'

[[Repls]]
Old = '(\n>>> errcode [^\n]+\n)\nExit code:'
New = "${1}[PROCESS_KILLED]\n\nExit code:"

[[Repls]]
Old = 'Exit code: 137'
New = 'Exit code: [KILLED]'

# On Linux, a KillCaller kill may surface as exit code 1 rather than 137.
# Only normalise exit code 1 when it directly follows [PROCESS_KILLED] to
# avoid masking genuine error exits (lineage-mismatch, future-serial-wal).
[[Repls]]
Old = '(\[PROCESS_KILLED\]\n\nExit code: )1'
New = '${1}[KILLED]'

# On Windows, no bash "Killed" message appears when CLI has produced output before termination.
# The kill lands during resource apply, right after the "Uploading bundle files"
# line, so that line is immediately followed by "Exit code: 1" (a genuine error
# exit prints an "Error:" line in between and is left untouched).
[[Repls]]
Old = '(Uploading bundle files to [^\n]+)\n\nExit code: 1'
New = "${1}\n[PROCESS_KILLED]\n\nExit code: [KILLED]"
