Cloud=true
# The MLOps Stacks template registers the model in Unity Catalog and runs its
# jobs on serverless compute, so this test only works on a UC-enabled workspace
# (which also has serverless jobs). Gate on UC so it skips on the non-UC cloud
# envs instead of failing with METASTORE_DOES_NOT_EXIST.

Badness = "A freshly initialized mlops-stacks bundle warns on every command: 'expected a string value, found null' at targets.dev.workspace.host and 'unknown field: description' at resources.experiments.experiment. A new bundle from the template should validate without warnings."

Ignore = [
    "config.json"
]

[[Repls]]
Old = "aws|azure|gcp"
New = "[CLOUD_ENV_BASE]"

# $TESTDIR uses backslashes on Windows, hence the either-separator match.
[[Repls]]
Old = 'bundle init .*[\\/]mlops-stacks/template'
New = "bundle init mlops-stacks"
