Local = true
Cloud = true
# Deploys a job with a job cluster and spark_jar_task
RequiresClassic = true
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["terraform", "direct"]

Ignore = [
    'myjar/PrintArgs.jar',
    'myjar/PrintArgs.class',
]

[[Server]]
Pattern = "GET /api/2.2/jobs/runs/get-output"
Response.Body = '''
{
	"run_id": 1234567890,
	"logs": "Hello from Jar!\n[]"
}
'''
