Cloud = true

# Room for one task retry, which waits for a new job cluster.
TimeoutCloud = '40m'

Ignore = [
    'myjar/PrintArgs.jar',
    'myjar/PrintArgs.class',
]

[[Server]]
Pattern = "GET /api/2.2/jobs/runs/get-output"
Response.Body = '''
{
	"run_id": 1234567890,
	"logs": "Hello from Jar!\n[]"
}
'''

[[Repls]]
Old = '/runs/\d+'
New = '/runs/[RUN_ID]'
