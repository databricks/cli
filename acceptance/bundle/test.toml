# This allows recording per-deployment output files, e.g. $CLI bundle deploy > out.$DATABRICKS_BUNDLE_ENGINE.txt
EnvVaryOutput = "DATABRICKS_BUNDLE_ENGINE"

# Runs the whole bundle suite with deployment history recording on, so the deployment metadata
# service (DMS) is exercised by every test rather than only the handful under bundle/dms. Empty
# is the default pair of engine runs. CI gives this variant its own cell ("directdms"), so the
# direct cell still runs each test once; a local run covers both.
EnvMatrix.DMS = ["", "true"]

# DMS recording is only supported by the direct engine; it is a no-op on terraform.
EnvMatrixExclude.dms_needs_direct = ["DMS=true", "DATABRICKS_BUNDLE_ENGINE=terraform"]

# deploy --plan is not yet supported with deployment history recording (planned for a followup),
# so skip the recording + saved-plan combination.
EnvMatrixExclude.dms_no_readplan = ["DMS=true", "READPLAN=1"]

# The DMS run asserts the same golden files as the engine runs.
EnvRepl.DMS = false

Ignore = ["databricks.yml"]

# The lowest Python version we support. Alternative to "uv run --python 3.10"
Env.UV_PYTHON = "3.10"

# The link a recorded deploy prints, dropped so a test asserts the same output whether or
# not recording is on. The URL itself is covered by workspaceurls.TestDeploymentURL, and
# the calls behind it by bundle/dms/record.
[[Repls]]
Old = '(?m)^Current Deployment Version: .*\n'
New = ''

# User-agent:
[[Repls]]
Old = 'os/darwin'
New = 'os/[OS]'

[[Repls]]
Old = 'os/windows'
New = 'os/[OS]'

[[Repls]]
Old = 'os/linux'
New = 'os/[OS]'

[[Repls]]
Old = ' cicd/github'
New = ''
