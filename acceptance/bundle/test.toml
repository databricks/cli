# This allows recording per-deployment output files, e.g. $CLI bundle deploy > out.$DATABRICKS_BUNDLE_ENGINE.txt
EnvVaryOutput = "DATABRICKS_BUNDLE_ENGINE"

# The lowest Python version we support. Alternative to "uv run --python 3.10"
Env.UV_PYTHON = "3.10"

Ignore = ["databricks.yml"]

# User-agent:
[[Repls]]
Old = 'os/darwin'
New = 'os/[OS]'

[[Repls]]
Old = 'os/windows'
New = 'os/[OS]'

[[Repls]]
Old = 'os/linux'
New = 'os/[OS]'

[[Repls]]
Old = ' cicd/github'
New = ''

# Mask the serialized_dashboard content hash before the generic numeric/id rules can
# nibble digit-runs out of the hex (Order below their default). Distinct numbers the
# hashes, so old==new stays one token and a differing remote gets another
# (e.g. [HASH][0] vs [HASH][1]).
[[Repls]]
Old = "sha256_hashed_in_state:[0-9a-f]{64}"
New = "sha256_hashed_in_state:[HASH]"
Order = -1
Distinct = true
