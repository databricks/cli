EnvMatrix.READPLAN = ["", "1"]
# deploy --plan re-expands the ./dist/*.whl glob instead of using the plan's paths, so after a
# version bump it also uploads the stale 0.1.0 wheel still on disk.
EnvMatrixExclude.stale_whl_with_readplan = ["READPLAN=1"]

[[Repls]]
Old = '(resources.json|terraform.tfstate)'
New = 'STATE_FILENAME'
