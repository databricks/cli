bundle:
  name: test-bundle

artifacts:
  my_test_code:
    type: whl
    files:
      - source: ./dist/my_test_code-0.0.1-py3-none-any.whl
      - source: ./dist/my_test_code-0.0.1-py310-none-any.whl
    dynamic_version: true

resources:
  jobs:
    test_job:
      name: "[${bundle.target}] My Wheel Job"
      tasks:
        - task_key: TestTask
          existing_cluster_id: "0717-132531-5opeqon1"
          python_wheel_task:
            package_name: "my_test_code"
            entry_point: "run"
          libraries:
            - whl: ./dist/my_test_code-0.0.1-py3-none-any.whl
        - task_key: TestTask310
          existing_cluster_id: "0717-132531-5opeqon1"
          python_wheel_task:
            package_name: "my_test_code"
            entry_point: "run"
          libraries:
            - whl: ./dist/my_test_code-0.0.1-py310-none-any.whl
