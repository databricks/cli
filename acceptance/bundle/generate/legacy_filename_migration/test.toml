Ignore = ["resources/"]

[[Server]]
Pattern = "GET /api/2.2/jobs/get"
Response.Body = '''
{
  "job_id": 1234,
  "settings": {
    "name": "test-job"
  }
}
'''

[[Server]]
Pattern = "GET /api/2.0/pipelines/1234"
Response.Body = '''
{
  "pipeline_id": "1234",
  "name": "test-pipeline",
  "spec": {
    "name": "test-pipeline"
  }
}
'''
