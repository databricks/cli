# DMS is a no-op for Terraform; direct DMS generation is covered by its rejection test.
EnvMatrix.DMS = ["", "true"]
EnvMatrixExclude.dms_needs_direct = ["DMS=true", "DATABRICKS_BUNDLE_ENGINE=direct"]

[[Repls]]
Old = "[0-9a-f]{32}"
New = "[DASHBOARD_ID]"

[[Repls]]
Old = '2\d\d\d-\d\d-\d\d(T| )\d\d:\d\d:\d\d(\.\d+(Z|\+\d\d:\d\d)?)?Z'
New = "[TIMESTAMP]"
Order = 9
