Local = true
Cloud = true
# Generates from a pipeline and deploys it; pipelines run on classic compute
RequiresClassic = true

Ignore = [
    "databricks.yml",
    "resources/*",
    "src/*",
    ".databricks",
]

[Env]
# MSYS2 automatically converts absolute paths on Windows; disable for the workspace path.
MSYS_NO_PATHCONV = "1"
