bundle:
  name: test-bundle

resources:
  jobs:
    src:
      name: source
      tasks:
        - task_key: t
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
            # autotermination_minutes has no Terraform equivalent for a job
            # cluster, so it is absent from terraform.tfstate.
            autotermination_minutes: 20
    dst:
      name: dst
      description: ${resources.jobs.src.tasks[0].new_cluster.autotermination_minutes}
