Badness = "Deploy without --auto-approve deletes and recreates the secret scope ('Recreated secret_scopes.foo') without asking, which loses every secret stored in the scope. secret_scopes is not in the deploy approval table (bundle/phases/approval.go), unlike schemas and volumes. Deleting or recreating a secret scope should ask for approval, like other resources that hold data."

# Local-only: the replay fixtures are captured against the fake server, so they reproduce a
# terraform state only there, not on a real workspace (replaying them on cloud fails auth and
# hits backend validation the mock does not enforce).
Cloud = false
RecordRequests = true

Ignore = [
    ".databricks",
    "databricks.yml",
]
