Cloud = false
RecordRequests = true
IncludeRequestHeaders = ["User-Agent"]
# .databricks: engine-internal state; .gitignore: written by script.prepare to keep the replay
# fixtures and out.* files out of the bundle upload (it is not a bundle file itself).
Ignore = [".databricks", ".gitignore"]

# Each test's script sets DATABRICKS_BUNDLE_ENGINE inline; pin the outer
# matrix to ["direct"] so CI's engine filter includes these tests without
# also running the same script twice per engine.
Env.DATABRICKS_BUNDLE_ENGINE = "direct"

# These tests replay a prior terraform deployment (replay_tfstate.py) and then migrate to direct.
# Recording is direct-only, and the DMS variant does not apply to the migration story.
EnvMatrix.DMS = [""]
