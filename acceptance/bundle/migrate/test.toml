Cloud = false
RecordRequests = true
IncludeRequestHeaders = ["User-Agent"]
Ignore = [".databricks"]

# Tests set DATABRICKS_BUNDLE_ENGINE inline. Pin to ["direct"] so CI's engine
# filter includes them without running the script twice.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

# These tests deploy on terraform and then migrate to direct. Recording is direct-only, so
# the terraform half is recorded nowhere and the migration reads state the service lacks.
# Migrating an existing deployment onto the service is its own story.
EnvMatrix.DATABRICKS_BUNDLE_RECORD_DEPLOYMENT_HISTORY = [""]
