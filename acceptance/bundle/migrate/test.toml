Cloud = false
RecordRequests = true
IncludeRequestHeaders = ["User-Agent"]
Ignore = [".databricks"]

# Each test's script sets DATABRICKS_BUNDLE_ENGINE inline; pin the outer
# matrix to ["direct"] so CI's engine filter includes these tests without
# also running the same script twice per engine.
EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

# These tests deploy on terraform first and then migrate to direct. Recording is a
# direct-engine feature, so the resources the terraform half creates are recorded nowhere
# and the migration reads state the service does not have. Migrating a deployment onto the
# service is a story of its own; these tests are not it.
EnvMatrix.DATABRICKS_BUNDLE_RECORD_DEPLOYMENT_HISTORY = [""]
