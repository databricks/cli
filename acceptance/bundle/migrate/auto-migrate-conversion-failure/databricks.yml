bundle:
  name: test-bundle

resources:
  secret_scopes:
    my_scope:
      name: my-scope
      permissions:
        # An unknown level: SecretScopeFixups rejects it when it prepares the
        # config for the direct engine, so the state conversion fails while the
        # terraform deploy itself succeeds.
        - level: BOGUS
          user_name: someone@example.com
