# Both engines keep a lineage-bearing local state file, so the destroy scenario and its
# fix (and the lingering-state failure) apply to both. The mismatch error names the
# engine-specific state file; the Repls below align the terraform and direct forms so
# both engines share one output.txt.

# .databricks.machineA is the stashed local state; may linger if the test fails mid-run.
Ignore = [".databricks.machineA"]

# Needed because the serial is not set under DMS: the state file persists none, so the candidate
# list the CLI prints shows serial=0 where a non-recording run shows the file's counter.
[[Repls]]
Old = 'serial=[0-9]+'
New = 'serial=[SERIAL]'

# Align the terraform vs direct state-file listing in the lineage-mismatch error so the
# matrix variants produce identical output. Scoped by the ": remote/local <engine> state"
# suffix so the find.py argument above is left untouched.
[[Repls]]
Old = '\.databricks/bundle/default/(resources\.json|terraform/terraform\.tfstate): local (direct|terraform) state'
New = '.databricks/bundle/default/[STATE_FILE]: local [ENGINE] state'

[[Repls]]
Old = '(resources\.json|terraform\.tfstate): remote (direct|terraform) state'
New = '[STATE_FILE]: remote [ENGINE] state'
