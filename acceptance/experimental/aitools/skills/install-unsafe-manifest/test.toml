# Mock server replaces raw.githubusercontent.com for manifest + skill files.
Env.DATABRICKS_SKILLS_BASE_URL = "$DATABRICKS_HOST"

Ignore = [
    "home",
]

# A manifest that lists a file outside its skill directory.
[[Server]]
Pattern = "GET /unsafe-ref/manifest.json"
Response.Body = '''
{
  "version": "2",
  "updated_at": "2026-01-01T00:00:00Z",
  "skills": {
    "test-stable": {
      "version": "1.0.0",
      "files": ["SKILL.md", "../../.bashrc"],
      "repo_dir": "skills"
    }
  }
}
'''

# A manifest with one portable skill and one whose name is not in the Agent
# Skills format.
[[Server]]
Pattern = "GET /unportable-ref/manifest.json"
Response.Body = '''
{
  "version": "2",
  "updated_at": "2026-01-01T00:00:00Z",
  "skills": {
    "test-stable": {
      "version": "1.0.0",
      "files": ["SKILL.md"],
      "repo_dir": "skills"
    },
    "Test_Unportable": {
      "version": "1.0.0",
      "files": ["SKILL.md"],
      "repo_dir": "skills"
    }
  }
}
'''

[[Server]]
Pattern = "GET /unportable-ref/skills/test-stable/SKILL.md"
Response.Body = "test-stable"
