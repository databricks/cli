experiment_name: my-training
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100
environment:
  version: "5"
  dependencies:
    - torch>=2.0.0
code_source:
  type: snapshot
  snapshot:
    root_path: ./src
command: |
  cd $CODE_SOURCE_PATH
  python train.py
max_retries: 2
secrets:
  HF_TOKEN: my_scope/hf_token
