# The SDK occasionally probes host reachability with a HEAD request; stub it so
# the test is deterministic.
[[Server]]
Pattern = "HEAD /"
Response.Body = ''

# GET :get reports the currently-registered image as AVAILABLE with an older
# digest. Under `auto` this drives the cached fast-path; under `latest` it is the
# "before" digest compared against the freshly registered one.
[[Server]]
Pattern = "GET /api/2.0/ai-compute-manager/images:get"
Response.Body = '''
{"docker_image_url": "docker.io/library/my-image:latest", "state": "AVAILABLE", "manifest_sha256": "a1b2c3d4e5f6a7b8oldoldoldold"}
'''

# POST re-registers the image and returns a newer digest, so `latest` sees the
# image as updated.
[[Server]]
Pattern = "POST /api/2.0/ai-compute-manager/images"
Response.Body = '''
{"image": {"docker_image_url": "docker.io/library/my-image:latest", "state": "AVAILABLE", "manifest_sha256": "f9e8d7c6b5a4f3e2newnewnewnew"}}
'''
