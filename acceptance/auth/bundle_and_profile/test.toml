# Some of the clouds have DATABRICKS_HOST variable setup without https:// prefix
# In the result, output is replaced with DATABRICKS_URL variable instead of DATABRICKS_HOST
# This is a workaround to replace DATABRICKS_URL with DATABRICKS_HOST
[[Repls]]
Old='DATABRICKS_HOST'
New='DATABRICKS_TARGET'

[[Repls]]
Old='DATABRICKS_URL'
New='DATABRICKS_TARGET'

[[Repls]]
Old='Get "https://non.existing.subdomain.databricks.test/api/2.0/preview/scim/v2/Me\??": .*'
New='Get "https://non.existing.subdomain.databricks.test/api/2.0/preview/scim/v2/Me": (redacted)'

[[Repls]]
Old='Get "https://baz.test/api/2.0/preview/scim/v2/Me\??": .*'
New='Get "https://baz.test/api/2.0/preview/scim/v2/Me": (redacted)'

# bundle validate reads the current user from identity/me. The text after the URL depends on
# the platform and the server's response, so it is redacted, as for the SCIM lookups above.
[[Repls]]
Old='Get "https://baz.test/api/2.0/identity/me\??": .*'
New='Get "https://baz.test/api/2.0/identity/me": (redacted)'
