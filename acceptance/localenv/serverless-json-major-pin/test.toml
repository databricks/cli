EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

Env.DATABRICKS_LOCALENV_CONSTRAINT_SOURCE_URL_TEST_OVERRIDE = "$DATABRICKS_HOST"
# Serverless pins databricks-connect by major (~=17.0) across every env
# (environments#15), a compatible-release range rather than a concrete version.
# Under --dry-run validate never runs, so dbconnectVersion must be omitted rather
# than reporting the "17.0" floor nothing installs. This is the live serverless
# shape; serverless-json covers the concrete full-pin path.

[[Server]]
Pattern = "GET /serverless/serverless-v4/pyproject.toml"
Response.Body = '''
[project]
requires-python = ">=3.12"

[dependency-groups]
dev = ["databricks-connect~=17.0"]

[tool.uv]
constraint-dependencies = ["pyarrow<19", "pandas<3"]
'''

[[Repls]]
Old = 'uv uv \S+(?: \([^)]+\))?'
New = 'uv [UV_VERSION]'
