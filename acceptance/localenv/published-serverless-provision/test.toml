# The one test that runs a real `uv sync` against the real published
# databricks/environments artifacts: setup-local creates a working .venv and
# uv.lock and reports every phase ok. It needs network access to the artifacts
# and a package index, so it runs on cloud only (the script skips locally); the
# local suite covers the same pipeline with --dry-run and fake uv binaries.
Cloud = true

# Files the real provision writes; their contents follow the published repo and
# the package index, so the output asserts them by presence instead.
Ignore = ["project", "uv-python"]
