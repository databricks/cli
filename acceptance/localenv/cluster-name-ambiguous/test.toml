EnvMatrix.DATABRICKS_BUNDLE_ENGINE = []

[Env]
DATABRICKS_LOCALENV_CONSTRAINT_SOURCE = "$DATABRICKS_HOST"

# Two clusters share the same name, so name→ID resolution is ambiguous: the
# Clusters API errors, surfaced as an actionable E_RESOLVE at the resolve phase.
[[Server]]
Pattern = "GET /api/2.1/clusters/list"
Response.Body = '''
{
  "clusters": [
    {"cluster_id": "cid-123", "cluster_name": "dup", "spark_version": "15.4.x-scala2.12"},
    {"cluster_id": "cid-999", "cluster_name": "dup", "spark_version": "14.3.x-scala2.12"}
  ]
}
'''
