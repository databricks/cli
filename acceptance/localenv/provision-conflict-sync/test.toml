EnvMatrix.DATABRICKS_BUNDLE_ENGINE = ["direct"]

# The fake uv is a bash script, so this test cannot run on Windows runners
# (mirrors acceptance/cmd/psql).
GOOS.windows = false

# setup-local writes pyproject.toml through the merge phase (backing up the
# committed one) before uv sync runs; the assertion is the JSON output, so ignore
# the mutated file and its backup. No .venv is created because the fake uv fails
# the sync before anything is written.
Ignore = ["pyproject.toml", "pyproject.toml.bak", ".venv"]

Env.DATABRICKS_LOCALENV_CONSTRAINT_SOURCE_URL_TEST_OVERRIDE = "$DATABRICKS_HOST"

[[Server]]
Pattern = "GET /serverless/serverless-v4/pyproject.toml"
Response.Body = '''
[project]
requires-python = ">=3.12"

[dependency-groups]
dev = ["databricks-connect~=17.2.0"]
'''
